<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baby Caring</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Comic Neue', cursive;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec, #fff9c4);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .slide { transition: transform 0.3s ease-in-out; }
    .slide.hidden { transform: translateX(100%); display: none; }
    .slide-left.hidden { transform: translateX(-100%); display: none; }
    .btn-icon { transition: transform 0.2s; }
    .btn-icon:hover { transform: scale(1.1); }
    .shadow-glow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); }
    .rounded-xl { border-radius: 1.5rem; }
    .btn-gradient { background: linear-gradient(90deg, #60a5fa, #a78bfa); transition: all 0.3s; }
    .btn-gradient:hover { filter: brightness(1.1); }
    .dashboard-card { transition: all 0.3s; background: white; }
    .dashboard-card:hover { transform: translateY(-8px); box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2); }
    .tooltip { position: relative; }
    .tooltip:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 110%; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8); color: white; padding: 6px 12px; border-radius: 6px;
      font-size: 0.9rem; white-space: nowrap; z-index: 10;
    }
    .tip-box { animation: fadeIn 1s ease-in-out; border: 2px dashed #60a5fa; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); }}
    .sync-status { font-size: 0.9rem; font-style: italic; }
    dialog { border: none; border-radius: 1.5rem; box-shadow: 0 6px 25px rgba(0, 0, 0, 0.25); background: #fff; padding: 2rem; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
    .dashboard-grid { display: grid; gap: 2rem; }
    .slider { background-color: #a78bfa; }
    #add-feed-type-hybrid:checked + .slider { background-color: #60a5fa; }
    #add-feed-type-hybrid:checked + .slider:before { transform: translateX(2rem); }
    .dashboard-card { padding: 2.5rem; border: 1px solid #e5e7eb; }
    .dashboard-card h3 { font-size: 2rem; }
    .dashboard-card p { font-size: 1.25rem; }
    button, input, select { font-size: 1.125rem; padding: 0.75rem; transition: all 0.2s; }
    button:hover { transform: scale(1.05); }
    input:focus, select:focus { outline: none; border-color: #60a5fa; box-shadow: 0 0 5px rgba(96, 165, 250, 0.5); }
    .btn-icon { width: 2.5rem; height: 2.5rem; }
    .warning { color: #e11d48; font-weight: bold; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #e11d48; color: white; padding: 10px 20px; border-radius: 8px; z-index: 1000; animation: slideUp 0.5s ease-in-out, fadeOut 0.5s ease-in-out 2.5s forwards; }
    @keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @media (max-width: 640px) {
      .safe-area { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .dashboard-card { padding: 1.5rem; }
      button, input, select { font-size: 1rem; padding: 0.5rem; }
    }
    @media (min-width: 641px) {
      .dashboard-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    }
  </style>
</head>
<body class="safe-area">
  <div class="flex flex-col md:flex-row h-full">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-full md:w-1/4 bg-white p-6 shadow-glow slide-left fixed md:static h-full z-20 rounded-r-xl hidden md:block">
      <header class="flex justify-between items-center mb-6">
        <h1 id="app-title" class="text-4xl font-bold text-blue-600"></h1>
        <div class="flex space-x-4">
          <button id="menu-toggle" class="text-gray-600 tooltip" data-tooltip="">
            <i class="fas fa-bars w-8 h-8"></i>
          </button>
          <button id="sidebar-close" class="md:hidden text-gray-600 tooltip" data-tooltip="">
            <i class="fas fa-times w-8 h-8"></i>
          </button>
        </div>
      </header>
      <h2 id="children-title" class="text-2xl font-semibold text-blue-600 mb-4"></h2>
      <ul id="child-list" class="space-y-4 mb-6"></ul>
      <button id="add-child" class="w-full p-4 btn-gradient text-white rounded-full shadow-glow flex justify-center items-center tooltip" data-tooltip="">
        <i class="fas fa-plus btn-icon mr-2"></i> <span></span>
      </button>
      <div id="menu" class="slide hidden fixed top-0 right-0 w-3/4 md:w-1/4 h-full bg-white p-6 shadow-glow z-30 rounded-l-xl">
        <div class="flex justify-end mb-6">
          <button id="menu-close" class="text-gray-600 tooltip" data-tooltip="">
            <i class="fas fa-times w-8 h-8"></i>
          </button>
        </div>
        <div class="space-y-4">
          <button id="export-data" class="w-full p-4 bg-blue-400 text-white rounded-full flex justify-center items-center hover:bg-blue-500 tooltip" data-tooltip="">
            <i class="fas fa-download btn-icon mr-2"></i> <span></span>
          </button>
          <input type="file" id="import-file" class="hidden" accept=".json">
          <button id="import-data" class="w-full p-4 bg-green-400 text-white rounded-full flex justify-center items-center hover:bg-green-500 tooltip" data-tooltip="">
            <i class="fas fa-upload btn-icon mr-2"></i> <span></span>
          </button>
          <button id="share-data" class="w-full p-4 bg-yellow-400 text-white rounded-full flex justify-center items-center hover:bg-yellow-500 tooltip" data-tooltip="">
            <i class="fas fa-share-alt btn-icon mr-2"></i> <span></span>
          </button>
          <button id="toggle-lang" class="w-full p-4 bg-gray-400 text-white rounded-full flex justify-center items-center hover:bg-gray-500 tooltip" data-tooltip="">
            <i class="fas fa-language btn-icon mr-2"></i> <span></span>
          </button>
          <button id="sync-bluetooth" class="w-full p-4 bg-indigo-400 text-white rounded-full flex justify-center items-center hover:bg-indigo-500 tooltip" data-tooltip="">
            <i class="fas fa-bluetooth btn-icon mr-2"></i> <span></span>
          </button>
          <button id="settings-toggle" class="w-full p-4 bg-purple-400 text-white rounded-full flex justify-center items-center hover:bg-purple-500 tooltip" data-tooltip="">
            <i class="fas fa-cog btn-icon mr-2"></i> <span></span>
          </button>
        </div>
      </div>
      <div id="settings" class="slide hidden fixed top-0 right-0 w-3/4 md:w-1/4 h-full bg-white p-6 shadow-glow z-30 rounded-l-xl">
        <div class="flex justify-end mb-6">
          <button id="settings-close" class="text-gray-600 tooltip" data-tooltip="">
            <i class="fas fa-times w-8 h-8"></i>
          </button>
        </div>
        <h3 id="settings-title" class="text-2xl font-semibold text-blue-600 mb-4"></h3>
        <div class="space-y-6">
          <label id="milk-interval-label" class="block text-blue-600 text-lg"></label>
          <input type="number" id="milk-interval" min="1" max="24" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
          <label id="notify-enable-label" class="block text-blue-600 text-lg"></label>
          <input type="checkbox" id="notify-enable" class="h-6 w-6 text-blue-600">
          <button id="save-settings" class="w-full p-4 btn-gradient text-white rounded-full shadow-glow"></button>
        </div>
      </div>
    </aside>
    <!-- Main Content -->
    <main id="main-content" class="w-full md:w-3/4 p-8 relative"></main>
    <!-- Edit Dialogs -->
    <dialog id="edit-milk-dialog">
      <h3 id="edit-milk-title" class="text-2xl font-semibold text-blue-600 mb-6"></h3>
      <form id="edit-milk-form" class="space-y-6">
        <div>
          <label id="edit-milk-time-label" class="block text-blue-600 text-lg"></label>
          <input type="datetime-local" id="edit-milk-time" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div>
          <label id="edit-milk-type-label" class="block text-blue-600 text-lg"></label>
          <select id="edit-milk-type" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
            <option value="breast"></option>
            <option value="bottle"></option>
            <option value="hybrid"></option>
          </select>
        </div>
        <div id="edit-milk-breast" class="hidden">
          <label id="edit-milk-duration-label" class="block text-blue-600 text-lg"></label>
          <input type="number" id="edit-milk-duration" min="0" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div id="edit-milk-bottle" class="hidden">
          <label id="edit-milk-amount-label" class="block text-blue-600 text-lg"></label>
          <input type="number" id="edit-milk-amount" min="0" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div class="flex space-x-4">
          <button type="submit" id="edit-milk-save" class="w-full p-4 btn-gradient text-white rounded-full shadow-glow"></button>
          <button type="button" id="edit-milk-cancel" class="w-full p-4 bg-gray-400 text-white rounded-full shadow-glow"></button>
        </div>
      </form>
    </dialog>
    <dialog id="edit-diaper-dialog">
      <h3 id="edit-diaper-title" class="text-2xl font-semibold text-blue-600 mb-6"></h3>
      <form id="edit-diaper-form" class="space-y-6">
        <div>
          <label id="edit-diaper-time-label" class="block text-blue-600 text-lg"></label>
          <input type="datetime-local" id="edit-diaper-time" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div>
          <label id="edit-diaper-type-label" class="block text-blue-600 text-lg"></label>
          <select id="edit-diaper-type" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
            <option value="wet"></option>
            <option value="dirty"></option>
            <option value="both"></option>
          </select>
        </div>
        <div class="flex space-x-4">
          <button type="submit" id="edit-diaper-save" class="w-full p-4 btn-gradient text-white rounded-full shadow-glow"></button>
          <button type="button" id="edit-diaper-cancel" class="w-full p-4 bg-gray-400 text-white rounded-full shadow-glow"></button>
        </div>
      </form>
    </dialog>
    <dialog id="edit-child-dialog">
      <h3 id="edit-child-title" class="text-2xl font-semibold text-blue-600 mb-6"></h3>
      <form id="edit-child-form" class="space-y-6">
        <div>
          <label id="edit-child-name-label" class="block text-blue-600 text-lg"></label>
          <input type="text" id="edit-child-name" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div>
          <label id="edit-child-gender-label" class="block text-blue-600 text-lg"></label>
          <select id="edit-child-gender" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
            <option value="boy"></option>
            <option value="girl"></option>
          </select>
        </div>
        <div>
          <label id="edit-child-birthdate-label" class="block text-blue-600 text-lg"></label>
          <input type="date" id="edit-child-birthdate" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div class="flex space-x-4">
          <button type="submit" id="edit-child-save" class="w-full p-4 btn-gradient text-white rounded-full shadow-glow"></button>
          <button type="button" id="edit-child-cancel" class="w-full p-4 bg-gray-400 text-white rounded-full shadow-glow"></button>
        </div>
      </form>
    </dialog>
    <!-- Add Modals -->
    <dialog id="add-milk-dialog">
      <h3 id="add-milk-title" class="text-2xl font-semibold text-blue-600 mb-6"></h3>
      <form id="add-milk-form" class="space-y-6">
        <div class="flex items-center justify-center space-x-4">
          <label id="add-milk-bottle-label" class="text-blue-600 text-lg"></label>
          <div class="relative inline-block w-16 h-8">
            <input type="checkbox" id="add-feed-type-hybrid" class="opacity-0 w-0 h-0">
            <span class="slider absolute cursor-pointer top-0 left-0 right-0 bottom-0 bg-gray-300 rounded-full transition-all duration-300 before:absolute before:h-6 before:w-6 before:left-1 before:top-1 before:bg-white before:rounded-full before:transition-all before:duration-300"></span>
          </div>
          <label id="add-milk-hybrid-label" class="text-blue-600 text-lg"></label>
        </div>
        <div>
          <label id="add-milk-time-label" class="block text-blue-600 text-lg"></label>
          <input type="datetime-local" id="add-milk-time" class="w-full p-4 text-lg border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div id="add-milk-breast" class="hidden">
          <label id="add-milk-duration-label" class="block text-blue-600 text-lg"></label>
          <input type="number" id="add-milk-duration" min="0" class="w-full p-4 text-lg border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div id="add-milk-bottle">
          <label id="add-milk-amount-label" class="block text-blue-600 text-lg"></label>
          <input type="number" id="add-milk-amount" min="0" class="w-full p-4 text-lg border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div class="flex space-x-4">
          <button type="submit" id="add-milk-save" class="w-full p-4 btn-gradient text-white text-lg rounded-full shadow-glow"></button>
          <button type="button" id="add-milk-cancel" class="w-full p-4 bg-gray-400 text-white text-lg rounded-full shadow-glow"></button>
        </div>
      </form>
    </dialog>
    <dialog id="add-diaper-dialog">
      <h3 id="add-diaper-title" class="text-2xl font-semibold text-blue-600 mb-6"></h3>
      <form id="add-diaper-form" class="space-y-6">
        <div>
          <label id="add-diaper-time-label" class="block text-blue-600 text-lg"></label>

        </div>
        <div>
          <label id="add-diaper-type-label" class="block text-blue-600 text-lg"></label>
          <select id="add-diaper-type" class="w-full p-4 border border-blue-200 rounded-lg bg-blue-50">
            <option value="wet"></option>
            <option value="dirty"></option>
            <option value="both"></option>
          </select>
        </div>
        <div class="flex space-x-4">
          <button type="submit" id="add-diaper-save" class="w-full p-4 btn-gradient text-white rounded-full shadow-glow"></button>
          <button type="button" id="add-diaper-cancel" class="w-full p-4 bg-gray-400 text-white rounded-full shadow-glow"></button>
        </div>
      </form>
    </dialog>
    <div id="toast-container"></div>
  </div>

    let language = localStorage.getItem('language') || 'en';
    let settings = {
      milkInterval: parseInt(localStorage.getItem('milkInterval')) || 3,
      notifications: localStorage.getItem('notifications') === 'true'
    };
    let db;

    // Toast Notification
    const showToast = (message) => {
      try {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      } catch (err) {
        console.error('Toast error:', err);
      }
    };

    // IndexedDB Setup
    const initDB = () => new Promise((resolve, reject) => {
      try {
        const request = indexedDB.open("BabyCareDB", 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(); };
        request.onupgradeneeded = (e) => {
          e.target.result.createObjectStore("data", { keyPath: "id" });
        };
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
        reject(err);
      }
    });

    const loadData = () => new Promise((resolve) => {
      try {
        const tx = db.transaction("data", "readonly");
        const store = tx.objectStore("data");
        const req = store.get("appData");
        req.onsuccess = () => {
          if (req.result) appData = req.result.value;
          resolve();
        };
        req.onerror = () => resolve();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
        resolve();
      }
    });

    const saveData = () => {
      try {
        const tx = db.transaction("data", "readwrite");
        const store = tx.objectStore("data");
        store.put({ id: "appData", value: appData });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    // UI Updates
    const updateUI = () => {
      try {
        const t = translations[language];
        document.getElementById('app-title').textContent = t.appTitle;
        document.getElementById('children-title').textContent = t.childrenTitle;
        document.getElementById('add-child').querySelector('span').textContent = t.addChild;
        document.getElementById('add-child').dataset.tooltip = t.addChild;
        document.getElementById('menu-toggle').dataset.tooltip = t.menu;
        document.getElementById('sidebar-close').dataset.tooltip = t.close;
        document.getElementById('export-data').querySelector('span').textContent = t.exportData;
        document.getElementById('export-data').dataset.tooltip = t.exportData;
        document.getElementById('import-data').querySelector('span').textContent = t.importData;
        document.getElementById('import-data').dataset.tooltip = t.importData;
        document.getElementById('share-data').querySelector('span').textContent = t.shareData;
        document.getElementById('share-data').dataset.tooltip = t.shareData;
        document.getElementById('toggle-lang').querySelector('span').textContent = t.toggleLang;
        document.getElementById('toggle-lang').dataset.tooltip = t.toggleLang;
        document.getElementById('sync-bluetooth').querySelector('span').textContent = t.syncBluetooth;
        document.getElementById('sync-bluetooth').dataset.tooltip = t.syncBluetooth;
        document.getElementById('settings-toggle').querySelector('span').textContent = t.settings;
        document.getElementById('settings-toggle').dataset.tooltip = t.settings;
        document.getElementById('menu-close').dataset.tooltip = t.close;
        document.getElementById('settings-title').textContent = t.settings;
        document.getElementById('settings-close').dataset.tooltip = t.close;
        document.getElementById('milk-interval-label').textContent = t.milkReminder;
        document.getElementById('notify-enable-label').textContent = t.enableNotifications;
        document.getElementById('save-settings').textContent = t.save;
        document.getElementById('edit-milk-title').textContent = t.editFeeding;
        document.getElementById('edit-milk-time-label').textContent = t.time;
        document.getElementById('edit-milk-type-label').textContent = t.type;
        document.getElementById('edit-milk-type').options[0].textContent = t.breastFeed;
        document.getElementById('edit-milk-type').options[1].textContent = t.bottleFeed;
        document.getElementById('edit-milk-type').options[2].textContent = t.hybridFeed;
        document.getElementById('edit-milk-duration-label').textContent = t.milkDuration;
        document.getElementById('edit-milk-amount-label').textContent = t.milkAmount;
        document.getElementById('edit-milk-save').textContent = t.save;
        document.getElementById('edit-milk-cancel').textContent = t.cancel;
        document.getElementById('edit-diaper-title').textContent = t.editDiaper;
        document.getElementById('edit-diaper-time-label').textContent = t.time;
        document.getElementById('edit-diaper-type-label').textContent = t.type;
        document.getElementById('edit-diaper-type').options[0].textContent = t.diaperWet;
        document.getElementById('edit-diaper-type').options[1].textContent = t.diaperDirty;
        document.getElementById('edit-diaper-type').options[2].textContent = t.diaperBoth;
        document.getElementById('edit-diaper-save').textContent = t.save;
        document.getElementById('edit-diaper-cancel').textContent = t.cancel;
        document.getElementById('edit-child-title').textContent = t.editChild;
        document.getElementById('edit-child-name-label').textContent = t.name;
        document.getElementById('edit-child-gender-label').textContent = t.gender;
        document.getElementById('edit-child-gender').options[0].textContent = t.boy;
        document.getElementById('edit-child-gender').options[1].textContent = t.girl;
        document.getElementById('edit-child-birthdate-label').textContent = t.birthdate;
        document.getElementById('edit-child-save').textContent = t.save;
        document.getElementById('edit-child-cancel').textContent = t.cancel;
        document.getElementById('add-milk-title').textContent = t.milkAdd;
        document.getElementById('add-milk-bottle-label').textContent = t.bottleFeed;
        document.getElementById('add-milk-hybrid-label').textContent = t.hybridFeed;
        document.getElementById('add-milk-time-label').textContent = t.time;
        document.getElementById('add-milk-duration-label').textContent = t.milkDuration;
        document.getElementById('add-milk-amount-label').textContent = t.milkAmount;
        document.getElementById('add-milk-save').textContent = t.save;
        document.getElementById('add-milk-cancel').textContent = t.cancel;
        document.getElementById('add-diaper-title').textContent = t.diaperAdd;
        document.getElementById('add-diaper-time-label').textContent = t.time;
        document.getElementById('add-diaper-type-label').textContent = t.type;
        document.getElementById('add-diaper-type').options[0].textContent = t.diaperWet;
        document.getElementById('add-diaper-type').options[1].textContent = t.diaperDirty;
        document.getElementById('add-diaper-type').options[2].textContent = t.diaperBoth;
        document.getElementById('add-diaper-save').textContent = t.save;
        document.getElementById('add-diaper-cancel').textContent = t.cancel;
        renderChildren();
        renderDashboard();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    // Render Functions
    const renderChildren = () => {
      try {
        const list = document.getElementById('child-list');
        list.innerHTML = '';
        appData.children.forEach(child => {
          const li = document.createElement('li');
          li.className = 'flex justify-between items-center p-4 bg-blue-100 rounded-lg hover:bg-blue-200 transition-all';
          li.innerHTML = `
            <span onclick="selectChild('${child.id}')" class="cursor-pointer flex-1 text-lg">${child.name}</span>
            <button onclick="editChild('${child.id}')" class="text-blue-500 hover:text-blue-600 tooltip" data-tooltip="${translations[language].edit}">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <button onclick="deleteChild('${child.id}')" class="text-red-500 hover:text-red-600 tooltip" data-tooltip="${translations[language].delete}">
              <i class="fas fa-trash btn-icon"></i>
            </button>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const renderDashboard = () => {
      try {
        const main = document.getElementById('main-content');
        const t = translations[language];
        main.innerHTML = `
          <header class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-blue-600">${t.dashboard}</h2>
            <div class="flex space-x-4 items-center">
              <span id="sync-status" class="sync-status text-gray-600">Sync: Offline</span>
              <button id="sidebar-open" class="md:hidden text-gray-600 tooltip" data-tooltip="${t.menu}">
                <i class="fas fa-bars w-8 h-8"></i>
              </button>
            </div>
          </header>
          <div id="dashboard" class="dashboard-grid"></div>
          <button id="dashboard-add-child" class="fixed bottom-8 right-8 p-4 btn-gradient text-white rounded-full shadow-glow flex items-center tooltip" data-tooltip="${t.addChild}">
            <i class="fas fa-plus btn-icon"></i>
          </button>
          <div id="tip-box" class="absolute bottom-4 right-4 bg-yellow-100 p-4 rounded-xl shadow-glow text-blue-600 hidden tip-box"></div>
        `;
        
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        if (appData.children.length === 0) {
          dashboard.innerHTML = `<p class="text-gray-600 text-center text-lg">${t.noChildren}</p>`;
        } else {
          appData.children.forEach(child => {
            try {
              const lastMilk = child.milkIntake.length ? new Date(child.milkIntake[child.milkIntake.length - 1].timestamp) : null;
              const nextMilk = lastMilk ? new Date(lastMilk.getTime() + settings.milkInterval * 60 * 60 * 1000) : null;
              const now = new Date();
              const timeLeft = nextMilk && nextMilk > now ? Math.floor((nextMilk - now) / (1000 * 60)) : 0;
              const timeLeftText = lastMilk ? (timeLeft > 0 ? `${timeLeft} min` : 'Now') : 'N/A';
              const percentageLeft = lastMilk && nextMilk > now ? (timeLeft / (settings.milkInterval * 60)) : 0;
              const redValue = Math.floor(255 * (1 - percentageLeft));
              const color = timeLeft > 0 ? `rgb(${redValue}, 100, 100)` : '#ff0000';
              const genderIcon = child.gender === 'boy' ? 'fa-mars' : 'fa-venus';
              const stats = calculateStats(child);

              const card = document.createElement('div');
              card.className = 'dashboard-card bg-white p-6 rounded-xl shadow-glow flex flex-col items-center';
              card.innerHTML = `
                <i class="fas fa-baby text-5xl text-blue-600 mb-4"></i>
                <h3 class="text-2xl font-bold text-blue-600">${child.name}</h3>
                <p class="text-gray-600"><i class="fas ${genderIcon} mr-2"></i> ${t.gender}: ${t[child.gender]}</p>
                <p class="text-gray-600"><i class="fas fa-birthday-cake mr-2"></i> ${t.birthdate}: ${child.birthdate || 'N/A'}</p>
                <p class="text-gray-600"><i class="fas fa-home mr-2"></i> ${t.atHome}</p>
                <p class="text-gray-600" style="color: ${color};"><i class="fas fa-bottle-baby mr-2"></i> ${t.nextMilk}: ${timeLeftText}</p>
                <div class="mt-4 w-full">
                  <h4 class="text-lg font-semibold text-blue-600">${t.stats}</h4>
                  <p>${t.feedsToday}: ${stats.feedsToday}</p>
                  <p>${t.avgInterval}: ${stats.avgInterval.toFixed(1)}</p>
                  ${stats.warnings.length ? `<p class="warning">${t.warnings}: ${stats.warnings.join(', ')}</p>` : ''}
                </div>
                <canvas id="chart-${child.id}" class="w-full h-40 mt-4"></canvas>
                <div class="flex space-x-4 mt-6">
                  <button onclick="showDetails('${child.id}')" class="p-3 btn-gradient text-white rounded-full flex items-center tooltip" data-tooltip="${t.details}">
                    <i class="fas fa-info-circle mr-2"></i> ${t.details}
                  </button>
                  <button onclick="showEditChildDialog('${child.id}')" class="p-3 bg-blue-500 text-white rounded-full flex items-center tooltip" data-tooltip="${t.edit}">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                  </button>
                </div>
              `;
              dashboard.appendChild(card);
              renderChart(child);
              if (timeLeft === 0 && lastMilk) notifyFeedingTime(child);
            } catch (err) {
              showToast(translations[language].errorOccurred + err.message);
            }
          });
        }

        addTouchAndClick(document.getElementById('sidebar-open'), toggleSidebar);
        addTouchAndClick(document.getElementById('dashboard-add-child'), addChildFromDashboard);
        showRandomTip();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const calculateStats = (child) => {
      try {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const feedsToday = child.milkIntake.filter(m => new Date(m.timestamp) >= today).length;
        const intervals = child.milkIntake.map(m => new Date(m.timestamp)).sort((a, b) => a - b)
          .reduce((acc, curr, i, arr) => i > 0 ? [...acc, (curr - arr[i - 1]) / (1000 * 60 * 60)] : acc, []);
        const avgInterval = intervals.length ? intervals.reduce((a, b) => a + b, 0) / intervals.length : 0;
        const warnings = [];
        if (intervals.length > 1) {
          const lastInterval = intervals[intervals.length - 1];
          if (lastInterval > settings.milkInterval * 1.5 || lastInterval < settings.milkInterval * 0.5) {
            warnings.push(translations[language].irregularFeeding);
          }
        }
        return { feedsToday, avgInterval, warnings };
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
        return { feedsToday: 0, avgInterval: 0, warnings: [] };
      }
    };

    const renderChart = (child) => {
      try {
        const canvas = document.getElementById(`chart-${child.id}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const timestamps = child.milkIntake.map(m => new Date(m.timestamp)).sort((a, b) => a - b);
        const intervals = [];
        for (let i = 1; i < timestamps.length; i++) {
          intervals.push((timestamps[i] - timestamps[i - 1]) / (1000 * 60 * 60));
        }
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: intervals.map((_, i) => `Feed ${i + 1}`),
            datasets: [{
              label: translations[language].milkIntervals,
              data: intervals,
              borderColor: '#60a5fa',
              fill: false,
              tension: 0.1
            }]
          },
          options: {
            scales: { y: { beginAtZero: true, title: { display: true, text: 'Hours' } } },
            plugins: { legend: { display: false } }
          }
        });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const showDetails = (id) => {
      try {
        activeChildId = id;
        const child = appData.children.find(c => c.id === id);
        const t = translations[language];
        const main = document.getElementById('main-content');
        main.innerHTML = `
          <header class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-blue-600">${child.name}</h2>
            <button id="back-to-dashboard" class="text-gray-600 tooltip" data-tooltip="${t.back}">
              <i class="fas fa-arrow-left w-8 h-8"></i>
            </button>
          </header>
          <section class="mb-8 bg-white p-6 rounded-xl shadow-glow">
            <div class="flex justify-between items-center mb-4">
              <h4 class="text-xl font-semibold text-blue-600">${t.milkTitle}</h4>
              <button onclick="showAddMilkDialog()" class="text-blue-600 tooltip" data-tooltip="${t.milkAdd}">
                <i class="fas fa-plus w-6 h-6"></i>
              </button>
            </div>
            <ul id="milk-list" class="list-disc pl-5 space-y-3"></ul>
          </section>
          <section class="bg-white p-6 rounded-xl shadow-glow">
            <div class="flex justify-between items-center mb-4">
              <h4 class="text-xl font-semibold text-blue-600">${t.diaperTitle}</h4>
              <button onclick="showAddDiaperDialog()" class="text-blue-600 tooltip" data-tooltip="${t.diaperAdd}">
                <i class="fas fa-plus w-6 h-6"></i>
              </button>
            </div>
            <ul id="diaper-list" class="list-disc pl-5 space-y-3"></ul>
          </section>
        `;
        renderMilk();
        renderDiapers();
        addTouchAndClick(document.getElementById('back-to-dashboard'), () => {
          activeChildId = null;
          renderDashboard();
        });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const renderMilk = () => {
      try {
        const list = document.getElementById('milk-list');
        if (!list) return;
        list.innerHTML = '';
        const t = translations[language];
        const child = appData.children.find(c => c.id === activeChildId);
        child.milkIntake.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        child.milkIntake.forEach((intake, idx) => {
          const li = document.createElement('li');
          li.className = 'flex justify-between items-center text-blue-600 text-lg';
          const valueText = intake.type === 'breast' ? `${intake.duration} min` : intake.type === 'bottle' ? `${intake.amount} ml` : `${intake.duration} min + ${intake.amount} ml`;
          li.innerHTML = `
            ${new Date(intake.timestamp).toLocaleString()} - ${t[intake.type + 'Feed']} - ${valueText}
            <div class="flex space-x-3">
              <button onclick="showEditMilkDialog(${idx})" class="text-blue-500 hover:text-blue-600 tooltip" data-tooltip="${t.edit}">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
              <button onclick="deleteMilk(${idx})" class="text-red-500 hover:text-red-600 tooltip" data-tooltip="${t.delete}">
                <i class="fas fa-trash btn-icon"></i>
              </button>
            </div>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const renderDiapers = () => {
      try {
        const list = document.getElementById('diaper-list');
        if (!list) return;
        list.innerHTML = '';
        const t = translations[language];
        const child = appData.children.find(c => c.id === activeChildId);
        child.diaperChanges.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        child.diaperChanges.forEach((change, idx) => {
          const li = document.createElement('li');
          li.className = 'flex justify-between items-center text-blue-600 text-lg';
          const type = t[`diaper${change.type.charAt(0).toUpperCase() + change.type.slice(1)}`];
          li.innerHTML = `
            ${new Date(change.timestamp).toLocaleString()} - ${type}
            <div class="flex space-x-3">
              <button onclick="showEditDiaperDialog(${idx})" class="text-blue-500 hover:text-blue-600 tooltip" data-tooltip="${t.edit}">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
              <button onclick="deleteDiaper(${idx})" class="text-red-500 hover:text-red-600 tooltip" data-tooltip="${t.delete}">
                <i class="fas fa-trash btn-icon"></i>
              </button>
            </div>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    // Event Handlers
    const selectChild = (id) => {
      try {
        activeChildId = id;
        showDetails(id);
        toggleSidebar();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const deleteChild = (id) => {
      try {
        if (confirm(translations[language].deleteConfirm)) {
          appData.children = appData.children.filter(c => c.id !== id);
          if (activeChildId === id) activeChildId = null;
          saveData();
          updateUI();
        }
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const editChild = (id) => {
      try {
        showEditChildDialog(id);
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const showEditChildDialog = (id) => {
      try {
        const child = appData.children.find(c => c.id === id);
        const dialog = document.getElementById('edit-child-dialog');
        document.getElementById('edit-child-name').value = child.name;
        document.getElementById('edit-child-gender').value = child.gender;
        document.getElementById('edit-child-birthdate').value = child.birthdate || '';
        document.getElementById('edit-child-form').onsubmit = (e) => {
          try {
            e.preventDefault();
            const name = document.getElementById('edit-child-name').value.trim();
            const gender = document.getElementById('edit-child-gender').value;
            const birthdate = document.getElementById('edit-child-birthdate').value;
            if (name && (gender === 'boy' || gender === 'girl') && /^\d{4}-\d{2}-\d{2}$/.test(birthdate)) {
              child.name = name;
              child.gender = gender;
              child.birthdate = birthdate;
              saveData();
              updateUI();
              dialog.close();
            } else {
              alert(translations[language].invalidInput);
            }
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        };
        document.getElementById('edit-child-cancel').onclick = () => dialog.close();
        dialog.showModal();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const deleteMilk = (idx) => {
      try {
        const child = appData.children.find(c => c.id === activeChildId);
        child.milkIntake.splice(idx, 1);
        saveData();
        renderMilk();
        renderDashboard();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const deleteDiaper = (idx) => {
      try {
        const child = appData.children.find(c => c.id === activeChildId);
        child.diaperChanges.splice(idx, 1);
        saveData();
        renderDiapers();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const showEditMilkDialog = (idx) => {
      try {
        const child = appData.children.find(c => c.id === activeChildId);
        const intake = child.milkIntake[idx];
        const dialog = document.getElementById('edit-milk-dialog');
        document.getElementById('edit-milk-time').value = intake.timestamp.slice(0, 16);
        document.getElementById('edit-milk-type').value = intake.type;
        document.getElementById('edit-milk-duration').value = intake.duration || '';
        document.getElementById('edit-milk-amount').value = intake.amount || '';
        const breastDiv = document.getElementById('edit-milk-breast');
        const bottleDiv = document.getElementById('edit-milk-bottle');
        breastDiv.classList.toggle('hidden', intake.type === 'bottle');
        bottleDiv.classList.toggle('hidden', intake.type === 'breast');
        document.getElementById('edit-milk-type').onchange = (e) => {
          breastDiv.classList.toggle('hidden', e.target.value === 'bottle');
          bottleDiv.classList.toggle('hidden', e.target.value === 'breast');
        };
        document.getElementById('edit-milk-form').onsubmit = (e) => {
          try {
            e.preventDefault();
            intake.timestamp = new Date(document.getElementById('edit-milk-time').value).toISOString();
            intake.type = document.getElementById('edit-milk-type').value;
            if (intake.type === 'breast') {
              intake.duration = parseInt(document.getElementById('edit-milk-duration').value) || 0;
              delete intake.amount;
            } else if (intake.type === 'bottle') {
              intake.amount = parseInt(document.getElementById('edit-milk-amount').value) || 0;
              delete intake.duration;
            } else {
              intake.duration = parseInt(document.getElementById('edit-milk-duration').value) || 0;
              intake.amount = parseInt(document.getElementById('edit-milk-amount').value) || 0;
            }
            saveData();
            renderMilk();
            renderDashboard();
            dialog.close();
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        };
        document.getElementById('edit-milk-cancel').onclick = () => dialog.close();
        dialog.showModal();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const showEditDiaperDialog = (idx) => {
      try {
        const child = appData.children.find(c => c.id === activeChildId);
        const change = child.diaperChanges[idx];
        const dialog = document.getElementById('edit-diaper-dialog');
        document.getElementById('edit-diaper-time').value = change.timestamp.slice(0, 16);
        document.getElementById('edit-diaper-type').value = change.type;
        document.getElementById('edit-diaper-form').onsubmit = (e) => {
          try {
            e.preventDefault();
            change.timestamp = new Date(document.getElementById('edit-diaper-time').value).toISOString();
            change.type = document.getElementById('edit-diaper-type').value;
            saveData();
            renderDiapers();
            dialog.close();
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        };
        document.getElementById('edit-diaper-cancel').onclick = () => dialog.close();
        dialog.showModal();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const showAddMilkDialog = () => {
      try {
        const dialog = document.getElementById('add-milk-dialog');
        const feedType = document.getElementById('add-feed-type-hybrid');
        feedType.checked = false;
        document.getElementById('add-milk-time').value = '';
        document.getElementById('add-milk-duration').value = '';
        document.getElementById('add-milk-amount').value = '';
        const breastDiv = document.getElementById('add-milk-breast');
        const bottleDiv = document.getElementById('add-milk-bottle');
        breastDiv.classList.add('hidden');
        bottleDiv.classList.remove('hidden');
        feedType.onchange = (e) => {
          breastDiv.classList.toggle('hidden', !e.target.checked);
          bottleDiv.classList.toggle('hidden', false);
        };
        document.getElementById('add-milk-form').onsubmit = (e) => {
          try {
            e.preventDefault();
            if (!activeChildId) return alert(translations[language].selectChildAlert);
            const time = document.getElementById('add-milk-time').value;
            const duration = parseInt(document.getElementById('add-milk-duration').value) || 0;
            const amount = parseInt(document.getElementById('add-milk-amount').value) || 0;
            if (!time || (!duration && !amount)) return alert(translations[language].milkValidation);
            const child = appData.children.find(c => c.id === activeChildId);
            const entry = { timestamp: new Date(time).toISOString(), type: feedType.checked ? 'hybrid' : 'bottle' };
            if (feedType.checked) {
              entry.duration = duration;
              entry.amount = amount;
            } else {
              entry.amount = amount;
            }
            child.milkIntake.push(entry);
            saveData();
            renderMilk();
            renderDashboard();
            scheduleReminder(child);
            dialog.close();
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        };
        document.getElementById('add-milk-cancel').onclick = () => dialog.close();
        dialog.showModal();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const showAddDiaperDialog = () => {
      try {
        const dialog = document.getElementById('add-diaper-dialog');
        document.getElementById('add-diaper-time').value = '';
        document.getElementById('add-diaper-type').value = 'wet';
        document.getElementById('add-diaper-form').onsubmit = (e) => {
          try {
            e.preventDefault();
            if (!activeChildId) return alert(translations[language].selectChildAlert);
            const time = document.getElementById('add-diaper-time').value;
            const type = document.getElementById('add-diaper-type').value;
            if (!time) return alert(translations[language].diaperValidation);
            const child = appData.children.find(c => c.id === activeChildId);
            child.diaperChanges.push({ timestamp: new Date(time).toISOString(), type });
            saveData();
            renderDiapers();
            dialog.close();
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        };
        document.getElementById('add-diaper-cancel').onclick = () => dialog.close();
        dialog.showModal();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    // Notifications
    const notifyFeedingTime = (child) => {
      try {
        if (settings.notifications && Notification.permission === 'granted') {
          new Notification(`Time to feed ${child.name}!`, { body: 'It’s feeding time now.' });
        }
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const scheduleReminder = (child) => {
      try {
        if (settings.notifications && Notification.permission === 'granted') {
          const lastFeed = child.milkIntake[child.milkIntake.length - 1];
          const nextFeedTime = new Date(lastFeed.timestamp).getTime() + settings.milkInterval * 60 * 60 * 1000;
          const delay = nextFeedTime - Date.now();
          if (delay > 0) {
            setTimeout(() => {
              new Notification(`Time to feed ${child.name}!`, { body: `It’s been ${settings.milkInterval} hours since the last feed.` });
            }, delay);
          }
        } else if (settings.notifications && Notification.permission !== 'denied') {
          Notification.requestPermission();
        }
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    // Event Listeners
    const addTouchAndClick = (element, handler) => {
      if (element) {
        element.addEventListener('click', (e) => {
          try {
            handler(e);
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        });
        element.addEventListener('touchstart', (e) => {
          try {
            e.preventDefault();
            handler(e);
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        });
      }
    };

    const addChildFromDashboard = () => {
      try {
        const t = translations[language];
        const name = prompt(t.addChildPrompt);
        if (!name) return;
        const gender = prompt(t.genderPrompt).toLowerCase();
        if (gender !== 'boy' && gender !== 'girl') return alert(t.invalidGender);
        const birthdate = prompt(t.birthdatePrompt);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(birthdate)) return alert(t.invalidDate);
        const id = `child${appData.nextId++}`;
        appData.children.push({ id, name, gender, birthdate, milkIntake: [], diaperChanges: [] });
        saveData();
        updateUI();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    addTouchAndClick(document.getElementById('add-child'), addChildFromDashboard);

    addTouchAndClick(document.getElementById('export-data'), () => {
      try {
        const t = translations[language];
        let md = `# ${t.appTitle} Data\n\n`;
        appData.children.forEach(c => {
          md += `## ${c.name}\n- **${t.gender}**: ${t[c.gender]}\n- **${t.birthdate}**: ${c.birthdate || 'N/A'}\n\n### ${t.milkTitle}\n`;
          c.milkIntake.forEach(m => md += `- ${new Date(m.timestamp).toLocaleString()} - ${t[m.type + 'Feed']} - ${m.type === 'breast' ? `${m.duration} min` : m.type === 'bottle' ? `${m.amount} ml` : `${m.duration} min + ${m.amount} ml`}\n`);
          md += `\n### ${t.diaperTitle}\n`;
          c.diaperChanges.forEach(d => md += `- ${new Date(d.timestamp).toLocaleString()} - ${t[`diaper${d.type.charAt(0).toUpperCase() + d.type.slice(1)}`]}\n`);
          md += "\n";
        });
        const blob = new Blob([md], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'baby_caring.md';
        a.click();
        URL.revokeObjectURL(url);
        toggleMenu();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    addTouchAndClick(document.getElementById('import-data'), () => {
      try {
        document.getElementById('import-file').click();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    document.getElementById('import-file').addEventListener('change', (e) => {
      try {
        const t = translations[language];
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (imported.nextId && Array.isArray(imported.children)) {
                appData = imported;
                saveData();
                activeChildId = null;
                updateUI();
                alert(t.importSuccess);
              } else {
                alert(t.importFormat);
              }
            } catch (err) {
              showToast(t.importError + err.message);
            }
            toggleMenu();
          };
          reader.readAsText(file);
        }
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    addTouchAndClick(document.getElementById('share-data'), () => {
      try {
        const t = translations[language];
        let md = `# ${t.appTitle} Data\n\n`;
        appData.children.forEach(c => {
          md += `## ${c.name}\n- **${t.gender}**: ${t[c.gender]}\n- **${t.birthdate}**: ${c.birthdate || 'N/A'}\n\n### ${t.milkTitle}\n`;
          c.milkIntake.forEach(m => md += `- ${new Date(m.timestamp).toLocaleString()} - ${t[m.type + 'Feed']} - ${m.type === 'breast' ? `${m.duration} min` : m.type === 'bottle' ? `${m.amount} ml` : `${m.duration} min + ${m.amount} ml`}\n`);
          md += `\n### ${t.diaperTitle}\n`;
          c.diaperChanges.forEach(d => md += `- ${new Date(d.timestamp).toLocaleString()} - ${t[`diaper${d.type.charAt(0).toUpperCase() + d.type.slice(1)}`]}\n`);
          md += "\n";
        });
        if (navigator.share) {
          navigator.share({ title: t.appTitle + ' Data', text: md })
            .catch(() => fallbackShare(md));
        } else {
          fallbackShare(md);
        }
        toggleMenu();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    const fallbackShare = (text) => {
      try {
        const t = translations[language];
        navigator.clipboard.writeText(text).then(() => {
          const email = `mailto:?subject=${t.appTitle} Data&body=${encodeURIComponent(text)}`;
          const a = document.createElement('a');
          a.href = email;
          a.click();
          alert(t.shareSuccess);
        }).catch(() => alert(t.shareError));
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    addTouchAndClick(document.getElementById('toggle-lang'), () => {
      try {
        language = language === 'en' ? 'fr' : 'en';
        localStorage.setItem('language', language);
        updateUI();
        toggleMenu();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    addTouchAndClick(document.getElementById('sync-bluetooth'), async () => {
      try {
        const t = translations[language];
        if (!navigator.bluetooth) {
          alert(t.bluetoothNotSupported);
          return;
        }
        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['battery_service'] });
        const server = await device.gatt.connect();
        document.getElementById('sync-status').textContent = `Sync: Connected to ${device.name}`;
        const dataToSend = JSON.stringify(appData);
        console.log("Sending data:", dataToSend);
        const receivedData = prompt("Simulated Bluetooth receive: Paste JSON data from other device (or cancel to skip):");
        if (receivedData) {
          try {
            const newData = JSON.parse(receivedData);
            if (newData.nextId && Array.isArray(newData.children)) {
              appData = mergeData(appData, newData);
              saveData();
              updateUI();
              alert(t.bluetoothSyncSuccess);
            } else {
              alert(t.importFormat);
            }
          } catch (err) {
            showToast(t.bluetoothSyncError + err.message);
          }
        }
        server.disconnect();
        document.getElementById('sync-status').textContent = "Sync: Offline";
        toggleMenu();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    const mergeData = (localData, remoteData) => {
      try {
        const merged = { nextId: Math.max(localData.nextId, remoteData.nextId), children: [] };
        const allChildren = [...localData.children, ...remoteData.children];
        const uniqueIds = new Set(allChildren.map(c => c.id));
        uniqueIds.forEach(id => {
          const localChild = localData.children.find(c => c.id === id) || {};
          const remoteChild = remoteData.children.find(c => c.id === id) || {};
          merged.children.push({
            ...localChild,
            ...remoteChild,
            milkIntake: [...(localChild.milkIntake || []), ...(remoteChild.milkIntake || [])],
            diaperChanges: [...(localChild.diaperChanges || []), ...(remoteChild.diaperChanges || [])]
          });
        });
        return merged;
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
        return localData;
      }
    };

    addTouchAndClick(document.getElementById('settings-toggle'), () => {
      try {
        const dialog = document.getElementById('settings');
        document.getElementById('milk-interval').value = settings.milkInterval;
        document.getElementById('notify-enable').checked = settings.notifications;
        document.getElementById('save-settings').onclick = () => {
          try {
            settings.milkInterval = parseInt(document.getElementById('milk-interval').value) || 3;
            settings.notifications = document.getElementById('notify-enable').checked;
            localStorage.setItem('milkInterval', settings.milkInterval);
            localStorage.setItem('notifications', settings.notifications);
            saveData();
            updateUI();
            toggleSettings();
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        };
        toggleSettings();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    addTouchAndClick(document.getElementById('menu-toggle'), toggleMenu);
    addTouchAndClick(document.getElementById('menu-close'), toggleMenu);
    addTouchAndClick(document.getElementById('sidebar-close'), toggleSidebar);
    addTouchAndClick(document.getElementById('settings-close'), toggleSettings);

    const toggleSidebar = () => {
      try {
        document.getElementById('sidebar').classList.toggle('hidden');
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const toggleMenu = () => {
      try {
        const menu = document.getElementById('menu');
        menu.classList.toggle('hidden');
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const toggleSettings = () => {
      try {
        const settingsPanel = document.getElementById('settings');
        settingsPanel.classList.toggle('hidden');
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const showRandomTip = () => {
      try {
        const tipBox = document.getElementById('tip-box');
        const randomTip = tips[language][Math.floor(Math.random() * tips[language].length)];
        tipBox.textContent = randomTip;
        tipBox.classList.remove('hidden');
        setTimeout(() => tipBox.classList.add('hidden'), 10000);
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    // Initialization
    initDB().then(() => loadData()).then(() => {
      try {
        appData.children.forEach(child => {
          if (!child.diaperChanges) child.diaperChanges = [];
          if (!child.milkIntake) child.milkIntake = [];
        });
        updateUI();
        if (settings.notifications && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
          Notification.requestPermission();
        }
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    }).catch(err => {
      showToast(translations[language].errorOccurred + err.message);
    });
  </script>
</body>
</html>
