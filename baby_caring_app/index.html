<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baby Caring</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Comic Neue', cursive;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec, #fff9c4);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .slide { transition: transform 0.3s ease-in-out; }
    .slide.hidden { transform: translateX(100%); display: none; }
    .slide-left.hidden { transform: translateX(-100%); display: none; }
    .btn-gradient { background: linear-gradient(90deg, #60a5fa, #a78bfa); transition: all 0.3s; }
    .btn-gradient:hover { filter: brightness(1.1); }
    .dashboard-card { transition: all 0.3s; background: white; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); }
    .dashboard-card:hover { transform: translateY(-8px); box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #e11d48; color: white; padding: 10px 20px; border-radius: 8px; z-index: 1000; animation: slideUp 0.5s ease-in-out, fadeOut 0.5s ease-in-out 2.5s forwards; }
    @keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .dashboard-grid { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    @media (max-width: 640px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .dashboard-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="flex flex-col md:flex-row h-full">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-full md:w-1/4 bg-white p-6 shadow-lg slide-left fixed md:static h-full z-20 hidden md:block">
      <header class="flex justify-between items-center mb-6">
        <h1 id="app-title" class="text-3xl font-bold text-blue-600"></h1>
        <button id="menu-toggle" class="text-gray-600"><i class="fas fa-bars w-6 h-6"></i></button>
      </header>
      <h2 id="children-title" class="text-xl font-semibold text-blue-600 mb-4"></h2>
      <ul id="child-list" class="space-y-4 mb-6"></ul>
      <button id="add-child" class="w-full p-3 btn-gradient text-white rounded-full">Add Child</button>
      <div id="menu" class="slide hidden fixed top-0 right-0 w-3/4 md:w-1/4 h-full bg-white p-6 shadow-lg z-30">
        <button id="menu-close" class="text-gray-600 mb-6"><i class="fas fa-times w-6 h-6"></i></button>
        <button id="export-data" class="w-full p-3 bg-blue-400 text-white rounded-full mb-4">Export Data</button>
        <input type="file" id="import-file" class="hidden" accept=".json">
        <button id="import-data" class="w-full p-3 bg-green-400 text-white rounded-full mb-4">Import Data</button>
      </div>
    </aside>
    <!-- Main Content -->
    <main id="main-content" class="w-full md:w-3/4 p-6">
      <header class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-blue-600">Dashboard</h2>
        <button id="sidebar-open" class="md:hidden text-gray-600"><i class="fas fa-bars w-6 h-6"></i></button>
      </header>
      <div id="dashboard" class="dashboard-grid"></div>
    </main>
    <!-- Dialogs -->
    <dialog id="add-milk-dialog" class="p-6 rounded-lg">
      <h3 id="add-milk-title" class="text-xl font-semibold text-blue-600 mb-4"></h3>
      <form id="add-milk-form" class="space-y-4">
        <label id="add-milk-time-label" class="block text-blue-600"></label>
        <input type="datetime-local" id="add-milk-time" class="w-full p-2 border rounded">
        <label id="add-milk-amount-label" class="block text-blue-600"></label>
        <input type="number" id="add-milk-amount" min="0" class="w-full p-2 border rounded">
        <div class="flex space-x-2">
          <button type="submit" id="add-milk-save" class="w-full p-2 btn-gradient text-white rounded"></button>
          <button type="button" id="add-milk-cancel" class="w-full p-2 bg-gray-400 text-white rounded"></button>
        </div>
      </form>
    </dialog>
    <div id="toast-container"></div>
  </div>

  <script>
    const translations = {
      en: {
        appTitle: "Baby Caring",
        childrenTitle: "Children",
        addChild: "Add Child",
        dashboard: "Dashboard",
        milkTitle: "Feeding",
        milkAmount: "Amount (ml)",
        milkAdd: "Add Feeding",
        exportData: "Export Data",
        importData: "Import Data",
        save: "Save",
        cancel: "Cancel",
        time: "Time",
        errorOccurred: "An error occurred: "
      }
    };

    let appData = { nextId: 1, children: [] };
    let activeChildId = null;
    let language = 'en';
    let db;

    const showToast = (message) => {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.getElementById('toast-container').appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    };

    const initDB = () => new Promise((resolve, reject) => {
      const request = indexedDB.open("BabyCareDB", 1);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { db = request.result; resolve(); };
      request.onupgradeneeded = (e) => {
        e.target.result.createObjectStore("data", { keyPath: "id" });
      };
    });

    const loadData = () => new Promise((resolve) => {
      try {
        const tx = db.transaction("data", "readonly");
        const store = tx.objectStore("data");
        const req = store.get("appData");
        req.onsuccess = () => {
          if (req.result) appData = req.result.value;
          resolve();
        };
        req.onerror = () => resolve();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
        resolve();
      }
    });

    const saveData = () => {
      try {
        const tx = db.transaction("data", "readwrite");
        const store = tx.objectStore("data");
        store.put({ id: "appData", value: appData });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const updateUI = () => {
      try {
        const t = translations[language];
        document.getElementById('app-title').textContent = t.appTitle;
        document.getElementById('children-title').textContent = t.childrenTitle;
        document.getElementById('add-child').textContent = t.addChild;
        document.getElementById('export-data').textContent = t.exportData;
        document.getElementById('import-data').textContent = t.importData;
        document.getElementById('add-milk-title').textContent = t.milkAdd;
        document.getElementById('add-milk-time-label').textContent = t.time;
        document.getElementById('add-milk-amount-label').textContent = t.milkAmount;
        document.getElementById('add-milk-save').textContent = t.save;
        document.getElementById('add-milk-cancel').textContent = t.cancel;
        renderChildren();
        renderDashboard();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const renderChildren = () => {
      try {
        const list = document.getElementById('child-list');
        list.innerHTML = '';
        appData.children.forEach(child => {
          const li = document.createElement('li');
          li.className = 'p-3 bg-blue-100 rounded hover:bg-blue-200 cursor-pointer';
          li.textContent = child.name;
          li.onclick = () => selectChild(child.id);
          list.appendChild(li);
        });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const renderDashboard = () => {
      try {
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';
        appData.children.forEach(child => {
          const card = document.createElement('div');
          card.className = 'dashboard-card';
          card.innerHTML = `
            <h3 class="text-xl font-bold text-blue-600 mb-2">${child.name}</h3>
            <p>Feeds: ${child.milkIntake.length}</p>
            <button onclick="showAddMilkDialog('${child.id}')" class="mt-4 p-2 btn-gradient text-white rounded">Add Feed</button>
          `;
          dashboard.appendChild(card);
        });
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const selectChild = (id) => {
      try {
        activeChildId = id;
        toggleSidebar();
        renderDashboard();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const showAddMilkDialog = (id) => {
      try {
        activeChildId = id;
        const dialog = document.getElementById('add-milk-dialog');
        document.getElementById('add-milk-time').value = new Date().toISOString().slice(0, 16);
        document.getElementById('add-milk-amount').value = '';
        document.getElementById('add-milk-form').onsubmit = (e) => {
          try {
            e.preventDefault();
            const time = document.getElementById('add-milk-time').value;
            const amount = parseInt(document.getElementById('add-milk-amount').value) || 0;
            if (time && amount > 0) {
              const child = appData.children.find(c => c.id === id);
              child.milkIntake.push({ timestamp: new Date(time).toISOString(), type: 'bottle', amount });
              saveData();
              scheduleNotification(child);
              renderDashboard();
              dialog.close();
            }
          } catch (err) {
            showToast(translations[language].errorOccurred + err.message);
          }
        };
        document.getElementById('add-milk-cancel').onclick = () => dialog.close();
        dialog.showModal();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const scheduleNotification = (child) => {
      try {
        if (Notification.permission === 'granted') {
          const lastFeed = child.milkIntake[child.milkIntake.length - 1];
          const nextFeedTime = new Date(lastFeed.timestamp).getTime() + 3 * 60 * 60 * 1000; // 3 hours
          const delay = nextFeedTime - Date.now();
          if (delay > 0) {
            setTimeout(() => {
              new Notification(`Time to feed ${child.name}!`, { body: 'It’s been 3 hours since the last feed.' });
            }, delay);
          }
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission();
        }
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    document.getElementById('add-child').addEventListener('click', () => {
      try {
        const name = prompt("Enter child's name:");
        if (name) {
          const id = `child${appData.nextId++}`;
          appData.children.push({ id, name, milkIntake: [] });
          saveData();
          updateUI();
        }
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    document.getElementById('menu-toggle').addEventListener('click', toggleMenu);
    document.getElementById('menu-close').addEventListener('click', toggleMenu);
    document.getElementById('sidebar-open').addEventListener('click', toggleSidebar);

    document.getElementById('export-data').addEventListener('click', () => {
      try {
        const dataStr = JSON.stringify(appData);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'baby_caring.json';
        a.click();
        URL.revokeObjectURL(url);
        toggleMenu();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    document.getElementById('import-data').addEventListener('click', () => {
      try {
        document.getElementById('import-file').click();
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    document.getElementById('import-file').addEventListener('change', (e) => {
      try {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              appData = JSON.parse(event.target.result);
              saveData();
              updateUI();
            } catch (err) {
              showToast(translations[language].errorOccurred + err.message);
            }
            toggleMenu();
          };
          reader.readAsText(file);
        }
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    });

    const toggleSidebar = () => {
      try {
        document.getElementById('sidebar').classList.toggle('hidden');
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    const toggleMenu = () => {
      try {
        const menu = document.getElementById('menu');
        menu.classList.toggle('hidden');
      } catch (err) {
        showToast(translations[language].errorOccurred + err.message);
      }
    };

    initDB().then(() => loadData()).then(() => updateUI()).catch(err => {
      showToast(translations[language].errorOccurred + err.message);
    });
  </script>
</body>
</html>
