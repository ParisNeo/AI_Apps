<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baby Caring</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Comic Neue', cursive;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec, #fff9c4);
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .slide { transition: transform 0.3s ease-in-out; }
    .slide.hidden { transform: translateX(100%); display: none; }
    .slide-left.hidden { transform: translateX(-100%); display: none; }
    .btn-icon { transition: transform 0.2s; }
    .btn-icon:hover { transform: scale(1.1); }
    .shadow-glow { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
    .rounded-xl { border-radius: 1.5rem; }
    .btn-gradient { background: linear-gradient(90deg, #60a5fa, #a78bfa); }
    .dashboard-card { transition: all 0.2s; }
    .dashboard-card:hover { transform: translateY(-5px); }
    .tooltip { position: relative; }
    .tooltip:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%; left: 50%; transform: translateX(-50%);
      background: #333; color: white; padding: 5px 10px; border-radius: 5px;
      font-size: 0.9rem; white-space: nowrap; z-index: 10;
    }
    .tip-box { animation: fadeIn 1s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; }}
    .sync-status { font-size: 0.9rem; }
    dialog { border: none; border-radius: 1rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); background: white; padding: 1.5rem; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
    .dashboard-grid { display: grid; gap: 3rem; }
    .slider { background-color: #a78bfa; }
    #add-feed-type:checked + .slider { background-color: #60a5fa; }
    #add-feed-type:checked + .slider:before { transform: translateX(2rem); }
    .dashboard-card { padding: 2rem; }
    .dashboard-card h3 { font-size: 1.75rem; }
    .dashboard-card p { font-size: 1.25rem; }
    button, input, select { font-size: 1.125rem; padding: 0.75rem; }
    .btn-icon { width: 2rem; height: 2rem; }
    @media (max-width: 640px) {
      .safe-area { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .dashboard-card { padding: 1.5rem; }
      button, input, select { font-size: 1rem; padding: 0.5rem; }
    }
    @media (min-width: 641px) {
      .dashboard-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    }
  </style>
</head>
<body class="safe-area">
  <div class="flex flex-col md:flex-row h-full">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-full md:w-1/4 bg-white p-6 shadow-glow slide-left fixed md:static h-full z-20 rounded-r-xl hidden md:block">
      <header class="flex justify-between items-center mb-6">
        <h1 id="app-title" class="text-3xl font-bold text-blue-600">Baby Caring</h1>
        <div class="flex space-x-4">
          <button id="menu-toggle" class="text-gray-600 tooltip" data-tooltip="Menu">
            <i class="fas fa-bars w-8 h-8"></i>
          </button>
          <button id="sidebar-close" class="md:hidden text-gray-600 tooltip" data-tooltip="Close">
            <i class="fas fa-times w-8 h-8"></i>
          </button>
        </div>
      </header>
      <h2 id="children-title" class="text-xl font-semibold text-blue-600 mb-4">Children</h2>
      <ul id="child-list" class="space-y-3 mb-6"></ul>
      <button id="add-child" class="w-full p-3 btn-gradient text-white rounded-full shadow-glow flex justify-center items-center tooltip" data-tooltip="Add a new child">
        <i class="fas fa-plus btn-icon mr-2"></i> <span>Add Child</span>
      </button>
      <div id="menu" class="slide hidden fixed top-0 right-0 w-3/4 md:w-1/4 h-full bg-white p-6 shadow-glow z-30 rounded-l-xl">
        <div class="flex justify-end mb-6">
          <button id="menu-close" class="text-gray-600 tooltip" data-tooltip="Close">
            <i class="fas fa-times w-8 h-8"></i>
          </button>
        </div>
        <div class="space-y-4">
          <button id="export-data" class="w-full p-3 bg-blue-400 text-white rounded-full flex justify-center items-center hover:bg-blue-500 tooltip" data-tooltip="Download data as Markdown">
            <i class="fas fa-download btn-icon mr-2"></i> <span>Export Data</span>
          </button>
          <input type="file" id="import-file" class="hidden" accept=".json">
          <button id="import-data" class="w-full p-3 bg-green-400 text-white rounded-full flex justify-center items-center hover:bg-green-500 tooltip" data-tooltip="Upload saved data">
            <i class="fas fa-upload btn-icon mr-2"></i> <span>Import Data</span>
          </button>
          <button id="share-data" class="w-full p-3 bg-yellow-400 text-white rounded-full flex justify-center items-center hover:bg-yellow-500 tooltip" data-tooltip="Share via email or clipboard">
            <i class="fas fa-share-alt btn-icon mr-2"></i> <span>Share Data</span>
          </button>
          <button id="toggle-lang" class="w-full p-3 bg-gray-400 text-white rounded-full flex justify-center items-center hover:bg-gray-500 tooltip" data-tooltip="Switch language">
            <i class="fas fa-language btn-icon mr-2"></i> <span>Switch Language</span>
          </button>
          <button id="sync-bluetooth" class="w-full p-3 bg-indigo-400 text-white rounded-full flex justify-center items-center hover:bg-indigo-500 tooltip" data-tooltip="Sync with another device">
            <i class="fas fa-bluetooth btn-icon mr-2"></i> <span>Sync via Bluetooth</span>
          </button>
          <button id="settings-toggle" class="w-full p-3 bg-purple-400 text-white rounded-full flex justify-center items-center hover:bg-purple-500 tooltip" data-tooltip="Adjust settings">
            <i class="fas fa-cog btn-icon mr-2"></i> <span>Settings</span>
          </button>
        </div>
      </div>
      <div id="settings" class="slide hidden fixed top-0 right-0 w-3/4 md:w-1/4 h-full bg-white p-6 shadow-glow z-30 rounded-l-xl">
        <div class="flex justify-end mb-6">
          <button id="settings-close" class="text-gray-600 tooltip" data-tooltip="Close">
            <i class="fas fa-times w-8 h-8"></i>
          </button>
        </div>
        <h3 class="text-xl font-semibold text-blue-600 mb-4">Settings</h3>
        <div class="space-y-4">
          <label class="block text-blue-600">Milk Reminder Interval (hours):</label>
          <input type="number" id="milk-interval" min="1" max="24" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
          <label class="block text-blue-600">Enable Notifications:</label>
          <input type="checkbox" id="notify-enable" class="h-5 w-5 text-blue-600">
          <button id="save-settings" class="w-full p-3 btn-gradient text-white rounded-full shadow-glow">Save</button>
        </div>
      </div>
    </aside>
    <!-- Main Content -->
    <main id="main-content" class="w-full md:w-3/4 p-6 relative"></main>
    <!-- Edit Dialogs -->
    <dialog id="edit-milk-dialog">
      <h3 class="text-xl font-semibold text-blue-600 mb-4">Edit Feeding</h3>
      <form id="edit-milk-form" class="space-y-4">
        <div>
          <label class="block text-blue-600">Time:</label>
          <input type="datetime-local" id="edit-milk-time" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div>
          <label class="block text-blue-600">Type:</label>
          <select id="edit-milk-type" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
            <option value="breast">Breastfeed</option>
            <option value="bottle">Bottle Feed</option>
          </select>
        </div>
        <div>
          <label class="block text-blue-600" id="edit-milk-value-label"></label>
          <input type="number" id="edit-milk-value" min="0" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div class="flex space-x-4">
          <button type="submit" class="w-full p-3 btn-gradient text-white rounded-full shadow-glow">Save</button>
          <button type="button" id="edit-milk-cancel" class="w-full p-3 bg-gray-400 text-white rounded-full shadow-glow">Cancel</button>
        </div>
      </form>
    </dialog>
    <dialog id="edit-diaper-dialog">
      <h3 class="text-xl font-semibold text-blue-600 mb-4">Edit Diaper Change</h3>
      <form id="edit-diaper-form" class="space-y-4">
        <div>
          <label class="block text-blue-600">Time:</label>
          <input type="datetime-local" id="edit-diaper-time" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div>
          <label class="block text-blue-600">Type:</label>
          <select id="edit-diaper-type" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
            <option value="wet">Wet</option>
            <option value="dirty">Dirty</option>
            <option value="both">Both</option>
          </select>
        </div>
        <div class="flex space-x-4">
          <button type="submit" class="w-full p-3 btn-gradient text-white rounded-full shadow-glow">Save</button>
          <button type="button" id="edit-diaper-cancel" class="w-full p-3 bg-gray-400 text-white rounded-full shadow-glow">Cancel</button>
        </div>
      </form>
    </dialog>
    <dialog id="edit-child-dialog">
      <h3 class="text-xl font-semibold text-blue-600 mb-4">Edit Child</h3>
      <form id="edit-child-form" class="space-y-4">
        <div>
          <label class="block text-blue-600">Name:</label>
          <input type="text" id="edit-child-name" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div>
          <label class="block text-blue-600">Gender:</label>
          <select id="edit-child-gender" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
            <option value="boy">Boy</option>
            <option value="girl">Girl</option>
          </select>
        </div>
        <div>
          <label class="block text-blue-600">Birthdate:</label>
          <input type="date" id="edit-child-birthdate" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div class="flex space-x-4">
          <button type="submit" class="w-full p-3 btn-gradient text-white rounded-full shadow-glow">Save</button>
          <button type="button" id="edit-child-cancel" class="w-full p-3 bg-gray-400 text-white rounded-full shadow-glow">Cancel</button>
        </div>
      </form>
    </dialog>
    <!-- Add Modals -->
    <dialog id="add-milk-dialog">
      <h3 class="text-xl font-semibold text-blue-600 mb-4">Add Feeding</h3>
      <form id="add-milk-form" class="space-y-6">
        <div class="flex items-center justify-center">
          <label class="text-blue-600 mr-4">Bottle Feed</label>
          <div class="relative inline-block w-16 h-8">
            <input type="checkbox" id="add-feed-type" class="opacity-0 w-0 h-0">
            <span class="slider absolute cursor-pointer top-0 left-0 right-0 bottom-0 bg-gray-300 rounded-full transition-all duration-300 before:absolute before:h-6 before:w-6 before:left-1 before:top-1 before:bg-white before:rounded-full before:transition-all before:duration-300"></span>
          </div>
          <label class="text-blue-600 ml-4">Breastfeed</label>
        </div>
        <div>
          <label class="block text-blue-600 text-lg">Time:</label>
          <input type="datetime-local" id="add-milk-time" class="w-full p-4 text-lg border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div>
          <label class="block text-blue-600 text-lg" id="add-milk-value-label">Amount (ml)</label>
          <input type="number" id="add-milk-value" min="0" class="w-full p-4 text-lg border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div class="flex space-x-4">
          <button type="submit" class="w-full p-4 btn-gradient text-white text-lg rounded-full shadow-glow">Add</button>
          <button type="button" id="add-milk-cancel" class="w-full p-4 bg-gray-400 text-white text-lg rounded-full shadow-glow">Cancel</button>
        </div>
      </form>
    </dialog>
    <dialog id="add-diaper-dialog">
      <h3 class="text-xl font-semibold text-blue-600 mb-4">Add Diaper Change</h3>
      <form id="add-diaper-form" class="space-y-4">
        <div>
          <label class="block text-blue-600">Time:</label>
          <input type="datetime-local" id="add-diaper-time" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
        </div>
        <div>
          <label class="block text-blue-600">Type:</label>
          <select id="add-diaper-type" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50">
            <option value="wet">Wet</option>
            <option value="dirty">Dirty</option>
            <option value="both">Both</option>
          </select>
        </div>
        <div class="flex space-x-4">
          <button type="submit" class="w-full p-3 btn-gradient text-white rounded-full shadow-glow">Add</button>
          <button type="button" id="add-diaper-cancel" class="w-full p-3 bg-gray-400 text-white rounded-full shadow-glow">Cancel</button>
        </div>
      </form>
    </dialog>
  </div>

  <script>
    // Translations
    const translations = {
      en: {
        appTitle: "Baby Caring",
        childrenTitle: "Children",
        addChild: "Add Child",
        dashboard: "Dashboard",
        atHome: "At Home",
        nextMilk: "Next Feeding",
        milkTitle: "Feeding",
        milkAmount: "Amount (ml)",
        milkDuration: "Duration (min)",
        milkAdd: "Add",
        breastFeed: "Breastfeed",
        bottleFeed: "Bottle Feed",
        diaperTitle: "Diaper Changes",
        diaperWet: "Wet",
        diaperDirty: "Dirty",
        diaperBoth: "Both",
        diaperAdd: "Add",
        exportData: "Export Data",
        importData: "Import Data",
        shareData: "Share Data",
        toggleLang: "Switch to French",
        syncBluetooth: "Sync via Bluetooth",
        settings: "Settings",
        gender: "Gender",
        birthdate: "Birthdate",
        boy: "Boy",
        girl: "Girl",
        milkIntervals: "Feeding Intervals",
        addChildPrompt: "Enter child's name:",
        genderPrompt: "Select gender (Boy/Girl):",
        birthdatePrompt: "Enter birthdate (YYYY-MM-DD):",
        selectChildAlert: "Please select a child first.",
        milkValidation: "Please fill in valid time and amount/duration.",
        diaperValidation: "Please fill in a valid time.",
        importSuccess: "Data imported successfully.",
        importFormat: "Invalid data format.",
        importError: "Error parsing JSON: ",
        deleteConfirm: "Are you sure you want to delete this child?",
        shareSuccess: "Data copied to clipboard! Paste it anywhere or use the email link.",
        shareError: "Sharing not supported. Data copied to clipboard instead.",
        bluetoothNotSupported: "Bluetooth not supported on this device.",
        bluetoothSyncSuccess: "Data synced successfully!",
        bluetoothSyncError: "Error during Bluetooth sync."
      },
      fr: {
        appTitle: "Soins Bébé",
        childrenTitle: "Enfants",
        addChild: "Ajouter un enfant",
        dashboard: "Tableau de bord",
        atHome: "À la maison",
        nextMilk: "Prochain repas",
        milkTitle: "Alimentation",
        milkAmount: "Quantité (ml)",
        milkDuration: "Durée (min)",
        milkAdd: "Ajouter",
        breastFeed: "Allaitement",
        bottleFeed: "Biberon",
        diaperTitle: "Changements de couche",
        diaperWet: "Mouillée",
        diaperDirty: "Sale",
        diaperBoth: "Les deux",
        diaperAdd: "Ajouter",
        exportData: "Exporter les données",
        importData: "Importer les données",
        shareData: "Partager les données",
        toggleLang: "Passer à l'anglais",
        syncBluetooth: "Synchroniser via Bluetooth",
        settings: "Paramètres",
        gender: "Genre",
        birthdate: "Date de naissance",
        boy: "Garçon",
        girl: "Fille",
        milkIntervals: "Intervalles d'alimentation",
        addChildPrompt: "Entrez le nom de l'enfant :",
        genderPrompt: "Sélectionnez le genre (Garçon/Fille) :",
        birthdatePrompt: "Entrez la date de naissance (AAAA-MM-JJ) :",
        selectChildAlert: "Veuillez d'abord sélectionner un enfant.",
        milkValidation: "Veuillez remplir une heure et une quantité/durée valides.",
        diaperValidation: "Veuillez remplir une heure valide.",
        importSuccess: "Données importées avec succès.",
        importFormat: "Format de données invalide.",
        importError: "Erreur lors de l'analyse JSON : ",
        deleteConfirm: "Êtes-vous sûr de vouloir supprimer cet enfant ?",
        shareSuccess: "Données copiées dans le presse-papiers ! Collez-les n'importe où ou utilisez le lien email.",
        shareError: "Partage non supporté. Données copiées dans le presse-papiers à la place.",
        bluetoothNotSupported: "Bluetooth non supporté sur cet appareil.",
        bluetoothSyncSuccess: "Données synchronisées avec succès !",
        bluetoothSyncError: "Erreur lors de la synchronisation Bluetooth."
      }
    };

    // Parenting Tips
    const tips = [
      "Sing to your baby to help them feel calm and secure!",
      "A warm bath before bedtime can improve sleep.",
      "Track feeding times to spot patterns in your baby’s routine.",
      "Skin-to-skin contact boosts bonding and comfort.",
      "Keep a small toy handy to distract during diaper changes.",
      "Babies love routine—try to keep nap times consistent.",
      "A gentle massage can soothe a fussy baby.",
      "Stay hydrated yourself—it helps with milk supply if breastfeeding!"
    ];

    // State
    let appData = { nextId: 1, children: [] };
    let activeChildId = null;
    let language = localStorage.getItem('language') || 'en';
    let settings = {
      milkInterval: parseInt(localStorage.getItem('milkInterval')) || 3,
      notifications: localStorage.getItem('notifications') === 'true'
    };
    let db;
    let isBreastfeeding = false;

    // IndexedDB Setup
    const dbName = "BabyCareDB";
    const initDB = () => new Promise((resolve, reject) => {
      const request = indexedDB.open(dbName, 1);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { db = request.result; resolve(); };
      request.onupgradeneeded = (e) => {
        e.target.result.createObjectStore("data", { keyPath: "id" });
      };
    });

    const loadData = () => new Promise((resolve) => {
      const tx = db.transaction("data", "readonly");
      const store = tx.objectStore("data");
      const req = store.get("appData");
      req.onsuccess = () => {
        if (req.result) appData = req.result.value;
        resolve();
      };
      req.onerror = () => resolve();
    });

    const saveData = () => {
      const tx = db.transaction("data", "readwrite");
      const store = tx.objectStore("data");
      store.put({ id: "appData", value: appData });
    };

    // UI Updates
    const updateUI = () => {
      const t = translations[language];
      document.getElementById('app-title').textContent = t.appTitle;
      document.getElementById('children-title').textContent = t.childrenTitle;
      document.getElementById('add-child').querySelector('span').textContent = t.addChild;
      document.getElementById('export-data').querySelector('span').textContent = t.exportData;
      document.getElementById('import-data').querySelector('span').textContent = t.importData;
      document.getElementById('share-data').querySelector('span').textContent = t.shareData;
      document.getElementById('toggle-lang').querySelector('span').textContent = t.toggleLang;
      document.getElementById('sync-bluetooth').querySelector('span').textContent = t.syncBluetooth;
      document.getElementById('settings-toggle').querySelector('span').textContent = t.settings;
      renderChildren();
      renderDashboard();
    };

    // Render Functions
    const renderChildren = () => {
      const list = document.getElementById('child-list');
      list.innerHTML = '';
      appData.children.forEach(child => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center p-3 bg-blue-100 rounded-lg hover:bg-blue-200';
        li.innerHTML = `
          <span onclick="selectChild('${child.id}')" class="cursor-pointer flex-1">${child.name}</span>
          <button onclick="editChild('${child.id}')" class="text-blue-500 hover:text-blue-600 tooltip" data-tooltip="Edit">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          </button>
          <button onclick="deleteChild('${child.id}')" class="text-red-500 hover:text-red-600 tooltip" data-tooltip="Delete">
            <i class="fas fa-trash btn-icon"></i>
          </button>
        `;
        list.appendChild(li);
      });
    };

    const renderDashboard = () => {
      const main = document.getElementById('main-content');
      const t = translations[language];
      main.innerHTML = `
        <header class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-blue-600">${t.dashboard}</h2>
          <div class="flex space-x-4">
            <span id="sync-status" class="sync-status text-gray-600">Sync: Offline</span>
            <button id="sidebar-open" class="md:hidden text-gray-600 tooltip" data-tooltip="Menu">
              <i class="fas fa-bars w-8 h-8"></i>
            </button>
          </div>
        </header>
        <div id="dashboard" class="dashboard-grid"></div>
        <button id="dashboard-add-child" class="fixed bottom-8 right-8 p-4 btn-gradient text-white rounded-full shadow-glow flex items-center tooltip" data-tooltip="Add a new child">
          <i class="fas fa-plus btn-icon"></i>
        </button>
        <div id="tip-box" class="absolute bottom-4 right-4 bg-yellow-100 p-4 rounded-xl shadow-glow text-blue-600 hidden tip-box"></div>
      `;
      
      const dashboard = document.getElementById('dashboard');
      dashboard.innerHTML = '';
      
      if (appData.children.length === 0) {
        dashboard.innerHTML = '<p class="text-gray-600 text-center">No children added yet. Click the "+" button to begin.</p>';
      } else {
        appData.children.forEach(child => {
          const card = document.createElement('div');
          card.className = 'dashboard-card bg-white p-6 rounded-xl shadow-glow flex flex-col items-center';
          const lastMilk = child.milkIntake.length ? new Date(child.milkIntake[child.milkIntake.length - 1].timestamp) : null;
          const nextMilk = lastMilk ? new Date(lastMilk.getTime() + settings.milkInterval * 60 * 60 * 1000) : null;
          const now = new Date();
          const timeLeft = nextMilk && nextMilk > now ? Math.floor((nextMilk - now) / (1000 * 60)) : 0;
          const timeLeftText = lastMilk ? (timeLeft > 0 ? `${timeLeft} min` : 'Now') : 'N/A';
          const percentageLeft = lastMilk && nextMilk > now ? (timeLeft / (settings.milkInterval * 60)) : 0;
          const redValue = Math.floor(255 * (1 - percentageLeft));
          const color = timeLeft > 0 ? `rgb(${redValue}, 100, 100)` : '#ff0000';
          const genderIcon = child.gender === 'boy' ? 'fa-mars' : 'fa-venus';
          card.innerHTML = `
            <i class="fas fa-baby text-4xl text-blue-600 mb-4"></i>
            <h3 class="text-xl font-bold text-blue-600">${child.name}</h3>
            <p class="text-gray-600"><i class="fas ${genderIcon} mr-2"></i> ${t.gender}: ${t[child.gender]}</p>
            <p class="text-gray-600"><i class="fas fa-birthday-cake mr-2"></i> ${t.birthdate}: ${child.birthdate || 'N/A'}</p>
            <p class="text-gray-600"><i class="fas fa-home mr-2"></i> ${t.atHome}</p>
            <p class="text-gray-600" style="color: ${color};"><i class="fas fa-bottle-baby mr-2"></i> ${t.nextMilk}: ${timeLeftText}</p>
            <canvas id="chart-${child.id}" class="w-full h-32 mt-4"></canvas>
            <div class="flex space-x-4 mt-4">
              <button onclick="showDetails('${child.id}')" class="p-3 btn-gradient text-white rounded-full flex items-center tooltip" data-tooltip="View details">
                <i class="fas fa-info-circle mr-2"></i> Details
              </button>
              <button onclick="showEditChildDialog('${child.id}')" class="p-3 bg-blue-500 text-white rounded-full flex items-center tooltip" data-tooltip="Edit child">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
            </div>
          `;
          dashboard.appendChild(card);
          renderChart(child);
          if (timeLeft === 0 && lastMilk) notifyFeedingTime(child);
        });
      }
      
      addTouchAndClick(document.getElementById('sidebar-open'), toggleSidebar);
      addTouchAndClick(document.getElementById('dashboard-add-child'), addChildFromDashboard);
      showRandomTip();
    };

    const renderChart = (child) => {
      const ctx = document.getElementById(`chart-${child.id}`).getContext('2d');
      const timestamps = child.milkIntake.map(m => new Date(m.timestamp)).sort((a, b) => a - b);
      const intervals = [];
      for (let i = 1; i < timestamps.length; i++) {
        intervals.push((timestamps[i] - timestamps[i - 1]) / (1000 * 60 * 60));
      }
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: intervals.map((_, i) => `Feed ${i + 1}`),
          datasets: [{
            label: translations[language].milkIntervals,
            data: intervals,
            borderColor: '#60a5fa',
            fill: false,
            tension: 0.1
          }]
        },
        options: {
          scales: { y: { beginAtZero: true, title: { display: true, text: 'Hours' } } },
          plugins: { legend: { display: false } }
        }
      });
    };

    const showDetails = (id) => {
      activeChildId = id;
      const child = appData.children.find(c => c.id === id);
      const t = translations[language];
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <header class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-blue-600">${child.name}</h2>
          <button id="back-to-dashboard" class="text-gray-600 tooltip" data-tooltip="Back to Dashboard">
            <i class="fas fa-arrow-left w-8 h-8"></i>
          </button>
        </header>
        <section class="mb-8 bg-white p-6 rounded-xl shadow-glow">
          <div class="flex justify-between items-center mb-3">
            <h4 class="text-lg font-semibold text-blue-600">${t.milkTitle} History</h4>
            <button onclick="showAddMilkDialog()" class="text-blue-600 tooltip" data-tooltip="Add new feeding">
              <i class="fas fa-plus w-6 h-6"></i>
            </button>
          </div>
          <ul id="milk-list" class="list-disc pl-5 space-y-2"></ul>
        </section>
        <section class="bg-white p-6 rounded-xl shadow-glow">
          <div class="flex justify-between items-center mb-3">
            <h4 class="text-lg font-semibold text-blue-600">${t.diaperTitle} History</h4>
            <button onclick="showAddDiaperDialog()" class="text-blue-600 tooltip" data-tooltip="Add new diaper change">
              <i class="fas fa-plus w-6 h-6"></i>
            </button>
          </div>
          <ul id="diaper-list" class="list-disc pl-5 space-y-2"></ul>
        </section>
      `;
      renderMilk();
      renderDiapers();
      document.getElementById('back-to-dashboard').addEventListener('click', () => {
        activeChildId = null;
        renderDashboard();
      });
      document.getElementById('back-to-dashboard').addEventListener('touchstart', () => {
        activeChildId = null;
        renderDashboard();
      });
    };

    const renderMilk = () => {
      const list = document.getElementById('milk-list');
      if (!list) return;
      list.innerHTML = '';
      const t = translations[language];
      const child = appData.children.find(c => c.id === activeChildId);
      child.milkIntake.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      child.milkIntake.forEach((intake, idx) => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center text-blue-600';
        const valueText = intake.type === 'breast' ? `${intake.duration} min` : `${intake.amount} ml`;
        li.innerHTML = `
          ${new Date(intake.timestamp).toLocaleString()} - ${t[intake.type + 'Feed']} - ${valueText}
          <div class="flex space-x-2">
            <button onclick="showEditMilkDialog(${idx})" class="text-blue-500 hover:text-blue-600 tooltip" data-tooltip="Edit">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <button onclick="deleteMilk(${idx})" class="text-red-500 hover:text-red-600 tooltip" data-tooltip="Delete">
              <i class="fas fa-trash btn-icon"></i>
            </button>
          </div>
        `;
        list.appendChild(li);
      });
    };

    const renderDiapers = () => {
      const list = document.getElementById('diaper-list');
      if (!list) return;
      list.innerHTML = '';
      const t = translations[language];
      const child = appData.children.find(c => c.id === activeChildId);
      child.diaperChanges.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      child.diaperChanges.forEach((change, idx) => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center text-blue-600';
        const type = t[`diaper${change.type.charAt(0).toUpperCase() + change.type.slice(1)}`];
        li.innerHTML = `
          ${new Date(change.timestamp).toLocaleString()} - ${type}
          <div class="flex space-x-2">
            <button onclick="showEditDiaperDialog(${idx})" class="text-blue-500 hover:text-blue-600 tooltip" data-tooltip="Edit">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <button onclick="deleteDiaper(${idx})" class="text-red-500 hover:text-red-600 tooltip" data-tooltip="Delete">
              <i class="fas fa-trash btn-icon"></i>
            </button>
          </div>
        `;
        list.appendChild(li);
      });
    };

    // Event Handlers
    const selectChild = (id) => {
      activeChildId = id;
      showDetails(id);
      toggleSidebar();
    };

    const deleteChild = (id) => {
      if (confirm(translations[language].deleteConfirm)) {
        appData.children = appData.children.filter(c => c.id !== id);
        if (activeChildId === id) activeChildId = null;
        saveData();
        updateUI();
      }
    };

    const editChild = (id) => {
      showEditChildDialog(id);
    };

    const showEditChildDialog = (id) => {
      const child = appData.children.find(c => c.id === id);
      const dialog = document.getElementById('edit-child-dialog');
      document.getElementById('edit-child-name').value = child.name;
      document.getElementById('edit-child-gender').value = child.gender;
      document.getElementById('edit-child-birthdate').value = child.birthdate || '';
      document.getElementById('edit-child-form').onsubmit = (e) => {
        e.preventDefault();
        const name = document.getElementById('edit-child-name').value.trim();
        const gender = document.getElementById('edit-child-gender').value;
        const birthdate = document.getElementById('edit-child-birthdate').value;
        if (name && (gender === 'boy' || gender === 'girl') && /^\d{4}-\d{2}-\d{2}$/.test(birthdate)) {
          child.name = name;
          child.gender = gender;
          child.birthdate = birthdate;
          saveData();
          updateUI();
          dialog.close();
        } else {
          alert("Please enter a valid name, gender (Boy/Girl), and birthdate (YYYY-MM-DD).");
        }
      };
      document.getElementById('edit-child-cancel').onclick = () => dialog.close();
      dialog.showModal();
    };

    const deleteMilk = (idx) => {
      const child = appData.children.find(c => c.id === activeChildId);
      child.milkIntake.splice(idx, 1);
      saveData();
      renderMilk();
      renderDashboard();
    };

    const deleteDiaper = (idx) => {
      const child = appData.children.find(c => c.id === activeChildId);
      child.diaperChanges.splice(idx, 1);
      saveData();
      renderDiapers();
    };

    const showEditMilkDialog = (idx) => {
      const child = appData.children.find(c => c.id === activeChildId);
      const intake = child.milkIntake[idx];
      const dialog = document.getElementById('edit-milk-dialog');
      const t = translations[language];
      document.getElementById('edit-milk-time').value = intake.timestamp.slice(0, 16);
      document.getElementById('edit-milk-type').value = intake.type;
      document.getElementById('edit-milk-value-label').textContent = intake.type === 'breast' ? t.milkDuration : t.milkAmount;
      document.getElementById('edit-milk-value').value = intake.type === 'breast' ? intake.duration : intake.amount;
      document.getElementById('edit-milk-type').onchange = (e) => {
        document.getElementById('edit-milk-value-label').textContent = e.target.value === 'breast' ? t.milkDuration : t.milkAmount;
      };
      document.getElementById('edit-milk-form').onsubmit = (e) => {
        e.preventDefault();
        intake.timestamp = new Date(document.getElementById('edit-milk-time').value).toISOString();
        intake.type = document.getElementById('edit-milk-type').value;
        if (intake.type === 'breast') {
          intake.duration = parseInt(document.getElementById('edit-milk-value').value);
          delete intake.amount;
        } else {
          intake.amount = parseInt(document.getElementById('edit-milk-value').value);
          delete intake.duration;
        }
        saveData();
        renderMilk();
        renderDashboard();
        dialog.close();
      };
      document.getElementById('edit-milk-cancel').onclick = () => dialog.close();
      dialog.showModal();
    };

    const showEditDiaperDialog = (idx) => {
      const child = appData.children.find(c => c.id === activeChildId);
      const change = child.diaperChanges[idx];
      const dialog = document.getElementById('edit-diaper-dialog');
      document.getElementById('edit-diaper-time').value = change.timestamp.slice(0, 16);
      document.getElementById('edit-diaper-type').value = change.type;
      document.getElementById('edit-diaper-form').onsubmit = (e) => {
        e.preventDefault();
        change.timestamp = new Date(document.getElementById('edit-diaper-time').value).toISOString();
        change.type = document.getElementById('edit-diaper-type').value;
        saveData();
        renderDiapers();
        dialog.close();
      };
      document.getElementById('edit-diaper-cancel').onclick = () => dialog.close();
      dialog.showModal();
    };

    const showAddMilkDialog = () => {
      const dialog = document.getElementById('add-milk-dialog');
      const t = translations[language];
      const feedType = document.getElementById('add-feed-type');
      feedType.checked = isBreastfeeding;
      document.getElementById('add-milk-time').value = '';
      document.getElementById('add-milk-value').value = '';
      document.getElementById('add-milk-value-label').textContent = isBreastfeeding ? t.milkDuration : t.milkAmount;
      feedType.onchange = (e) => {
        isBreastfeeding = e.target.checked;
        document.getElementById('add-milk-value-label').textContent = isBreastfeeding ? t.milkDuration : t.milkAmount;
      };
      document.getElementById('add-milk-form').onsubmit = (e) => {
        e.preventDefault();
        if (!activeChildId) return alert(t.selectChildAlert);
        const time = document.getElementById('add-milk-time').value;
        const value = document.getElementById('add-milk-value').value;
        if (!time || !value || value <= 0) return alert(t.milkValidation);
        const child = appData.children.find(c => c.id === activeChildId);
        const entry = { timestamp: new Date(time).toISOString(), type: isBreastfeeding ? 'breast' : 'bottle' };
        if (isBreastfeeding) entry.duration = parseInt(value); else entry.amount = parseInt(value);
        child.milkIntake.push(entry);
        saveData();
        renderMilk();
        renderDashboard();
        scheduleReminder(child);
        dialog.close();
      };
      document.getElementById('add-milk-cancel').onclick = () => dialog.close();
      dialog.showModal();
    };

    const showAddDiaperDialog = () => {
      const dialog = document.getElementById('add-diaper-dialog');
      const t = translations[language];
      document.getElementById('add-diaper-time').value = '';
      document.getElementById('add-diaper-type').value = 'wet';
      document.getElementById('add-diaper-form').onsubmit = (e) => {
        e.preventDefault();
        if (!activeChildId) return alert(t.selectChildAlert);
        const time = document.getElementById('add-diaper-time').value;
        const type = document.getElementById('add-diaper-type').value;
        if (!time) return alert(t.diaperValidation);
        const child = appData.children.find(c => c.id === activeChildId);
        child.diaperChanges.push({ timestamp: new Date(time).toISOString(), type });
        saveData();
        renderDiapers();
        dialog.close();
      };
      document.getElementById('add-diaper-cancel').onclick = () => dialog.close();
      dialog.showModal();
    };

    // Event Listeners
    const addTouchAndClick = (element, handler) => {
      element.addEventListener('click', handler);
      element.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handler(e);
      });
    };

    const addChildFromDashboard = () => {
      const t = translations[language];
      const name = prompt(t.addChildPrompt);
      if (!name) return;
      const gender = prompt(t.genderPrompt).toLowerCase();
      if (gender !== 'boy' && gender !== 'girl') return alert("Please enter 'Boy' or 'Girl'.");
      const birthdate = prompt(t.birthdatePrompt);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(birthdate)) return alert("Invalid date format. Use YYYY-MM-DD.");
      const id = `child${appData.nextId++}`;
      appData.children.push({ id, name, gender, birthdate, milkIntake: [], diaperChanges: [] });
      saveData();
      updateUI();
    };

    addTouchAndClick(document.getElementById('add-child'), addChildFromDashboard);

    addTouchAndClick(document.getElementById('export-data'), () => {
      let md = "# Baby Caring Data\n\n";
      appData.children.forEach(c => {
        md += `## ${c.name}\n- **Gender**: ${translations[language][c.gender]}\n- **Birthdate**: ${c.birthdate || 'N/A'}\n\n### Feeding\n`;
        c.milkIntake.forEach(m => md += `- ${new Date(m.timestamp).toLocaleString()} - ${translations[language][m.type + 'Feed']} - ${m.type === 'breast' ? `${m.duration} min` : `${m.amount} ml`}\n`);
        md += "\n### Diaper Changes\n";
        c.diaperChanges.forEach(d => md += `- ${new Date(d.timestamp).toLocaleString()} - ${translations[language][`diaper${d.type.charAt(0).toUpperCase() + d.type.slice(1)}`]}\n`);
        md += "\n";
      });
      const blob = new Blob([md], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'baby_caring.md';
      a.click();
      URL.revokeObjectURL(url);
      toggleMenu();
    });

    addTouchAndClick(document.getElementById('import-data'), () => {
      document.getElementById('import-file').click();
    });

    document.getElementById('import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.nextId && Array.isArray(imported.children)) {
              appData = imported;
              saveData();
              activeChildId = null;
              updateUI();
              alert(translations[language].importSuccess);
            } else {
              alert(translations[language].importFormat);
            }
          } catch (err) {
            alert(translations[language].importError + err.message);
          }
          toggleMenu();
        };
        reader.readAsText(file);
      }
    });

    addTouchAndClick(document.getElementById('share-data'), () => {
      let md = "# Baby Caring Data\n\n";
      appData.children.forEach(c => {
        md += `## ${c.name}\n- **Gender**: ${translations[language][c.gender]}\n- **Birthdate**: ${c.birthdate || 'N/A'}\n\n### Feeding\n`;
        c.milkIntake.forEach(m => md += `- ${new Date(m.timestamp).toLocaleString()} - ${translations[language][m.type + 'Feed']} - ${m.type === 'breast' ? `${m.duration} min` : `${m.amount} ml`}\n`);
        md += "\n### Diaper Changes\n";
        c.diaperChanges.forEach(d => md += `- ${new Date(d.timestamp).toLocaleString()} - ${translations[language][`diaper${d.type.charAt(0).toUpperCase() + d.type.slice(1)}`]}\n`);
        md += "\n";
      });
      if (navigator.share) {
        navigator.share({ title: 'Baby Caring Data', text: md })
          .catch(() => fallbackShare(md));
      } else {
        fallbackShare(md);
      }
      toggleMenu();
    });

    const fallbackShare = (text) => {
      navigator.clipboard.writeText(text).then(() => {
        const email = `mailto:?subject=Baby Caring Data&body=${encodeURIComponent(text)}`;
        const a = document.createElement('a');
        a.href = email;
        a.click();
        alert(translations[language].shareSuccess);
      }).catch(() => alert(translations[language].shareError));
    };

    addTouchAndClick(document.getElementById('toggle-lang'), () => {
      language = language === 'en' ? 'fr' : 'en';
      localStorage.setItem('language', language);
      updateUI();
      toggleMenu();
    });

    addTouchAndClick(document.getElementById('sync-bluetooth'), async () => {
      if (!navigator.bluetooth) {
        alert(translations[language].bluetoothNotSupported);
        return;
      }
      try {
        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['battery_service'] });
        const server = await device.gatt.connect();
        document.getElementById('sync-status').textContent = `Sync: Connected to ${device.name}`;
        const dataToSend = JSON.stringify(appData);
        console.log("Sending data:", dataToSend);
        const receivedData = prompt("Simulated Bluetooth receive: Paste JSON data from other device (or cancel to skip):");
        if (receivedData) {
          try {
            const newData = JSON.parse(receivedData);
            if (newData.nextId && Array.isArray(newData.children)) {
              appData = mergeData(appData, newData);
              saveData();
              updateUI();
              alert(translations[language].bluetoothSyncSuccess);
            } else {
              alert(translations[language].importFormat);
            }
          } catch (err) {
            alert(translations[language].bluetoothSyncError + err.message);
          }
        }
        server.disconnect();
        document.getElementById('sync-status').textContent = "Sync: Offline";
      } catch (err) {
        alert(translations[language].bluetoothSyncError + err.message);
        document.getElementById('sync-status').textContent = "Sync: Error";
      }
      toggleMenu();
    });

    const mergeData = (localData, remoteData) => {
      const merged = { nextId: Math.max(localData.nextId, remoteData.nextId), children: [] };
      const allChildren = [...localData.children, ...remoteData.children];
      const uniqueIds = new Set(allChildren.map(c => c.id));
      uniqueIds.forEach(id => {
        const localChild = localData.children.find(c => c.id === id) || {};
        const remoteChild = remoteData.children.find(c => c.id === id) || {};
        merged.children.push({
          ...localChild,
          ...remoteChild,
          milkIntake: [...(localChild.milkIntake || []), ...(remoteChild.milkIntake || [])],
          diaperChanges: [...(localChild.diaperChanges || []), ...(remoteChild.diaperChanges || [])]
        });
      });
      return merged;
    };

    // Navigation
    const toggleSidebar = () => {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    };

    const toggleMenu = () => {
      const menu = document.getElementById('menu');
      const settings = document.getElementById('settings');
      menu.classList.toggle('hidden');
      if (!menu.classList.contains('hidden')) {
        menu.style.transform = 'translateX(0)';
        settings.classList.add('hidden');
      } else {
        menu.style.transform = 'translateX(100%)';
      }
    };

    const toggleSettings = () => {
      const settings = document.getElementById('settings');
      const menu = document.getElementById('menu');
      settings.classList.toggle('hidden');
      if (!settings.classList.contains('hidden')) {
        document.getElementById('milk-interval').value = settings.milkInterval;
        document.getElementById('notify-enable').checked = settings.notifications;
        menu.classList.add('hidden');
      }
    };

    addTouchAndClick(document.getElementById('sidebar-close'), toggleSidebar);
    addTouchAndClick(document.getElementById('menu-toggle'), toggleMenu);
    addTouchAndClick(document.getElementById('menu-close'), toggleMenu);
    addTouchAndClick(document.getElementById('settings-toggle'), toggleSettings);
    addTouchAndClick(document.getElementById('settings-close'), toggleSettings);

    addTouchAndClick(document.getElementById('save-settings'), () => {
      settings.milkInterval = parseInt(document.getElementById('milk-interval').value) || 3;
      settings.notifications = document.getElementById('notify-enable').checked;
      localStorage.setItem('milkInterval', settings.milkInterval);
      localStorage.setItem('notifications', settings.notifications);
      if (settings.notifications) requestNotifications();
      toggleSettings();
      scheduleAllReminders();
      renderDashboard();
    });

    // Notifications
    const requestNotifications = () => {
      if (!("Notification" in window)) {
        alert("Notifications not supported.");
        settings.notifications = false;
        localStorage.setItem('notifications', false);
      } else if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission().then(perm => {
          if (perm !== "granted") {
            settings.notifications = false;
            localStorage.setItem('notifications', false);
          }
        });
      }
    };

    const notifyFeedingTime = (child) => {
      if (settings.notifications && Notification.permission === "granted") {
        new Notification(`Feeding Time for ${child.name}!`, {
          body: `It's time for ${child.name}'s next feeding!`,
          icon: 'https://via.placeholder.com/32?text=🍼'
        });
      }
    };

    const scheduleReminder = (child) => {
      if (!settings.notifications || Notification.permission !== "granted") return;
      const last = child.milkIntake[child.milkIntake.length - 1];
      if (!last) return;
      const nextTime = new Date(new Date(last.timestamp).getTime() + settings.milkInterval * 60 * 60 * 1000);
      const delay = nextTime - new Date();
      if (delay > 0) {
        setTimeout(() => {
          notifyFeedingTime(child);
          renderDashboard();
        }, delay);
      }
    };

    const scheduleAllReminders = () => {
      if (settings.notifications && Notification.permission === "granted") {
        appData.children.forEach(scheduleReminder);
      }
    };

    // Random Tips
    const showRandomTip = () => {
      const tipBox = document.getElementById('tip-box');
      if (!tipBox) return;
      tipBox.classList.remove('hidden');
      tipBox.textContent = tips[Math.floor(Math.random() * tips.length)];
      setTimeout(() => tipBox.classList.add('hidden'), 5000);
      setTimeout(showRandomTip, 30000);
    };

    // Initialization
    initDB().then(() => {
      loadData().then(() => {
        updateUI();
        if (settings.notifications) requestNotifications();
        scheduleAllReminders();
      });
    }).catch(err => console.error("DB Error:", err));
  </script>
</body>
</html>
