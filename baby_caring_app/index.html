<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Baby Caring App</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Neue', cursive;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec, #fff9c4);
    }
    .slide-in { transition: transform 0.3s ease-in-out; }
    .slide-in.hidden { transform: translateX(-100%); }
    .slide-menu { transition: transform 0.3s ease-in-out; }
    .slide-menu.hidden { transform: translateX(100%); }
    .btn-svg { transition: transform 0.2s; }
    .btn-svg:hover { transform: scale(1.1); }
    .shadow-soft { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
    .rounded-3xl { border-radius: 1.5rem; }
    .btn-primary { background: linear-gradient(90deg, #60a5fa, #a78bfa); }
    @media (max-width: 640px) {
      .safe-area { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    }
  </style>
</head>
<body class="min-h-screen safe-area">
  <div class="flex flex-col md:flex-row">
    <!-- Sidebar -->
    <div id="sidebar" class="w-full md:w-1/4 bg-white p-6 shadow-soft slide-in md:slide-in fixed md:static h-full z-10 rounded-r-3xl">
      <div class="flex justify-between items-center mb-6">
        <h1 id="app-title" class="text-3xl font-bold text-blue-600">Baby Caring</h1>
        <div class="flex space-x-4">
          <button id="open-menu" class="text-gray-600 focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          </button>
          <button id="close-sidebar" class="md:hidden text-gray-600 focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
      <h2 id="children-title" class="text-xl font-semibold text-blue-600 mb-3">Children</h2>
      <ul id="child-list" class="mb-6 space-y-3"></ul>
      <button id="add-child-btn" class="w-full flex justify-center items-center p-3 btn-primary text-white rounded-full shadow-soft" title="Add Child">
        <svg class="w-6 h-6 btn-svg" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      </button>
      <!-- Sliding Menu -->
      <div id="sliding-menu" class="slide-menu hidden fixed top-0 right-0 w-3/4 md:w-1/4 h-full bg-white p-6 shadow-soft z-20 rounded-l-3xl">
        <div class="flex justify-end mb-6">
          <button id="close-menu" class="text-gray-600 focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="space-y-4">
          <button id="export-btn" class="w-full flex justify-center items-center p-3 bg-blue-400 rounded-full hover:bg-blue-500 text-white" title="Export Data">
            <svg class="w-6 h-6 btn-svg" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 4v12m-4-4l4 4m4-4l-4 4"></path></svg>
          </button>
          <input type="file" id="import-input" class="hidden" accept=".json">
          <button id="import-btn" class="w-full flex justify-center items-center p-3 bg-green-400 rounded-full hover:bg-green-500 text-white" title="Import Data">
            <svg class="w-6 h-6 btn-svg" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V6a2 2 0 012-2h12a2 2 0 012 2v2m-8 12V8m4 4l-4-4m-4 4l4-4"></path></svg>
          </button>
          <button id="share-btn" class="w-full flex justify-center items-center p-3 bg-yellow-400 rounded-full hover:bg-yellow-500 text-white" title="Share Data">
            <svg class="w-6 h-6 btn-svg" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
          </button>
          <button id="toggle-lang-btn" class="w-full flex justify-center items-center p-3 bg-gray-400 rounded-full hover:bg-gray-500 text-white" title="Switch to French">
            <svg class="w-6 h-6 btn-svg" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h18M3 19h18M12 5v14m-7-7h14"></path></svg>
          </button>
          <button id="settings-btn" class="w-full flex justify-center items-center p-3 bg-purple-400 rounded-full hover:bg-purple-500 text-white" title="Settings">
            <svg class="w-6 h-6 btn-svg" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </button>
        </div>
      </div>
      <!-- Settings Menu (unchanged) -->
      <div id="settings-menu" class="slide-menu hidden fixed top-0 right-0 w-3/4 md:w-1/4 h-full bg-white p-6 shadow-soft z-20 rounded-l-3xl">
        <div class="flex justify-end mb-6">
          <button id="close-settings" class="text-gray-600 focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <h3 class="text-xl font-semibold text-blue-600 mb-4">Settings</h3>
        <div class="space-y-4">
          <label class="block text-blue-600">Milk Reminder Interval (hours):</label>
          <input type="number" id="milk-interval" min="1" max="24" class="w-full p-3 border border-blue-200 rounded-lg bg-blue-50" value="3">
          <label class="block text-blue-600">Enable Notifications:</label>
          <input type="checkbox" id="notifications-enabled" class="h-5 w-5 text-blue-600">
          <button id="save-settings" class="w-full p-3 btn-primary text-white rounded-full shadow-soft">Save</button>
        </div>
      </div>
    </div>
    <!-- Main Area (unchanged) -->
    <div class="w-full md:w-3/4 p-6 md:ml-0">
      <div class="flex justify-between items-center mb-6">
        <h2 id="current-child-name" class="text-2xl font-bold text-blue-600">Select a child</h2>
        <button id="open-sidebar" class="md:hidden text-gray-600 focus:outline-none">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
      </div>
      <div class="mb-8 bg-white p-6 rounded-3xl shadow-soft">
        <h3 id="milk-title" class="text-xl font-semibold text-blue-600 mb-3">Milk Intake</h3>
        <form id="milk-form" class="mb-4 space-y-3 md:space-y-0 md:flex md:space-x-3">
          <input type="datetime-local" id="milk-time" class="w-full md:w-auto p-3 border border-blue-200 rounded-lg bg-blue-50">
          <input type="number" id="milk-amount" placeholder="Amount (ml)" min="0" class="w-full md:w-auto p-3 border border-blue-200 rounded-lg bg-blue-50">
          <button type="submit" id="milk-add-btn" class="w-full md:w-auto flex justify-center items-center p-3 btn-primary text-white rounded-full shadow-soft" title="Add">
            <svg class="w-6 h-6 btn-svg" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </form>
        <ul id="milk-list" class="list-disc pl-5 space-y-2"></ul>
      </div>
      <div class="bg-white p-6 rounded-3xl shadow-soft">
        <h3 id="diaper-title" class="text-xl font-semibold text-blue-600 mb-3">Diaper Changes</h3>
        <form id="diaper-form" class="mb-4 space-y-3 md:space-y-0 md:flex md:space-x-3">
          <input type="datetime-local" id="diaper-time" class="w-full md:w-auto p-3 border border-blue-200 rounded-lg bg-blue-50">
          <select id="diaper-type" class="w-full md:w-auto p-3 border border-blue-200 rounded-lg bg-blue-50">
            <option value="wet">Wet</option>
            <option value="dirty">Dirty</option>
            <option value="both">Both</option>
          </select>
          <button type="submit" id="diaper-add-btn" class="w-full md:w-auto flex justify-center items-center p-3 btn-primary text-white rounded-full shadow-soft" title="Add">
            <svg class="w-6 h-6 btn-svg" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </form>
        <ul id="diaper-list" class="list-disc pl-5 space-y-2"></ul>
      </div>
    </div>
  </div>

  <script>
    // Localization dictionary (unchanged for brevity)
    const translations = {
      en: {
        appTitle: "Baby Caring",
        exportBtn: "Export Data",
        importBtn: "Import Data",
        shareBtn: "Share Data",
        toggleLangBtn: "Switch to French",
        childrenTitle: "Children",
        addChildBtn: "Add Child",
        selectChild: "Select a child",
        milkTitle: "Milk Intake",
        milkAmountPlaceholder: "Amount (ml)",
        milkAddBtn: "Add",
        diaperTitle: "Diaper Changes",
        diaperWet: "Wet",
        diaperDirty: "Dirty",
        diaperBoth: "Both",
        diaperAddBtn: "Add",
        addChildPrompt: "Enter child's name:",
        selectChildAlert: "Please select a child first.",
        milkValidationAlert: "Please fill in valid time and amount.",
        diaperValidationAlert: "Please fill in a valid time.",
        importSuccessAlert: "Data imported successfully.",
        importFormatAlert: "Invalid data format.",
        importErrorAlert: "Error parsing JSON: ",
        deleteChildConfirm: "Are you sure you want to delete this child?",
        shareSuccess: "Data copied to clipboard! Paste it anywhere or use the email link.",
        shareError: "Sharing not supported. Data copied to clipboard instead."
      },
      fr: { /* ... */ }
    };

    // Initialize data and settings
    let data = { nextId: 1, children: [] };
    let currentChildId = null;
    let currentLang = localStorage.getItem('babyCaringLang') || 'en';
    let settings = {
      milkInterval: parseInt(localStorage.getItem('milkInterval')) || 3,
      notificationsEnabled: localStorage.getItem('notificationsEnabled') === 'true' || false
    };

    // IndexedDB setup
    const dbName = "BabyCaringDB";
    const dbVersion = 1;
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, dbVersion);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve();
        };
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          db.createObjectStore("data", { keyPath: "id" });
        };
      });
    }

    function loadData() {
      return new Promise((resolve) => {
        const transaction = db.transaction(["data"], "readonly");
        const store = transaction.objectStore("data");
        const request = store.get("babyData");
        request.onsuccess = () => {
          if (request.result) data = request.result.value;
          resolve();
        };
        request.onerror = () => resolve(); // Fallback to default data if none exists
      });
    }

    function saveData() {
      const transaction = db.transaction(["data"], "readwrite");
      const store = transaction.objectStore("data");
      store.put({ id: "babyData", value: data });
    }

    // Update UI with current language
    function updateLanguage() {
      const t = translations[currentLang];
      document.getElementById('app-title').textContent = t.appTitle;
      document.getElementById('export-btn').title = t.exportBtn;
      document.getElementById('import-btn').title = t.importBtn;
      document.getElementById('share-btn').title = t.shareBtn;
      document.getElementById('toggle-lang-btn').title = t.toggleLangBtn;
      document.getElementById('children-title').textContent = t.childrenTitle;
      document.getElementById('add-child-btn').title = t.addChildBtn;
      document.getElementById('current-child-name').textContent = currentChildId ? data.children.find(c => c.id === currentChildId).name : t.selectChild;
      document.getElementById('milk-title').textContent = t.milkTitle;
      document.getElementById('milk-amount').placeholder = t.milkAmountPlaceholder;
      document.getElementById('milk-add-btn').title = t.milkAddBtn;
      document.getElementById('diaper-title').textContent = t.diaperTitle;
      const diaperType = document.getElementById('diaper-type');
      diaperType.options[0].text = t.diaperWet;
      diaperType.options[1].text = t.diaperDirty;
      diaperType.options[2].text = t.diaperBoth;
      document.getElementById('diaper-add-btn').title = t.diaperAddBtn;
      renderChildList();
      renderMilkIntake();
      renderDiaperChanges();
    }

    // Toggle language (unchanged)
    document.getElementById('toggle-lang-btn').addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'fr' : 'en';
      localStorage.setItem('babyCaringLang', currentLang);
      updateLanguage();
      toggleMenu();
    });

    // Render functions (unchanged for brevity)
    function renderChildList() { /* ... */ }
    function selectChild(id) { /* ... */ }
    function deleteChild(id) { /* ... */ }
    function renderMilkIntake() { /* ... */ }
    function deleteMilkIntake(index) { /* ... */ }
    function renderDiaperChanges() { /* ... */ }
    function deleteDiaperChange(index) { /* ... */ }

    // Add a new child
    document.getElementById('add-child-btn').addEventListener('click', () => {
      const name = prompt(translations[currentLang].addChildPrompt);
      if (name) {
        const id = 'child' + data.nextId++;
        data.children.push({ id, name, milkIntake: [], diaperChanges: [] });
        saveData();
        renderChildList();
      }
    });

    // Handle milk intake form submission
    document.getElementById('milk-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentChildId) return alert(translations[currentLang].selectChildAlert);
      const time = document.getElementById('milk-time').value;
      const amount = document.getElementById('milk-amount').value;
      if (!time || !amount || amount <= 0) return alert(translations[currentLang].milkValidationAlert);
      const child = data.children.find(c => c.id === currentChildId);
      child.milkIntake.push({ timestamp: new Date(time).toISOString(), amount: parseInt(amount) });
      saveData();
      renderMilkIntake();
      scheduleMilkReminder(child);
      document.getElementById('milk-time').value = '';
      document.getElementById('milk-amount').value = '';
    });

    // Handle diaper change form submission (unchanged)
    document.getElementById('diaper-form').addEventListener('submit', (e) => { /* ... */ });

    // Export data as Markdown
    document.getElementById('export-btn').addEventListener('click', (e) => {
      e.preventDefault();
      let markdown = "# Baby Caring Data\n\n";
      data.children.forEach(child => {
        markdown += `## ${child.name}\n\n`;
        markdown += "### Milk Intake\n";
        child.milkIntake.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        child.milkIntake.forEach(intake => {
          markdown += `- ${new Date(intake.timestamp).toLocaleString()} - ${intake.amount} ml\n`;
        });
        markdown += "\n### Diaper Changes\n";
        child.diaperChanges.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        child.diaperChanges.forEach(change => {
          markdown += `- ${new Date(change.timestamp).toLocaleString()} - ${change.type}\n`;
        });
        markdown += "\n";
      });
      const blob = new Blob([markdown], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'baby_caring_data.md';
      a.click();
      URL.revokeObjectURL(url);
      toggleMenu();
    });

    // Share data
    document.getElementById('share-btn').addEventListener('click', (e) => {
      e.preventDefault();
      let markdown = "# Baby Caring Data\n\n";
      data.children.forEach(child => {
        markdown += `## ${child.name}\n\n### Milk Intake\n`;
        child.milkIntake.forEach(intake => {
          markdown += `- ${new Date(intake.timestamp).toLocaleString()} - ${intake.amount} ml\n`;
        });
        markdown += "\n### Diaper Changes\n";
        child.diaperChanges.forEach(change => {
          markdown += `- ${new Date(change.timestamp).toLocaleString()} - ${change.type}\n`;
        });
        markdown += "\n";
      });
      
      if (navigator.share) {
        navigator.share({
          title: 'Baby Caring Data',
          text: markdown,
        }).then(() => console.log('Shared successfully'))
          .catch((error) => {
            console.error('Error sharing:', error);
            fallback
