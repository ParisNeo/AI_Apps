<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Caring App</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* Custom animations */
    .slide-in {
      transition: transform 0.3s ease-in-out;
    }
    .slide-in.hidden {
      transform: translateX(-100%);
    }
    .fade-in {
      transition: opacity 0.3s ease-in-out;
    }
    .fade-in.hidden {
      opacity: 0;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen">
  <div class="flex flex-col md:flex-row">
    <!-- Sidebar -->
    <div id="sidebar" class="w-full md:w-1/4 bg-white p-4 shadow-lg slide-in md:slide-in fixed md:static h-full z-10">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl font-bold text-gray-800">Baby Caring</h1>
        <button id="close-sidebar" class="md:hidden text-gray-600 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <button id="export-btn" class="w-full mb-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Export Data</button>
      <input type="file" id="import-input" class="hidden" accept=".json">
      <button id="import-btn" class="w-full mb-4 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Import Data</button>
      <h2 class="text-xl font-semibold text-gray-700 mb-2">Children</h2>
      <ul id="child-list" class="mb-4 space-y-2"></ul>
      <button id="add-child-btn" class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">Add Child</button>
    </div>
    <!-- Main Area -->
    <div class="w-full md:w-3/4 p-4 md:ml-0">
      <div class="flex justify-between items-center mb-4">
        <h2 id="current-child-name" class="text-2xl font-bold text-gray-800">Select a child</h2>
        <button id="open-sidebar" class="md:hidden text-gray-600 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
      </div>
      <!-- Milk Intake Section -->
      <div class="mb-8 bg-white p-4 rounded-lg shadow">
        <h3 class="text-xl font-semibold text-gray-700 mb-2">Milk Intake</h3>
        <form id="milk-form" class="mb-4 space-y-2 md:space-y-0 md:flex md:space-x-2">
          <input type="datetime-local" id="milk-time" class="w-full md:w-auto p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          <input type="number" id="milk-amount" placeholder="Amount (ml)" min="0" class="w-full md:w-auto p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          <button type="submit" class="w-full md:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Add</button>
        </form>
        <ul id="milk-list" class="list-disc pl-5 space-y-1"></ul>
      </div>
      <!-- Diaper Change Section -->
      <div class="bg-white p-4 rounded-lg shadow">
        <h3 class="text-xl font-semibold text-gray-700 mb-2">Diaper Changes</h3>
        <form id="diaper-form" class="mb-4 space-y-2 md:space-y-0 md:flex md:space-x-2">
          <input type="datetime-local" id="diaper-time" class="w-full md:w-auto p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          <select id="diaper-type" class="w-full md:w-auto p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            <option value="wet">Wet</option>
            <option value="dirty">Dirty</option>
            <option value="both">Both</option>
          </select>
          <button type="submit" class="w-full md:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Add</button>
        </form>
        <ul id="diaper-list" class="list-disc pl-5 space-y-1"></ul>
      </div>
    </div>
  </div>

  <script>
    // Initialize data structure and current child selection
    let data = { nextId: 1, children: [] };
    let currentChildId = null;

    // Load data from local storage
    function loadData() {
      const savedData = localStorage.getItem('babyCaringData');
      if (savedData) data = JSON.parse(savedData);
    }

    // Save data to local storage
    function saveData() {
      localStorage.setItem('babyCaringData', JSON.stringify(data));
    }

    // Render the list of children in the sidebar
    function renderChildList() {
      const childList = document.getElementById('child-list');
      childList.innerHTML = '';
      data.children.forEach(child => {
        const li = document.createElement('li');
        li.classList.add('flex', 'justify-between', 'items-center', 'p-2', 'bg-gray-100', 'rounded-lg', 'cursor-pointer', 'hover:bg-gray-200');
        li.innerHTML = `
          <span onclick="selectChild('${child.id}')">${child.name}</span>
          <button onclick="deleteChild('${child.id}')" class="text-red-500 hover:text-red-700">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        `;
        childList.appendChild(li);
      });
    }

    // Select a child and update the main area
    function selectChild(id) {
      currentChildId = id;
      const child = data.children.find(c => c.id === id);
      document.getElementById('current-child-name').textContent = child.name;
      renderMilkIntake();
      renderDiaperChanges();
      toggleSidebar(); // Close sidebar on mobile after selection
    }

    // Delete a child
    function deleteChild(id) {
      if (confirm('Are you sure you want to delete this child?')) {
        data.children = data.children.filter(c => c.id !== id);
        if (currentChildId === id) {
          currentChildId = null;
          document.getElementById('current-child-name').textContent = 'Select a child';
        }
        saveData();
        renderChildList();
        renderMilkIntake();
        renderDiaperChanges();
      }
    }

    // Render milk intake history
    function renderMilkIntake() {
      const milkList = document.getElementById('milk-list');
      milkList.innerHTML = '';
      if (currentChildId) {
        const child = data.children.find(c => c.id === currentChildId);
        child.milkIntake.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        child.milkIntake.forEach((intake, index) => {
          const li = document.createElement('li');
          li.classList.add('flex', 'justify-between', 'items-center');
          li.innerHTML = `
            ${new Date(intake.timestamp).toLocaleString()} - ${intake.amount} ml
            <button onclick="deleteMilkIntake(${index})" class="text-red-500 hover:text-red-700">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          `;
          milkList.appendChild(li);
        });
      }
    }

    // Delete milk intake entry
    function deleteMilkIntake(index) {
      const child = data.children.find(c => c.id === currentChildId);
      child.milkIntake.splice(index, 1);
      saveData();
      renderMilkIntake();
    }

    // Render diaper change history
    function renderDiaperChanges() {
      const diaperList = document.getElementById('diaper-list');
      diaperList.innerHTML = '';
      if (currentChildId) {
        const child = data.children.find(c => c.id === currentChildId);
        child.diaperChanges.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        child.diaperChanges.forEach((change, index) => {
          const li = document.createElement('li');
          li.classList.add('flex', 'justify-between', 'items-center');
          li.innerHTML = `
            ${new Date(change.timestamp).toLocaleString()} - ${change.type}
            <button onclick="deleteDiaperChange(${index})" class="text-red-500 hover:text-red-700">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          `;
          diaperList.appendChild(li);
        });
      }
    }

    // Delete diaper change entry
    function deleteDiaperChange(index) {
      const child = data.children.find(c => c.id === currentChildId);
      child.diaperChanges.splice(index, 1);
      saveData();
      renderDiaperChanges();
    }

    // Add a new child
    document.getElementById('add-child-btn').addEventListener('click', () => {
      const name = prompt('Enter child\'s name:');
      if (name) {
        const id = 'child' + data.nextId++;
        data.children.push({ id, name, milkIntake: [], diaperChanges: [] });
        saveData();
        renderChildList();
      }
    });

    // Handle milk intake form submission
    document.getElementById('milk-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentChildId) return alert('Please select a child first.');
      const time = document.getElementById('milk-time').value;
      const amount = document.getElementById('milk-amount').value;
      if (!time || !amount || amount <= 0) return alert('Please fill in valid time and amount.');
      const child = data.children.find(c => c.id === currentChildId);
      child.milkIntake.push({ timestamp: new Date(time).toISOString(), amount: parseInt(amount) });
      saveData();
      renderMilkIntake();
      document.getElementById('milk-time').value = '';
      document.getElementById('milk-amount').value = '';
    });

    // Handle diaper change form submission
    document.getElementById('diaper-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentChildId) return alert('Please select a child first.');
      const time = document.getElementById('diaper-time').value;
      const type = document.getElementById('diaper-type').value;
      if (!time) return alert('Please fill in a valid time.');
      const child = data.children.find(c => c.id === currentChildId);
      child.diaperChanges.push({ timestamp: new Date(time).toISOString(), type });
      saveData();
      renderDiaperChanges();
      document.getElementById('diaper-time').value = '';
    });

    // Export data to JSON file
    document.getElementById('export-btn').addEventListener('click', () => {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'baby_caring_data.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Trigger file input for import
    document.getElementById('import-btn').addEventListener('click', () => {
      document.getElementById('import-input').click();
    });

    // Handle data import from JSON file
    document.getElementById('import-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedData = JSON.parse(event.target.result);
            if (importedData.nextId && Array.isArray(importedData.children)) {
              data = importedData;
              saveData();
              renderChildList();
              currentChildId = null;
              document.getElementById('current-child-name').textContent = 'Select a child';
              renderMilkIntake();
              renderDiaperChanges();
              alert('Data imported successfully.');
            } else {
              alert('Invalid data format.');
            }
          } catch (error) {
            alert('Error parsing JSON: ' + error.message);
          }
        };
        reader.readAsText(file);
      }
    });

    // Sidebar toggle for mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    }

    document.getElementById('open-sidebar').addEventListener('click', toggleSidebar);
    document.getElementById('close-sidebar').addEventListener('click', toggleSidebar);

    // Initialize the app
    loadData();
    renderChildList();
  </script>
</body>
</html>
