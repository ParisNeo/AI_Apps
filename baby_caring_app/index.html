<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Care Hub 🍼</title>
    <style>
        :root {
            --primary-color: #63b3ed; /* Light Blue */
            --secondary-color: #f6e05e; /* Soft Yellow */
            --accent-color: #68d391; /* Soft Green */
            --text-color: #2d3748; /* Dark Gray */
            --bg-color: #f7fafc; /* Light Gray */
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --danger-color: #f56565; /* Red for alerts/deletions */
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h1, h2, h3 {
            color: var(--primary-color);
            text-align: center;
        }
        h1 { font-size: 2.2em; margin-bottom: 20px; }
        h2 { font-size: 1.8em; margin-top: 30px; margin-bottom: 15px; border-bottom: 2px solid var(--secondary-color); padding-bottom: 5px;}
        h3 { font-size: 1.4em; margin-top: 20px; margin-bottom: 10px; color: var(--accent-color); }


        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            margin: 5px;
        }

        button:hover {
            background-color: #4299e1; /* Darker Blue */
        }

        button.secondary {
            background-color: var(--secondary-color);
            color: var(--text-color);
        }
        button.secondary:hover {
            background-color: #f6d02e; /* Darker Yellow */
        }
        button.danger {
            background-color: var(--danger-color);
        }
        button.danger:hover {
            background-color: #e53e3e; /* Darker Red */
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        input[type="url"],
        select,
        textarea {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .baby-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        .baby-selector label { display: inline-block; margin-right: 10px; }

        .baby-profile, .add-baby-form, .log-entry-form {
            background-color: #fdfdff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .profile-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
            object-fit: cover;
            border: 3px solid var(--secondary-color);
        }

        .event-log {
            list-style: none;
            padding: 0;
        }
        .event-log li {
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 5px solid var(--accent-color);
            font-size: 0.95em;
        }
        .event-log li strong { color: var(--primary-color); }

        .hidden {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: var(--card-bg);
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .close-button {
            color: var(--text-color);
            float: right;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 20px;
        }
        .close-button:hover,
        .close-button:focus {
            color: var(--danger-color);
            text-decoration: none;
            cursor: pointer;
        }
        .notification-status {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .notification-granted { background-color: #c6f6d5; color: #2f855a; } /* Green */
        .notification-denied { background-color: #fed7d7; color: #c53030; } /* Red */
        .notification-default { background-color: #feebc8; color: #975a16; } /* Yellow */

        .summary-item {
            background: #e9f5ff;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 8px;
        }
        .summary-item strong { color: var(--primary-color); }

        .baby-actions button {
            width: calc(33% - 10px); /* Adjust for margins */
            margin: 5px;
        }
        .baby-actions {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .timer-display {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            margin: 10px 0;
        }
    </style>
    <!-- Using simple emoji for icons to avoid external library for this single file constraint -->
</head>
<body>
    <div class="container">
        <h1>Baby Care Hub 🍼</h1>

        <div id="notificationStatus" class="notification-status">Checking notification permissions...</div>

        <div class="baby-selector">
            <label for="babySelect">Select Baby:</label>
            <select id="babySelect"></select>
            <button onclick="showAddBabyForm()">➕ Add New Baby</button>
            <button class="danger" onclick="deleteCurrentBaby()">🗑️ Delete Current Baby</button>
        </div>

        <div id="addBabyForm" class="add-baby-form hidden">
            <h2>Add New Baby Profile</h2>
            <label for="babyName">Name:</label>
            <input type="text" id="babyName" placeholder="e.g., Baby A">
            <label for="babyDob">Date of Birth:</label>
            <input type="date" id="babyDob">
            <label for="babyPhoto">Photo URL (optional):</label>
            <input type="url" id="babyPhoto" placeholder="https://example.com/baby.jpg">
            <button onclick="addBaby()">Save Baby Profile</button>
            <button class="secondary" onclick="hideAddBabyForm()">Cancel</button>
        </div>

        <div id="babyProfile" class="baby-profile hidden">
            <div class="profile-header">
                <img id="profilePhoto" src="https://via.placeholder.com/80?text=Baby" alt="Baby Photo">
                <div>
                    <h2 id="profileName"></h2>
                    <p id="profileDob"></p>
                    <p id="profileAge"></p>
                </div>
            </div>

            <h3>Quick Actions</h3>
            <div class="baby-actions">
                <button onclick="showLogModal('milk')">🥛 Log Milk</button>
                <button onclick="showLogModal('diaper')">👶 Log Diaper</button>
                <button onclick="showLogModal('sleep')">😴 Log Sleep</button>
            </div>
            <button onclick="showLogModal('note')" class="secondary" style="width: calc(100% - 10px); margin-top:10px;">📝 Add Note</button>


            <h3>Summary</h3>
            <div id="babySummary">
                <p class="summary-item"><strong>Last Milk:</strong> <span id="lastMilk">N/A</span></p>
                <p class="summary-item"><strong>Last Diaper:</strong> <span id="lastDiaper">N/A</span> (<span id="nextDiaperCheck">Schedule: N/A</span>)</p>
                <p class="summary-item"><strong>Last Sleep:</strong> <span id="lastSleep">N/A</span></p>
            </div>

            <div id="breastfeedingTimerSection" class="hidden">
                <h3>🤱 Breastfeeding Timer</h3>
                <div class="timer-display" id="timerDisplay">00:00:00</div>
                <button id="startTimerBtn" onclick="startTimer()">Start Timer</button>
                <button id="pauseTimerBtn" onclick="pauseTimer()" class="hidden">Pause Timer</button>
                <button id="resetTimerBtn" onclick="resetTimer()" class="secondary">Reset Timer</button>
                <button id="logTimerBtn" onclick="logTimerAsMilk()" class="accent hidden">Log as Milk Intake</button>
            </div>


            <h3>Event Log</h3>
            <ul id="eventLog" class="event-log">
                <!-- Events will be populated here -->
            </ul>
        </div>

        <div id="noBabiesMessage" style="text-align:center; padding: 20px; background-color: var(--secondary-color); border-radius: 8px;">
            <h2>Welcome!</h2>
            <p>No babies added yet. Click "Add New Baby" to get started.</p>
        </div>
    </div>

    <!-- Generic Modal for Logging -->
    <div id="logModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeLogModal()">×</span>
            <h2 id="modalTitle">Log Entry</h2>
            <form id="logEntryForm">
                <!-- Dynamic fields will be inserted here by JS -->
                <div id="modalFields"></div>
                <button type="button" onclick="saveLogEntry()">Save Entry</button>
            </form>
        </div>
    </div>


    <script>
        let babies = [];
        let events = [];
        let currentBabyId = null;
        let notificationPermission = 'default';
        let diaperCheckIntervalId = null;

        // Timer variables
        let timerInterval = null;
        let timerSeconds = 0;
        let timerRunning = false;

        const DB_NAME = 'babyCareAppDB';

        // DOM Elements
        const babySelect = document.getElementById('babySelect');
        const addBabyForm = document.getElementById('addBabyForm');
        const babyProfileDiv = document.getElementById('babyProfile');
        const noBabiesMessage = document.getElementById('noBabiesMessage');
        const eventLogUl = document.getElementById('eventLog');
        const profileNameH2 = document.getElementById('profileName');
        const profileDobP = document.getElementById('profileDob');
        const profileAgeP = document.getElementById('profileAge');
        const profilePhotoImg = document.getElementById('profilePhoto');

        const lastMilkSpan = document.getElementById('lastMilk');
        const lastDiaperSpan = document.getElementById('lastDiaper');
        const nextDiaperCheckSpan = document.getElementById('nextDiaperCheck');
        const lastSleepSpan = document.getElementById('lastSleep');

        const logModal = document.getElementById('logModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalFields = document.getElementById('modalFields');
        let currentLogType = '';

        // Timer DOM Elements
        const timerDisplay = document.getElementById('timerDisplay');
        const startTimerBtn = document.getElementById('startTimerBtn');
        const pauseTimerBtn = document.getElementById('pauseTimerBtn');
        const resetTimerBtn = document.getElementById('resetTimerBtn');
        const logTimerBtn = document.getElementById('logTimerBtn');
        const breastfeedingTimerSection = document.getElementById('breastfeedingTimerSection');


        // --- Initialization ---
        window.onload = () => {
            loadData();
            updateBabySelect();
            if (babies.length > 0) {
                currentBabyId = babies[0].id;
                babySelect.value = currentBabyId;
                displayBabyProfile(currentBabyId);
                noBabiesMessage.classList.add('hidden');
            } else {
                babyProfileDiv.classList.add('hidden');
                noBabiesMessage.classList.remove('hidden');
            }
            setupNotificationPermission();
            startDiaperCheckScheduler();
        };

        // --- Data Persistence (localStorage) ---
        function saveData() {
            const dataToSave = {
                babies: babies,
                events: events,
                currentBabyId: currentBabyId // Save last selected baby
            };
            localStorage.setItem(DB_NAME, JSON.stringify(dataToSave));
        }

        function loadData() {
            const data = localStorage.getItem(DB_NAME);
            if (data) {
                const parsedData = JSON.parse(data);
                babies = parsedData.babies || [];
                events = parsedData.events || [];
                currentBabyId = parsedData.currentBabyId || (babies.length > 0 ? babies[0].id : null);
            }
        }

        // --- Baby Management ---
        function showAddBabyForm() {
            addBabyForm.classList.remove('hidden');
            document.getElementById('babyName').value = '';
            document.getElementById('babyDob').value = '';
            document.getElementById('babyPhoto').value = '';
        }

        function hideAddBabyForm() {
            addBabyForm.classList.add('hidden');
        }

        function addBaby() {
            const name = document.getElementById('babyName').value.trim();
            const dob = document.getElementById('babyDob').value;
            let photo = document.getElementById('babyPhoto').value.trim();

            if (!name || !dob) {
                alert('Please enter baby name and date of birth.');
                return;
            }
            if (!photo) {
                photo = `https://via.placeholder.com/80?text=${name.charAt(0)}`;
            }

            const newBaby = {
                id: 'baby_' + Date.now(),
                name: name,
                dob: dob,
                photo: photo,
                nextDiaperCheck: null
            };
            babies.push(newBaby);
            saveData();
            updateBabySelect();
            babySelect.value = newBaby.id; // Select the new baby
            currentBabyId = newBaby.id;
            displayBabyProfile(newBaby.id);
            hideAddBabyForm();
            noBabiesMessage.classList.add('hidden');
            alert(`Baby ${name} added successfully!`);
        }

        function deleteCurrentBaby() {
            if (!currentBabyId) {
                alert("No baby selected to delete.");
                return;
            }
            const babyToDelete = babies.find(b => b.id === currentBabyId);
            if (!babyToDelete) return;

            if (confirm(`Are you sure you want to delete ${babyToDelete.name} and all their data? This cannot be undone.`)) {
                babies = babies.filter(baby => baby.id !== currentBabyId);
                events = events.filter(event => event.babyId !== currentBabyId); // Also delete associated events
                
                if (babies.length > 0) {
                    currentBabyId = babies[0].id;
                } else {
                    currentBabyId = null;
                }
                
                saveData();
                updateBabySelect();

                if (currentBabyId) {
                    displayBabyProfile(currentBabyId);
                } else {
                    babyProfileDiv.classList.add('hidden');
                    noBabiesMessage.classList.remove('hidden');
                }
                alert(`${babyToDelete.name} has been deleted.`);
            }
        }

        function updateBabySelect() {
            babySelect.innerHTML = '';
            if (babies.length === 0) {
                const option = document.createElement('option');
                option.textContent = 'No babies yet';
                option.disabled = true;
                babySelect.appendChild(option);
                document.querySelector('.baby-selector button.danger').classList.add('hidden'); // Hide delete button
                return;
            }
             document.querySelector('.baby-selector button.danger').classList.remove('hidden');


            babies.forEach(baby => {
                const option = document.createElement('option');
                option.value = baby.id;
                option.textContent = baby.name;
                babySelect.appendChild(option);
            });
            if (currentBabyId) {
                babySelect.value = currentBabyId;
            }
        }

        babySelect.addEventListener('change', (e) => {
            currentBabyId = e.target.value;
            saveData(); // Save the new currentBabyId
            displayBabyProfile(currentBabyId);
            resetTimer(); // Reset timer when switching babies
        });

        function displayBabyProfile(babyId) {
            const baby = babies.find(b => b.id === babyId);
            if (!baby) {
                babyProfileDiv.classList.add('hidden');
                noBabiesMessage.classList.remove('hidden');
                return;
            }

            babyProfileDiv.classList.remove('hidden');
            noBabiesMessage.classList.add('hidden');

            profileNameH2.textContent = baby.name;
            profileDobP.textContent = `DOB: ${new Date(baby.dob).toLocaleDateString()}`;
            profileAgeP.textContent = `Age: ${calculateAge(baby.dob)}`;
            profilePhotoImg.src = baby.photo || `https://via.placeholder.com/80?text=${baby.name.charAt(0)}`;
            profilePhotoImg.alt = `${baby.name}'s photo`;
            
            breastfeedingTimerSection.classList.remove('hidden'); // Show timer section for selected baby

            renderEventLog(babyId);
            updateSummary(babyId);
        }

        function calculateAge(dobString) {
            const dob = new Date(dobString);
            const today = new Date();
            let ageMonths = (today.getFullYear() - dob.getFullYear()) * 12;
            ageMonths -= dob.getMonth();
            ageMonths += today.getMonth();
            
            if (ageMonths < 0) ageMonths = 0; // Should not happen if DOB is in past

            if (ageMonths < 1) {
                const ageDays = Math.floor((today - dob) / (1000 * 60 * 60 * 24));
                return `${ageDays} days`;
            }
            if (ageMonths < 24) {
                return `${ageMonths} months`;
            }
            const ageYears = Math.floor(ageMonths / 12);
            const remainingMonths = ageMonths % 12;
            return `${ageYears} years, ${remainingMonths} months`;
        }

        // --- Event Logging ---
        function showLogModal(type) {
            if (!currentBabyId) {
                alert("Please select or add a baby first.");
                return;
            }
            currentLogType = type;
            modalFields.innerHTML = ''; // Clear previous fields
            let fieldsHtml = '';
            const now = new Date();
            const currentTime = now.toTimeString().substring(0,5); // HH:MM
            const currentDate = now.toISOString().substring(0,10); // YYYY-MM-DD

            fieldsHtml += `
                <label for="logDate">Date:</label>
                <input type="date" id="logDate" value="${currentDate}">
                <label for="logTime">Time:</label>
                <input type="time" id="logTime" value="${currentTime}">
            `;

            switch (type) {
                case 'milk':
                    modalTitle.textContent = '🥛 Log Milk Intake';
                    fieldsHtml += `
                        <label for="milkAmount">Amount (ml):</label>
                        <input type="number" id="milkAmount" placeholder="e.g., 120">
                        <label for="milkType">Type:</label>
                        <select id="milkType">
                            <option value="breast_left">Breast (Left)</option>
                            <option value="breast_right">Breast (Right)</option>
                            <option value="breast_both">Breast (Both)</option>
                            <option value="formula">Formula</option>
                            <option value="expressed_milk">Expressed Milk</option>
                        </select>
                        <label for="milkNotes">Notes (optional):</label>
                        <textarea id="milkNotes" placeholder="e.g., Baby was fussy"></textarea>
                    `;
                    break;
                case 'diaper':
                    modalTitle.textContent = '👶 Log Diaper Change';
                    fieldsHtml += `
                        <label for="diaperType">Type:</label>
                        <select id="diaperType">
                            <option value="wet">Wet</option>
                            <option value="dirty">Dirty</option>
                            <option value="both">Wet & Dirty</option>
                        </select>
                        <label for="diaperNotes">Notes (optional):</label>
                        <textarea id="diaperNotes" placeholder="e.g., Rash cream applied"></textarea>
                    `;
                    break;
                case 'sleep':
                    modalTitle.textContent = '😴 Log Sleep';
                    fieldsHtml += `
                        <label for="sleepDuration">Duration (minutes):</label>
                        <input type="number" id="sleepDuration" placeholder="e.g., 90">
                        <label for="sleepNotes">Notes (optional):</label>
                        <textarea id="sleepNotes" placeholder="e.g., Slept soundly in crib"></textarea>
                    `;
                    break;
                case 'note':
                    modalTitle.textContent = '📝 Add Note';
                     fieldsHtml += `
                        <label for="generalNote">Note:</label>
                        <textarea id="generalNote" placeholder="e.g., First smile today!"></textarea>
                    `;
                    break;
            }
            modalFields.innerHTML = fieldsHtml;
            logModal.style.display = 'flex';
        }

        function closeLogModal() {
            logModal.style.display = 'none';
        }

        function saveLogEntry() {
            if (!currentBabyId) return;

            const date = document.getElementById('logDate').value;
            const time = document.getElementById('logTime').value;
            if (!date || !time) {
                alert("Please enter date and time for the log.");
                return;
            }
            const timestamp = new Date(`${date}T${time}`).toISOString();

            const eventData = {
                id: 'event_' + Date.now(),
                babyId: currentBabyId,
                type: currentLogType,
                timestamp: timestamp,
            };

            switch (currentLogType) {
                case 'milk':
                    eventData.amount = document.getElementById('milkAmount').value;
                    eventData.milkType = document.getElementById('milkType').value;
                    eventData.notes = document.getElementById('milkNotes').value;
                    if (!eventData.amount) { alert("Please enter milk amount."); return; }
                    break;
                case 'diaper':
                    eventData.diaperType = document.getElementById('diaperType').value;
                    eventData.notes = document.getElementById('diaperNotes').value;
                    scheduleNextDiaperCheck(currentBabyId, timestamp);
                    break;
                case 'sleep':
                    eventData.duration = document.getElementById('sleepDuration').value;
                    eventData.notes = document.getElementById('sleepNotes').value;
                    if (!eventData.duration) { alert("Please enter sleep duration."); return; }
                    break;
                case 'note':
                    eventData.noteText = document.getElementById('generalNote').value;
                    if (!eventData.noteText) { alert("Please enter your note."); return; }
                    break;
            }

            events.push(eventData);
            saveData();
            renderEventLog(currentBabyId);
            updateSummary(currentBabyId);
            closeLogModal();
        }
        
        function deleteEvent(eventId) {
            if (confirm("Are you sure you want to delete this event?")) {
                events = events.filter(event => event.id !== eventId);
                saveData();
                renderEventLog(currentBabyId); // Re-render for the current baby
                updateSummary(currentBabyId);   // Update summary as well
            }
        }


        function renderEventLog(babyId) {
            eventLogUl.innerHTML = '';
            const babyEvents = events
                .filter(event => event.babyId === babyId)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); // Newest first

            if (babyEvents.length === 0) {
                eventLogUl.innerHTML = '<li>No events logged yet.</li>';
                return;
            }

            babyEvents.forEach(event => {
                const li = document.createElement('li');
                const eventTime = new Date(event.timestamp).toLocaleString();
                let details = '';
                switch (event.type) {
                    case 'milk':
                        details = `🥛 Milk: ${event.amount}ml (${event.milkType}). ${event.notes ? 'Notes: ' + event.notes : ''}`;
                        break;
                    case 'diaper':
                        details = `👶 Diaper: ${event.diaperType}. ${event.notes ? 'Notes: ' + event.notes : ''}`;
                        break;
                    case 'sleep':
                        details = `😴 Sleep: ${event.duration} minutes. ${event.notes ? 'Notes: ' + event.notes : ''}`;
                        break;
                    case 'note':
                        details = `📝 Note: ${event.noteText}`;
                        break;
                }
                li.innerHTML = `<strong>${eventTime}</strong>: ${details} <button class="danger" style="float: right; padding: 3px 6px; font-size: 0.8em;" onclick="deleteEvent('${event.id}')">X</button>`;
                eventLogUl.appendChild(li);
            });
        }

        function updateSummary(babyId) {
            const babyEvents = events
                .filter(event => event.babyId === babyId)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            const lastMilkEvent = babyEvents.find(e => e.type === 'milk');
            const lastDiaperEvent = babyEvents.find(e => e.type === 'diaper');
            const lastSleepEvent = babyEvents.find(e => e.type === 'sleep');

            lastMilkSpan.textContent = lastMilkEvent ? `${new Date(lastMilkEvent.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} (${lastMilkEvent.amount}ml ${lastMilkEvent.milkType})` : 'N/A';
            lastDiaperSpan.textContent = lastDiaperEvent ? `${new Date(lastDiaperEvent.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} (${lastDiaperEvent.diaperType})` : 'N/A';
            lastSleepSpan.textContent = lastSleepEvent ? `${new Date(lastSleepEvent.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} (${lastSleepEvent.duration} min)` : 'N/A';
            
            const baby = babies.find(b => b.id === babyId);
            if (baby && baby.nextDiaperCheck) {
                nextDiaperCheckSpan.textContent = `Next check: ${new Date(baby.nextDiaperCheck).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                nextDiaperCheckSpan.style.color = new Date(baby.nextDiaperCheck) < new Date() ? 'var(--danger-color)' : 'var(--accent-color)';
            } else {
                nextDiaperCheckSpan.textContent = 'Schedule: N/A';
                nextDiaperCheckSpan.style.color = 'inherit';
            }
        }

        // --- Notifications & Scheduling ---
        function setupNotificationPermission() {
            const statusDiv = document.getElementById('notificationStatus');
            if (!('Notification' in window)) {
                statusDiv.textContent = 'This browser does not support desktop notifications.';
                statusDiv.className = 'notification-status notification-denied';
                notificationPermission = 'denied';
                return;
            }

            if (Notification.permission === 'granted') {
                notificationPermission = 'granted';
                statusDiv.textContent = '✅ Notifications enabled.';
                statusDiv.className = 'notification-status notification-granted';
            } else if (Notification.permission === 'denied') {
                notificationPermission = 'denied';
                statusDiv.textContent = '❌ Notifications denied. Please enable in browser settings if desired.';
                statusDiv.className = 'notification-status notification-denied';
            } else {
                notificationPermission = 'default';
                statusDiv.innerHTML = '🔔 <button onclick="requestNotificationPermission()">Enable Notifications</button> for reminders.';
                statusDiv.className = 'notification-status notification-default';
            }
        }

        function requestNotificationPermission() {
            Notification.requestPermission().then(permission => {
                notificationPermission = permission;
                setupNotificationPermission(); // Update UI based on new permission
                if (permission === 'granted') {
                    showNotification('Baby Care Hub', 'Notifications are now enabled!');
                }
            });
        }

        function showNotification(title, body, babyName = null) {
            if (notificationPermission === 'granted') {
                const options = {
                    body: body,
                    icon: 'https://via.placeholder.com/48?text=🍼' // A generic icon
                };
                if (babyName) { // Add baby name to notification if provided
                    title = `${babyName}: ${title}`;
                }
                new Notification(title, options);
            }
        }

        function scheduleNextDiaperCheck(babyId, lastDiaperTimestamp) {
            const baby = babies.find(b => b.id === babyId);
            if (!baby) return;

            // Schedule next check 3 hours from last change (configurable)
            const DIAPER_CHECK_INTERVAL_HOURS = 3;
            const nextCheckTime = new Date(lastDiaperTimestamp);
            nextCheckTime.setHours(nextCheckTime.getHours() + DIAPER_CHECK_INTERVAL_HOURS);
            
            baby.nextDiaperCheck = nextCheckTime.toISOString();
            saveData();
            updateSummary(babyId); // Update summary immediately
        }
        
        function startDiaperCheckScheduler() {
            if (diaperCheckIntervalId) clearInterval(diaperCheckIntervalId); // Clear existing interval

            diaperCheckIntervalId = setInterval(() => {
                const now = new Date();
                babies.forEach(baby => {
                    if (baby.nextDiaperCheck) {
                        const nextCheck = new Date(baby.nextDiaperCheck);
                        if (nextCheck <= now) {
                            // Time for a diaper check!
                            showNotification('Diaper Check Time!', `Time to check ${baby.name}'s diaper. Last change was at ${new Date(events.filter(e => e.babyId === baby.id && e.type === 'diaper').sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))[0].timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}.`, baby.name);
                            
                            // Reschedule for 15 mins later if user doesn't log new one, or clear if they do.
                            // For simplicity, we'll just clear it. New log will set a new schedule.
                            // Or, for persistence, we could nag every 15 mins:
                            // baby.nextDiaperCheck = new Date(now.getTime() + 15 * 60000).toISOString(); 
                            // For now, let's just clear it so it doesn't re-notify until a new diaper is logged.
                            // A better approach might be a "snooze" or "checked" button on the notification.
                            baby.nextDiaperCheck = null; // Clear it to prevent immediate re-notification
                            saveData();
                            if (baby.id === currentBabyId) { // If current baby, update their summary
                                updateSummary(baby.id);
                            }
                        }
                    }
                });
            }, 60000); // Check every minute
        }

        // --- Breastfeeding Timer ---
        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timerSeconds);
        }

        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            startTimerBtn.classList.add('hidden');
            pauseTimerBtn.classList.remove('hidden');
            logTimerBtn.classList.add('hidden'); // Hide log button until paused/reset

            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function pauseTimer() {
            if (!timerRunning) return;
            timerRunning = false;
            clearInterval(timerInterval);
            startTimerBtn.classList.remove('hidden');
            startTimerBtn.textContent = "Resume Timer";
            pauseTimerBtn.classList.add('hidden');
            if (timerSeconds > 0) logTimerBtn.classList.remove('hidden');
        }

        function resetTimer() {
            timerRunning = false;
            clearInterval(timerInterval);
            timerSeconds = 0;
            updateTimerDisplay();
            startTimerBtn.classList.remove('hidden');
            startTimerBtn.textContent = "Start Timer";
            pauseTimerBtn.classList.add('hidden');
            logTimerBtn.classList.add('hidden');
        }
        
        function logTimerAsMilk() {
            if (!currentBabyId || timerSeconds === 0) return;

            const durationMinutes = Math.round(timerSeconds / 60);
            if (durationMinutes === 0) {
                alert("Timer duration is too short to log meaningfully.");
                return;
            }

            // Pre-fill modal for milk logging
            showLogModal('milk');
            // Note: The modal fields are generated dynamically, so we set values after showLogModal
            // A slight delay or direct DOM manipulation might be needed if elements aren't ready.
            // For simplicity, we'll assume they are available.
            setTimeout(() => { // Ensure modal fields are populated
                document.getElementById('milkAmount').value = durationMinutes; // Use minutes as "amount" for timed feeds
                document.getElementById('milkType').value = 'breast_both'; // Default, user can change
                document.getElementById('milkNotes').value = `Timed feed: ${formatTime(timerSeconds)}`;
                
                // Optionally, add a new milkType like 'breast_timed_feed'
                const milkTypeSelect = document.getElementById('milkType');
                let timedFeedOption = milkTypeSelect.querySelector('option[value="breast_timed"]');
                if (!timedFeedOption) {
                    timedFeedOption = document.createElement('option');
                    timedFeedOption.value = "breast_timed";
                    timedFeedOption.textContent = "Breast (Timed)";
                    milkTypeSelect.appendChild(timedFeedOption);
                }
                milkTypeSelect.value = "breast_timed";

            }, 100); // Small delay to ensure modal is ready

            // Don't automatically save, let user confirm in modal.
            // Reset timer after opening log modal
            resetTimer();
        }


        // Close modal on escape key
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeLogModal();
            }
        });

        // Close modal on outside click
        window.addEventListener('click', (event) => {
            if (event.target === logModal) {
                closeLogModal();
            }
        });

    </script>
</body>
</html>
