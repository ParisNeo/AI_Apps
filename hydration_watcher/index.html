<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quest</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        #water-level { transition: y 0.5s ease, height 0.5s ease; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; border-radius: 5px; color: white; }
        .toast-success { background: #34D399; }
        .toast-error { background: #F87171; }
    </style>
</head>
<body>
    <div id="app">
        <div class="container mx-auto p-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">Water Quest</h1>
                <button @click="openSettings"><i data-feather="settings"></i></button>
            </div>
            <div class="mt-4 flex justify-center">
                <svg width="100" height="200" viewBox="0 0 100 200">
                    <path d="M30 20 Q35 10 50 10 Q65 10 70 20 L70 180 Q65 190 50 190 Q35 190 30 180 Z" fill="none" stroke="#000" stroke-width="2"/>
                    <rect id="water-level" x="30" :y="200 - progress * 1.8" width="40" :height="progress * 1.8" fill="#60A5FA"/>
                </svg>
            </div>
            <p class="text-center mt-2">{{ currentIntake }} / {{ goal }} ml</p>
            <p class="text-center">Tokens: {{ tokens }} <span class="text-yellow-500">💧</span></p>
            <div class="mt-4 flex justify-center space-x-2 flex-wrap">
                <button @click="logDrink(100)" class="bg-blue-500 text-white px-3 py-1 rounded">+100ml</button>
                <button @click="logDrink(250)" class="bg-blue-500 text-white px-3 py-1 rounded">+250ml</button>
                <button @click="startChallenge(500, 3600)" class="bg-purple-500 text-white px-3 py-1 rounded">Challenge: 500ml</button>
            </div>
            <div v-if="activeChallenge" class="mt-2 text-center">
                <p>Challenge: Drink {{ activeChallenge.amount }}ml in {{ challengeTimeLeft }}s</p>
            </div>
        </div>
        <div v-if="showSettings" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex justify-center items-center">
            <div class="bg-white p-4 rounded w-3/4 max-w-md">
                <h2 class="text-xl font-bold">Settings</h2>
                <label>Daily Goal (ml):</label>
                <input type="number" v-model.number="goal" class="border p-2 rounded w-full">
                <h3 class="mt-2">History</h3>
                <ul>
                    <li v-for="(intake, date) in history" :key="date">{{ date }}: {{ intake }} ml</li>
                </ul>
                <button @click="closeSettings" class="mt-4 bg-red-500 text-white px-4 py-2 rounded">Close</button>
            </div>
        </div>
        <div v-if="toast" class="toast" :class="toast.type">{{ toast.message }}</div>
    </div>
    <script>
        const app = new Vue({
            el: '#app',
            data: {
                goal: 2000,
                history: {},
                tokens: 0,
                currentDate: new Date().toISOString().split('T')[0],
                showSettings: false,
                activeChallenge: null,
                challengeTimeLeft: 0,
                toast: null
            },
            computed: {
                currentIntake() {
                    return this.history[this.currentDate] || 0;
                },
                progress() {
                    return Math.min((this.currentIntake / this.goal) * 100, 100);
                }
            },
            methods: {
                logDrink(amount) {
                    try {
                        if (!this.history[this.currentDate]) this.history[this.currentDate] = 0;
                        const prevIntake = this.history[this.currentDate];
                        this.history[this.currentDate] += amount;
                        this.tokens += Math.floor(amount / 100); // 1 token per 100ml
                        if (prevIntake < this.goal && this.history[this.currentDate] >= this.goal) {
                            confetti();
                            this.showToast('success', 'Goal reached! +5 bonus tokens!');
                            this.tokens += 5;
                        }
                        this.showToast('success', `Added ${amount}ml`);
                        this.saveData();
                    } catch (e) {
                        this.showToast('error', 'Error logging drink');
                        console.error(e);
                    }
                },
                startChallenge(amount, time) {
                    try {
                        if (this.tokens < 5) {
                            this.showToast('error', 'Need 5 tokens to start!');
                            return;
                        }
                        this.tokens -= 5;
                        this.activeChallenge = { amount, timeLeft: time, initialIntake: this.currentIntake };
                        this.challengeTimeLeft = time;
                        const interval = setInterval(() => {
                            this.challengeTimeLeft--;
                            if (this.challengeTimeLeft <= 0) {
                                clearInterval(interval);
                                this.endChallenge(false);
                            } else if (this.currentIntake >= this.activeChallenge.initialIntake + amount) {
                                clearInterval(interval);
                                this.endChallenge(true);
                            }
                        }, 1000);
                        this.saveData();
                    } catch (e) {
                        this.showToast('error', 'Error starting challenge');
                        console.error(e);
                    }
                },
                endChallenge(success) {
                    try {
                        if (success) {
                            this.tokens += 10;
                            confetti();
                            this.showToast('success', 'Challenge completed! +10 tokens!');
                        } else {
                            this.showToast('error', 'Challenge failed');
                        }
                        this.activeChallenge = null;
                        this.saveData();
                    } catch (e) {
                        this.showToast('error', 'Error ending challenge');
                        console.error(e);
                    }
                },
                showToast(type, message) {
                    this.toast = { type: `toast-${type}`, message };
                    setTimeout(() => this.toast = null, 2000);
                },
                openSettings() {
                    this.showSettings = true;
                },
                closeSettings() {
                    this.showSettings = false;
                    this.saveData();
                },
                saveData() {
                    try {
                        localStorage.setItem('hydrationData', JSON.stringify({
                            goal: this.goal,
                            history: this.history,
                            tokens: this.tokens
                        }));
                    } catch (e) {
                        this.showToast('error', 'Error saving data');
                        console.error(e);
                    }
                },
                loadData() {
                    try {
                        const data = localStorage.getItem('hydrationData');
                        if (data) {
                            const parsed = JSON.parse(data);
                            this.goal = parsed.goal || 2000;
                            this.history = parsed.history || {};
                            this.tokens = parsed.tokens || 0;
                        }
                    } catch (e) {
                        this.showToast('error', 'Error loading data');
                        console.error(e);
                    }
                },
                scheduleNotifications() {
                    try {
                        if (!("Notification" in window)) return;
                        Notification.requestPermission().then(permission => {
                            if (permission === "granted") {
                                setInterval(() => {
                                    new Notification("Time to hydrate!", { body: "Earn tokens by drinking now!" });
                                }, 3600 * 1000); // Every hour
                            }
                        });
                    } catch (e) {
                        this.showToast('error', 'Error setting notifications');
                        console.error(e);
                    }
                }
            },
            mounted() {
                this.loadData();
                this.scheduleNotifications();
                feather.replace();
            }
        });
    </script>
</body>
</html>
