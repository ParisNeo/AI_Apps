<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaser Tower War</title>
    <!-- Get Phaser via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #2c3e50; /* Darker background */
            font-family: sans-serif;
            color: #ecf0f1; /* Light text */
        }
        #game-container {
            border: 3px solid #ecf0f1;
            box-shadow: 0 0 15px rgba(236, 240, 241, 0.5);
            margin-bottom: 15px;
            /* Canvas background will be set by Phaser */
        }
        #controls {
            margin-top: 10px; /* Reduced margin as game container has margin */
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #3498db; /* Blue button */
            color: white;
            transition: background-color 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6; /* Greyed out */
            cursor: not-allowed;
        }
        #status {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #bdc3c7; /* Lighter grey text */
            min-height: 25px; /* Prevent layout shift */
            text-align: center;
            width: 100%;
        }
         /* Simple overlay for game over */
        #gameOverOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 48px;
            display: flex;
            flex-direction: column; /* Stack text and button */
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 100; /* Ensure it's above canvas */
            visibility: hidden; /* Hidden by default */
            opacity: 0;
            transition: visibility 0s linear 0.5s, opacity 0.5s linear;
        }
        #gameOverOverlay.visible {
            visibility: visible;
            opacity: 1;
            transition: visibility 0s linear 0s, opacity 0.5s linear;
        }
        #gameOverOverlay button { /* Style restart button on overlay */
             margin-top: 20px;
             background-color: #e74c3c; /* Red restart */
        }
         #gameOverOverlay button:hover {
             background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>Phaser Tower War</h1>
    <!-- Container for the Phaser game canvas -->
    <div id="game-container"></div>
    <div id="status">Loading...</div>
    <div id="controls">
        <!-- We'll control these buttons from Phaser -->
        <button id="spawnPlayerUnitBtn">Spawn Unit (Cost: ?)</button>
        <!-- Restart button is now part of the game over overlay -->
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay">
        <span id="gameOverText">Game Over!</span>
        <button id="restartBtn">Restart Game</button>
    </div>


    <script>
        // --- Game Configuration (Combined Phaser and Game Logic) ---
        const CONFIG = {
            GAME_WIDTH: 900,
            GAME_HEIGHT: 450,
            UNIT_SIZE: 14,
            UNIT_SPEED: 70, // Phaser uses pixels per second for velocity
            UNIT_HEALTH: 75,
            UNIT_ATTACK: 8,
            UNIT_ATTACK_RANGE: 15, // Pixel distance from edge
            UNIT_ATTACK_COOLDOWN: 700, // Milliseconds
            BASE_WIDTH: 80,
            BASE_HEIGHT: 100,
            BASE_HEALTH_MAX: 2000,
            PLAYER_COLOR: 0x3498db, // Blue (Hex for Phaser)
            ENEMY_COLOR: 0xe74c3c, // Red (Hex for Phaser)
            OBSTACLE_COLOR: 0x8d6e63, // Brownish Grey (Hex)
            OBSTACLE_BORDER_COLOR: 0x5d4037, // Darker Brown
            HEALTH_BAR_COLOR_PLAYER: 0x4CAF50,
            HEALTH_BAR_COLOR_ENEMY: 0xf44336,
            HEALTH_BAR_BG_COLOR: 0xdddddd,
            AUTO_SPAWN_INTERVAL_ENEMY: 2500,
            AUTO_SPAWN_INTERVAL_PLAYER: 3200,
            PLAYER_MANUAL_SPAWN_COST: 10,
            STARTING_RESOURCES: 50,
            RESOURCE_GAIN_INTERVAL: 1200,
            RESOURCE_GAIN_AMOUNT: 3,
            WAYPOINT_REACH_THRESHOLD: 8, // Slightly larger threshold for physics movement
            DEBUG_DRAW_PATHS: false // Set to true to see waypoints and paths
        };

        let gameInstance = null; // To hold the Phaser game instance
        let gameScene = null; // To hold the reference to the main scene

        // --- Game Object Classes (Extending Phaser) ---

        class BaseGameObject extends Phaser.GameObjects.Container {
            constructor(scene, x, y, width, height, color, team, maxHealth) {
                super(scene, x, y);
                this.baseWidth = width;
                this.baseHeight = height;
                this.team = team;
                this.maxHealth = maxHealth;
                this.currentHealth = maxHealth;
                this.isBase = true; // Identifier

                // --- Visuals ---
                // Base Body (origin defaults to 0.5, 0.5 - center)
                this.bodySprite = scene.add.rectangle(0, 0, width, height, color);
                this.bodySprite.setStrokeStyle(3, 0x333333); // Outline
                this.add(this.bodySprite); // Add to container

                // Health Bar (relative to container's top-left)
                const barWidth = width * 0.9;
                const barHeight = 10;
                const barX = -barWidth / 2; // Center it horizontally
                const barY = -height / 2 - barHeight - 5; // Position above base body

                this.healthBarBg = scene.add.rectangle(barX, barY, barWidth, barHeight, CONFIG.HEALTH_BAR_BG_COLOR).setOrigin(0, 0.5);
                this.healthBar = scene.add.rectangle(barX, barY, barWidth, barHeight, team === 'player' ? CONFIG.HEALTH_BAR_COLOR_PLAYER : CONFIG.HEALTH_BAR_COLOR_ENEMY).setOrigin(0, 0.5);
                this.add([this.healthBarBg, this.healthBar]); // Add health bars to container

                // --- Physics ---
                scene.add.existing(this); // Add container to scene
                scene.physics.add.existing(this, true); // Add static physics body
                // Adjust physics body size to match visual size
                this.body.setSize(width, height);
                // Container position is center, but physics body offset is top-left relative to center
                // this.body.setOffset(-width / 2, -height / 2); // Not usually needed for static bodies if positioned correctly

                this.updateHealthBar(); // Initial draw
            }

            updateHealthBar() {
                const healthPercent = Math.max(0, this.currentHealth / this.maxHealth);
                this.healthBar.width = this.healthBarBg.width * healthPercent;
            }

            takeDamage(amount) {
                this.currentHealth -= amount;
                this.updateHealthBar();

                // Flash effect (optional)
                this.scene.tweens.add({
                    targets: this.bodySprite,
                    alpha: 0.5,
                    duration: 80,
                    yoyo: true,
                });


                if (this.currentHealth <= 0 && !this.scene.gameOver) {
                    this.currentHealth = 0;
                    // Let the scene handle game over logic
                    this.scene.triggerGameOver(this.team === 'player' ? 'enemy' : 'player');
                    // Maybe add an explosion/destruction animation here
                    // this.destroy(); // Optionally destroy the base visually
                }
            }

             // Need getters for physics body dimensions if needed elsewhere
             getBodyWidth() { return this.body.width; }
             getBodyHeight() { return this.body.height; }
             getCenterX() { return this.x; }
             getCenterY() { return this.y; }
        }

        class UnitGameObject extends Phaser.GameObjects.Container {
            constructor(scene, x, y, color, team, path) {
                super(scene, x, y);
                this.unitSize = CONFIG.UNIT_SIZE;
                this.radius = this.unitSize / 2;
                this.team = team;
                this.path = path;
                this.maxHealth = CONFIG.UNIT_HEALTH;
                this.currentHealth = this.maxHealth;
                this.attackPower = CONFIG.UNIT_ATTACK;
                this.attackRange = CONFIG.UNIT_ATTACK_RANGE + this.radius; // Center-to-center check simplified later
                this.attackCooldown = CONFIG.UNIT_ATTACK_COOLDOWN;
                this.speed = CONFIG.UNIT_SPEED * (1 + Math.random() * 0.1 - 0.05); // Slight variation
                this.isUnit = true; // Identifier

                this.currentWaypointIndex = 0;
                this.targetUnit = null;
                this.targetBase = null;
                this.lastAttackTime = 0;
                this.isAttacking = false;

                // Determine final target based on enemy base position
                const enemyBase = (team === 'player') ? scene.enemyBase : scene.playerBase;
                this.finalTargetX = (team === 'player') ? enemyBase.x - enemyBase.getBodyWidth() / 2 - this.radius : enemyBase.x + enemyBase.getBodyWidth() / 2 + this.radius;
                this.finalTargetY = enemyBase.y; // Target center Y of base


                // --- Visuals ---
                this.bodySprite = scene.add.circle(0, 0, this.radius, color).setStrokeStyle(1, 0x000000);
                this.add(this.bodySprite);

                // Health Bar
                const barWidth = this.unitSize * 1.5;
                const barHeight = 4;
                const barX = -barWidth / 2;
                const barY = -this.radius - barHeight - 3;
                this.healthBarBg = scene.add.rectangle(barX, barY, barWidth, barHeight, CONFIG.HEALTH_BAR_BG_COLOR).setOrigin(0, 0.5);
                this.healthBar = scene.add.rectangle(barX, barY, barWidth, barHeight, team === 'player' ? CONFIG.HEALTH_BAR_COLOR_PLAYER : CONFIG.HEALTH_BAR_COLOR_ENEMY).setOrigin(0, 0.5);
                this.add([this.healthBarBg, this.healthBar]);

                // --- Physics ---
                scene.add.existing(this);
                scene.physics.add.existing(this); // Dynamic body
                this.body.setCircle(this.radius); // Make physics body circular
                this.body.setCollideWorldBounds(true);
                 // Optional: Add slight drag or bounce if desired
                 // this.body.setDrag(50);
                 // this.body.setBounce(0.1);

                this.updateHealthBar();
            }

            updateHealthBar() {
                if (!this.healthBar) return; // Already destroyed
                const healthPercent = Math.max(0, this.currentHealth / this.maxHealth);
                this.healthBar.width = this.healthBarBg.width * healthPercent;
            }

             takeDamage(amount) {
                if (!this.active) return; // Already dead/destroyed

                this.currentHealth -= amount;
                this.updateHealthBar();

                 // Flash effect
                 this.scene.tweens.add({
                    targets: this.bodySprite,
                    alpha: 0.3,
                    duration: 60,
                    yoyo: true,
                });

                if (this.currentHealth <= 0) {
                    this.currentHealth = 0;
                    this.die();
                }
            }

            die() {
                 if (!this.active) return;
                 // Optional: Add death effect (e.g., particles, shrink tween)
                 this.scene.tweens.add({
                    targets: this,
                    scale: 0,
                    alpha: 0,
                    duration: 200,
                    ease: 'Linear',
                    onComplete: () => {
                        this.destroy(); // Remove from scene, physics, and groups
                    }
                 });
                 this.body.enable = false; // Disable physics immediately
                 this.active = false; // Mark as inactive
            }

            // Main update logic called by the scene
             updateUnit(time, delta, enemyUnitsGroup, enemyBase) {
                 if (!this.active || !this.body) return; // Skip if dead or physics body gone

                 this.isAttacking = false;

                 // --- Targeting ---
                 this.findTarget(enemyUnitsGroup.getChildren(), enemyBase);

                 const now = time; // Phaser passes time directly

                 // --- Attacking ---
                 if (this.targetUnit && this.isTargetInRange(this.targetUnit) && (now - this.lastAttackTime >= this.attackCooldown)) {
                     this.attack(this.targetUnit, now);
                 } else if (this.targetBase && this.isTargetInRange(this.targetBase) && (now - this.lastAttackTime >= this.attackCooldown)) {
                     this.attack(this.targetBase, now);
                 }

                 // --- Movement ---
                 if (!this.isAttacking) {
                     this.moveAlongPath(delta);
                 } else {
                     this.body.setVelocity(0, 0); // Stop moving when attacking
                 }
            }

            findTarget(enemyUnitsArray, enemyBase) {
                 // Simple targeting: Attack base if close, otherwise nearest unit.
                 // Prioritize existing target if still valid and in range.

                // Reset targets if they are dead/inactive
                if (this.targetUnit && (!this.targetUnit.active || this.targetUnit.currentHealth <= 0)) {
                    this.targetUnit = null;
                }
                 if (this.targetBase && (!this.targetBase.active || this.targetBase.currentHealth <= 0)) {
                    // Should trigger game over, but good practice
                    this.targetBase = null;
                 }


                // Check Base first - if close enough, always prioritize it
                const distToBaseSq = Phaser.Math.Distance.Squared(this.x, this.y, enemyBase.x, enemyBase.y);
                // Attack range check uses center-to-center distance adjusted for radii/widths
                const baseAttackRange = this.radius + enemyBase.getBodyWidth() / 2 + CONFIG.UNIT_ATTACK_RANGE;
                if (distToBaseSq <= baseAttackRange * baseAttackRange) {
                    this.targetBase = enemyBase;
                    this.targetUnit = null; // Prioritize base when in range
                    return;
                } else {
                     this.targetBase = null; // Base is out of range
                }


                 // If not targeting base, check units
                 let closestEnemy = null;
                 let minDistanceSq = (this.attackRange * 2.5) ** 2; // Search slightly larger radius

                 enemyUnitsArray.forEach(enemy => {
                    if (!enemy.active || enemy.currentHealth <= 0 || enemy.team === this.team) return;

                    const distSq = Phaser.Math.Distance.Squared(this.x, this.y, enemy.x, enemy.y);
                    if (distSq < minDistanceSq) {
                        minDistanceSq = distSq;
                        closestEnemy = enemy;
                    }
                 });

                 this.targetUnit = closestEnemy; // Assign closest found enemy (can be null)

            }


            isTargetInRange(target) {
                if (!target || !target.active) return false;

                const distSq = Phaser.Math.Distance.Squared(this.x, this.y, target.x, target.y);
                let range = 0;

                 if (target.isUnit) {
                    // Unit-to-unit: sum of radii + attack range buffer
                     range = this.radius + target.radius + CONFIG.UNIT_ATTACK_RANGE;
                 } else if (target.isBase) {
                     // Unit-to-base: unit radius + half base width + attack range buffer
                     range = this.radius + target.getBodyWidth() / 2 + CONFIG.UNIT_ATTACK_RANGE;
                 }

                 return distSq <= range * range;
            }

            attack(target, time) {
                 if (!target || !target.active) { // Target might die between check and attack
                     this.targetUnit = null;
                     this.targetBase = null;
                     return;
                 }
                 this.isAttacking = true;
                 this.lastAttackTime = time;
                 target.takeDamage(this.attackPower);

                 // Simple attack visual (e.g., quick scale pulse)
                  this.scene.tweens.add({
                     targets: this.bodySprite,
                     scaleX: 1.2,
                     scaleY: 1.2,
                     duration: 50,
                     yoyo: true,
                     ease: 'Sine.easeInOut'
                 });


                 // If target died, clear target immediately
                 if (target.currentHealth <= 0) {
                     if (target.isUnit) this.targetUnit = null;
                     if (target.isBase) this.targetBase = null; // Base handles game over
                 }
            }

            moveAlongPath(delta) {
                 if (!this.active || !this.body) return;

                 let targetX, targetY;

                 // Determine current target point
                 if (this.currentWaypointIndex < this.path.length) {
                    const waypoint = this.path[this.currentWaypointIndex];
                    targetX = waypoint.x;
                    targetY = waypoint.y;

                    // Check if waypoint is reached (using physics body position)
                    const distSq = Phaser.Math.Distance.Squared(this.body.x + this.radius, this.body.y + this.radius, targetX, targetY); // Body pos is top-left
                    if (distSq < CONFIG.WAYPOINT_REACH_THRESHOLD ** 2) {
                        this.currentWaypointIndex++;
                        // Don't immediately recalculate target here, let next frame handle it
                    }
                 } else {
                    // Heading towards final base target
                     targetX = this.finalTargetX;
                     targetY = this.finalTargetY;

                     // Check if close enough to final target to stop precise pathing
                      const finalDistSq = Phaser.Math.Distance.Squared(this.x, this.y, targetX, targetY);
                     if (finalDistSq < (this.attackRange * 0.8)**2) { // If within attack range, let attack logic take over
                          this.body.setVelocity(0, 0);
                          return;
                     }
                 }

                // Move towards the target point using physics velocity
                this.scene.physics.moveTo(this, targetX, targetY, this.speed);

                 // Optional: Rotate sprite towards movement direction
                 this.bodySprite.rotation = Phaser.Math.Angle.Between(this.x, this.y, this.x + this.body.velocity.x, this.y + this.body.velocity.y) + Math.PI/2;
            }
        }


        // --- Phaser Scene ---
        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
                // Game state properties
                this.playerBase = null;
                this.enemyBase = null;
                this.playerUnits = null; // Physics Group
                this.enemyUnits = null; // Physics Group
                this.obstacles = null; // Physics Static Group
                this.paths = { playerTop: [], playerBottom: [], enemyTop: [], enemyBottom: [] };
                this.playerResources = CONFIG.STARTING_RESOURCES;
                this.gameOver = false;
                this.winner = null;

                // Timers
                this.playerSpawnTimer = null;
                this.enemySpawnTimer = null;
                this.resourceTimer = null;

                // UI Elements (references to HTML)
                this.statusText = document.getElementById('status');
                this.spawnButton = document.getElementById('spawnPlayerUnitBtn');
                this.restartButton = document.getElementById('restartBtn');
                this.gameOverOverlay = document.getElementById('gameOverOverlay');
                this.gameOverText = document.getElementById('gameOverText');
            }

            preload() {
                // No assets to load for this version, but you would load images/spritesheets here:
                // this.load.image('unitSprite', 'path/to/unit.png');
                // this.load.image('baseSprite', 'path/to/base.png');
            }

            create() {
                gameScene = this; // Make scene accessible globally
                this.gameOver = false;
                this.winner = null;
                this.playerResources = CONFIG.STARTING_RESOURCES;
                this.gameOverOverlay.classList.remove('visible');


                // Set background color
                this.cameras.main.setBackgroundColor('#a5d6a7'); // Light green playing field

                // Initialize physics groups first
                // These are re-created each time create() is called, which is correct
                this.playerUnits = this.physics.add.group({ classType: UnitGameObject, runChildUpdate: false });
                this.enemyUnits = this.physics.add.group({ classType: UnitGameObject, runChildUpdate: false });
                this.obstacles = this.physics.add.staticGroup();

                // Create Bases (centered vertically)
                const baseY = CONFIG.GAME_HEIGHT / 2;
                this.playerBase = new BaseGameObject(this, CONFIG.BASE_WIDTH / 2 + 20, baseY, CONFIG.BASE_WIDTH, CONFIG.BASE_HEIGHT, CONFIG.PLAYER_COLOR, 'player', CONFIG.BASE_HEALTH_MAX);
                this.enemyBase = new BaseGameObject(this, CONFIG.GAME_WIDTH - CONFIG.BASE_WIDTH / 2 - 20, baseY, CONFIG.BASE_WIDTH, CONFIG.BASE_HEIGHT, CONFIG.ENEMY_COLOR, 'enemy', CONFIG.BASE_HEALTH_MAX);

                // Define Obstacles and Paths (relative to game dimensions)
                this.definePathsAndObstacles();

                // Draw path lines for debugging if enabled
                if (CONFIG.DEBUG_DRAW_PATHS) this.drawDebugPaths();


                // Setup Physics Collisions/Overlaps
                // Units should not collide strongly with each other, maybe just overlap
                this.physics.add.overlap(this.playerUnits, this.enemyUnits, null, null, this); // Overlap detected, handled in unit update
                // Units DO collide with obstacles
                this.physics.add.collider(this.playerUnits, this.obstacles);
                this.physics.add.collider(this.enemyUnits, this.obstacles);
                 // Prevent units clumping too much (optional)
                 this.physics.add.collider(this.playerUnits, this.playerUnits);
                 this.physics.add.collider(this.enemyUnits, this.enemyUnits);

                // Setup Timers using Phaser's timer events
                this.setupTimers();

                // Setup UI Button Listeners
                this.spawnButton.onclick = () => this.spawnPlayerUnit(true); // Manual spawn
                this.restartButton.onclick = () => this.restartGame();


                this.updateStatusDisplay(); // Initial display
            }

            // This method is crucial for cleaning up when the scene restarts
            shutdown() {
                console.log("GameScene shutdown called.");

                // Stop all active timers and clear references
                if (this.playerSpawnTimer) {
                    this.playerSpawnTimer.remove();
                    this.playerSpawnTimer = null;
                }
                if (this.enemySpawnTimer) {
                    this.enemySpawnTimer.remove();
                    this.enemySpawnTimer = null;
                }
                if (this.resourceTimer) {
                    this.resourceTimer.remove();
                    this.resourceTimer = null;
                }

                // Destroy all game objects within groups
                // The 'true, true' arguments mean 'destroy all children' and 'remove them from the group'
                if (this.playerUnits) {
                    this.playerUnits.clear(true, true);
                    this.playerUnits = null; // Clear reference to the group
                }
                if (this.enemyUnits) {
                    this.enemyUnits.clear(true, true);
                    this.enemyUnits = null;
                }
                if (this.obstacles) {
                    this.obstacles.clear(true, true);
                    this.obstacles = null;
                }

                // Destroy individual game objects (bases)
                if (this.playerBase) {
                    this.playerBase.destroy();
                    this.playerBase = null;
                }
                if (this.enemyBase) {
                    this.enemyBase.destroy();
                    this.enemyBase = null;
                }

                // Destroy any graphics objects used for debugging paths
                this.children.each(child => {
                    if (child instanceof Phaser.GameObjects.Graphics) {
                        child.destroy();
                    }
                });

                // Ensure global gameScene reference is nullified so the new scene can be assigned
                gameScene = null;
            }


            definePathsAndObstacles() {
                 // Add a central obstacle block
                const obsWidth = 120;
                const obsHeight = 180;
                const obsX = CONFIG.GAME_WIDTH / 2; // Center X
                const obsY = CONFIG.GAME_HEIGHT / 2; // Center Y
                 // Use create to add to static group directly
                const centralObstacle = this.add.rectangle(obsX, obsY, obsWidth, obsHeight, CONFIG.OBSTACLE_COLOR)
                                              .setStrokeStyle(2, CONFIG.OBSTACLE_BORDER_COLOR);
                this.obstacles.add(centralObstacle);


                // Add smaller side obstacles
                 const sideObsWidth = 60, sideObsHeight = 100;
                 const sideObs1 = this.add.rectangle(CONFIG.GAME_WIDTH * 0.25, CONFIG.GAME_HEIGHT * 0.2, sideObsWidth, sideObsHeight, CONFIG.OBSTACLE_COLOR)
                                         .setStrokeStyle(2, CONFIG.OBSTACLE_BORDER_COLOR);
                 this.obstacles.add(sideObs1);
                  const sideObs2 = this.add.rectangle(CONFIG.GAME_WIDTH * 0.75, CONFIG.GAME_HEIGHT * 0.8, sideObsWidth, sideObsHeight, CONFIG.OBSTACLE_COLOR)
                                         .setStrokeStyle(2, CONFIG.OBSTACLE_BORDER_COLOR);
                 this.obstacles.add(sideObs2);


                // --- Define Waypoints ---
                const margin = 40;
                const midX = CONFIG.GAME_WIDTH / 2;

                // Player paths (adjust for base/obstacle positions)
                const playerSpawnX = this.playerBase.x + this.playerBase.getBodyWidth() / 2 + CONFIG.UNIT_SIZE;
                const enemyGoalX = this.enemyBase.x - this.enemyBase.getBodyWidth() / 2 - CONFIG.UNIT_SIZE;

                this.paths.playerTop = [
                    { x: playerSpawnX + 60, y: margin },
                    { x: midX - obsWidth/2 - margin, y: margin },
                    { x: midX + obsWidth/2 + margin, y: margin },
                    { x: enemyGoalX - 60, y: margin },
                    //{ x: enemyGoalX, y: this.enemyBase.y } // Final target handled by unit logic now
                ];
                this.paths.playerBottom = [
                    { x: playerSpawnX + 60, y: CONFIG.GAME_HEIGHT - margin },
                    { x: midX - obsWidth/2 - margin, y: CONFIG.GAME_HEIGHT - margin},
                    { x: midX + obsWidth/2 + margin, y: CONFIG.GAME_HEIGHT - margin},
                    { x: enemyGoalX - 60, y: CONFIG.GAME_HEIGHT - margin },
                    //{ x: enemyGoalX, y: this.enemyBase.y }
                ];

                // Enemy paths (mirror)
                 const enemySpawnX = this.enemyBase.x - this.enemyBase.getBodyWidth() / 2 - CONFIG.UNIT_SIZE;
                 const playerGoalX = this.playerBase.x + this.playerBase.getBodyWidth() / 2 + CONFIG.UNIT_SIZE;

                this.paths.enemyTop = [
                    { x: enemySpawnX - 60, y: margin },
                    { x: midX + obsWidth/2 + margin, y: margin },
                    { x: midX - obsWidth/2 - margin, y: margin },
                    { x: playerGoalX + 60, y: margin },
                    //{ x: playerGoalX, y: this.playerBase.y }
                ];
                this.paths.enemyBottom = [
                    { x: enemySpawnX - 60, y: CONFIG.GAME_HEIGHT - margin },
                    { x: midX + obsWidth/2 + margin, y: CONFIG.GAME_HEIGHT - margin },
                    { x: midX - obsWidth/2 - margin, y: CONFIG.GAME_HEIGHT - margin },
                    { x: playerGoalX + 60, y: CONFIG.GAME_HEIGHT - margin },
                   // { x: playerGoalX, y: this.playerBase.y }
                ];
            }

             drawDebugPaths() {
                const graphics = this.add.graphics({ lineStyle: { width: 2, color: 0xff00ff, alpha: 0.5 } }); // Magenta
                const graphicsEnemy = this.add.graphics({ lineStyle: { width: 2, color: 0x00ffff, alpha: 0.5 } }); // Cyan

                 const drawPath = (path, graph) => {
                     if (!path || path.length === 0) return;
                     graph.beginPath();
                     graph.moveTo(path[0].x, path[0].y);
                     for (let i = 1; i < path.length; i++) {
                         graph.lineTo(path[i].x, path[i].y);
                     }
                     graph.strokePath();
                     // Draw waypoint circles
                     path.forEach(wp => graph.strokeCircle(wp.x, wp.y, 5));
                 };

                 drawPath(this.paths.playerTop, graphics);
                 drawPath(this.paths.playerBottom, graphics);
                 drawPath(this.paths.enemyTop, graphicsEnemy);
                 drawPath(this.paths.enemyBottom, graphicsEnemy);
            }


            setupTimers() {
                // Clear existing timers if they somehow weren't cleared by shutdown
                // This provides an extra layer of safety, but shutdown is the main place.
                 if (this.playerSpawnTimer) this.playerSpawnTimer.remove();
                 if (this.enemySpawnTimer) this.enemySpawnTimer.remove();
                 if (this.resourceTimer) this.resourceTimer.remove();

                 // Auto Spawn Timers
                this.playerSpawnTimer = this.time.addEvent({
                    delay: CONFIG.AUTO_SPAWN_INTERVAL_PLAYER,
                    callback: () => this.spawnUnit('player', false), // Auto spawn
                    callbackScope: this,
                    loop: true
                });
                this.enemySpawnTimer = this.time.addEvent({
                    delay: CONFIG.AUTO_SPAWN_INTERVAL_ENEMY,
                    callback: () => this.spawnUnit('enemy', false), // Auto spawn
                    callbackScope: this,
                    loop: true
                });

                // Resource Gain Timer
                this.resourceTimer = this.time.addEvent({
                    delay: CONFIG.RESOURCE_GAIN_INTERVAL,
                    callback: () => {
                        if (!this.gameOver) {
                            this.playerResources += CONFIG.RESOURCE_GAIN_AMOUNT;
                            this.updateStatusDisplay();
                        }
                    },
                    callbackScope: this,
                    loop: true
                });
            }


            spawnUnit(team, isManual = false) {
                 if (this.gameOver) return;

                 const base = (team === 'player') ? this.playerBase : this.enemyBase;
                 const color = (team === 'player') ? CONFIG.PLAYER_COLOR : CONFIG.ENEMY_COLOR;
                 const unitGroup = (team === 'player') ? this.playerUnits : this.enemyUnits;

                 // Spawn position slightly outside base
                 const spawnX = (team === 'player')
                    ? base.x + base.getBodyWidth() / 2 + CONFIG.UNIT_SIZE
                    : base.x - base.getBodyWidth() / 2 - CONFIG.UNIT_SIZE;
                // Randomize Y spawn position within base height
                 const spawnY = base.y - base.getBodyHeight() / 2 + CONFIG.UNIT_SIZE / 2 + Math.random() * (base.getBodyHeight() - CONFIG.UNIT_SIZE);


                 let canSpawn = true;
                 if (team === 'player' && isManual) {
                    if (this.playerResources >= CONFIG.PLAYER_MANUAL_SPAWN_COST) {
                        this.playerResources -= CONFIG.PLAYER_MANUAL_SPAWN_COST;
                    } else {
                        canSpawn = false;
                         // Optional: Add feedback like flashing the button or a sound effect
                    }
                 }

                 if (canSpawn) {
                    // Determine path
                    let chosenPath;
                     if (spawnY < CONFIG.GAME_HEIGHT / 2) {
                         chosenPath = (team === 'player') ? [...this.paths.playerTop] : [...this.paths.enemyTop]; // Use spread to pass a copy
                     } else {
                         chosenPath = (team === 'player') ? [...this.paths.playerBottom] : [...this.paths.enemyBottom];
                     }

                    // Create the unit using the group's create method
                    const unit = unitGroup.create(spawnX, spawnY, color, team, chosenPath);
                     if (unit) {
                        // Unit constructor already handles adding to scene/physics
                     }
                 }

                 this.updateStatusDisplay();
            }

             spawnPlayerUnit(isManual = true) { // Specific function for button click
                 this.spawnUnit('player', isManual);
             }


            update(time, delta) {
                 if (this.gameOver) return;

                // Manual update call for all active units
                 this.playerUnits.getChildren().forEach(unit => {
                    if (unit.active) {
                         unit.updateUnit(time, delta, this.enemyUnits, this.enemyBase);
                    }
                 });
                 this.enemyUnits.getChildren().forEach(unit => {
                     if (unit.active) {
                        unit.updateUnit(time, delta, this.playerUnits, this.playerBase);
                     }
                 });

                 // Unit cleanup is handled by the unit's die() method using destroy()
            }

             updateStatusDisplay() {
                 if (this.gameOver) return;

                 const playerCount = this.playerUnits ? this.playerUnits.countActive(true) : 0;
                 const enemyCount = this.enemyUnits ? this.enemyUnits.countActive(true) : 0;
                 this.statusText.textContent = `Resources: ${this.playerResources} | Player: ${playerCount} | Enemy: ${enemyCount}`;

                 const canAfford = this.playerResources >= CONFIG.PLAYER_MANUAL_SPAWN_COST;
                 this.spawnButton.disabled = !canAfford;
                 this.spawnButton.textContent = `Spawn Unit (Cost: ${CONFIG.PLAYER_MANUAL_SPAWN_COST})`;
                 // Style button if cannot afford
                 this.spawnButton.style.backgroundColor = canAfford ? '#3498db' : '#ff9800'; // Blue or Orange
             }


            triggerGameOver(winnerTeam) {
                if (this.gameOver) return; // Prevent multiple triggers

                this.gameOver = true;
                this.winner = winnerTeam;

                 // Stop physics, pause timers
                 this.physics.pause();
                 if (this.playerSpawnTimer) this.playerSpawnTimer.paused = true;
                 if (this.enemySpawnTimer) this.enemySpawnTimer.paused = true;
                 if (this.resourceTimer) this.resourceTimer.paused = true;


                 // Show Game Over Overlay
                 this.gameOverText.textContent = (winnerTeam === 'player') ? 'Player Wins!' : 'Enemy Wins!';
                 this.gameOverOverlay.classList.add('visible');


                 // Disable spawn button
                 this.spawnButton.disabled = true;
                 this.spawnButton.style.backgroundColor = '#95a5a6'; // Greyed out
            }

            restartGame() {
                 console.log("Restarting game...");
                 // No need to manually reset these here; `create()` will handle it
                 // and `shutdown()` cleans up the old state.
                 // this.gameOver = false;
                 // this.winner = null;
                 // this.playerResources = CONFIG.STARTING_RESOURCES;


                // Hide overlay
                 this.gameOverOverlay.classList.remove('visible');


                // Restart the current scene
                 this.scene.restart();
             }
        }

        // --- Phaser Game Configuration ---
        const phaserConfig = {
            type: Phaser.AUTO, // AUTO tries WebGL first, then falls back to Canvas
            width: CONFIG.GAME_WIDTH,
            height: CONFIG.GAME_HEIGHT,
            parent: 'game-container', // ID of the div to contain the canvas
            physics: {
                default: 'arcade',
                arcade: {
                    //debug: true, // Set true to see physics bodies and velocity vectors
                    gravity: { y: 0 } // Top-down game, no gravity needed
                }
            },
            scene: [GameScene] // Add the scene to the game
        };

        // --- Initialize Phaser ---
         // Ensure DOM is ready before creating game
         window.onload = () => {
             gameInstance = new Phaser.Game(phaserConfig);

             // Expose reset function globally for button if needed (alternative to scene reference)
             // window.restartGame = () => {
             //     if (gameScene) gameScene.restartGame();
             // }
         };

    </script>

</body>
