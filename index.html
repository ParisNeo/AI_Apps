<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraftorApps Zoo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex flex-col items-center py-8">
    <h1 class="text-4xl md:text-5xl font-bold mb-8 text-cyan-400 animate-fade-in">
        WebCraftorApps Zoo
    </h1>

    <div id="app-container" class="container mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl">
        <!-- Apps will be dynamically inserted here -->
    </div>

    <button onclick="shuffleApps()" class="mt-8 px-6 py-3 bg-cyan-500 text-gray-900 rounded-lg hover:bg-cyan-600 transition-colors duration-300 font-semibold">
        Shuffle Apps
    </button>

    <script>
        const apps = [
            {
                name: "Chess Game",
                path: "chess_game/index.html",
                icon: "chess_game/icon.png",
                description: "A classic strategy board game where two players compete to checkmate their opponent's king."
            },
            {
                name: "Todo App Projects",
                path: "todo_app/index.html",
                icon: "todo_app/icon.png",
                description: "A comprehensive task management system with project organization features."
            },
            {
                name: "Simple Todo App",
                path: "simple_todo_app/index.html",
                icon: "simple_todo_app/icon.png",
                description: "A minimalist todo list application for quick task tracking."
            },
            {
                name: "Weight Tracking App",
                path: "weight_tracking_app/index.html",
                icon: "weight_tracking_app/icon.png",
                description: "Monitor and track your weight progress with charts and statistics."
            },
            {
                name: "Snake Game",
                path: "snake_game/index.html",
                icon: "snake_game/icon.png",
                description: "The classic arcade game where you guide a growing snake to eat food."
            },
            {
                name: "Tensorflow Video Segmentation",
                path: "tensorflow_js_segmentation/index.html",
                icon: "tensorflow_js_segmentation/icon.png",
                description: "Advanced video processing using TensorFlow.js (local execution required).",
                isDownload: true
            },
            {
                name: "Baby Caring App",
                path: "baby_caring_app/index.html",
                icon: "baby_caring_app/icon.png",
                description: "Track feeding, sleeping, and diaper changes for infant care."
            },
            {
                name: "Level App",
                path: "level_app/index.html",
                icon: "level_app/icon.png",
                description: "A mobile-only tool for measuring surface levels using device sensors."
            },
            {
                name: "LoLLMS UI",
                path: "lollms_chat/index.html",
                icon: "lollms_chat/icon.png",
                description: "User interface for interacting with Large Language Model systems."
            },
            {
                name: "PillPal",
                path: "PillPal/index.html",
                icon: "PillPal/icon.png",
                description: "Medication management app with reminders and dosage tracking."
            },
            {
                name: "Weight Watcher App",
                path: "Weight_Watcher_App/index.html",
                icon: "Weight_Watcher_App/icon.png",
                description: "A detailed weight management tool with diet and exercise tracking."
            }
        ];

        function createAppCard(app) {
            const card = document.createElement('div');
            card.className = 'bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transform hover:-translate-y-2 transition-all duration-300';
            
            card.innerHTML = `
                <div class="relative overflow-hidden">
                    <img src="${app.icon}" alt="${app.name}" class="w-full h-48 object-cover transform hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-black bg-opacity-0 hover:bg-opacity-40 transition-opacity duration-300 flex items-center justify-center opacity-0 hover:opacity-100">
                        <p class="text-white text-sm text-center px-4">${app.description}</p>
                    </div>
                </div>
                <div class="p-4 text-center">
                    <a href="${app.isDownload ? 'javascript:void(0)' : app.path}" 
                       onclick="${app.isDownload ? `downloadFile('${app.path}')` : ''}"
                       class="text-cyan-400 hover:text-cyan-300 font-semibold text-lg">
                        ${app.name}${app.isDownload ? ' (Local Only)' : ''}
                    </a>
                </div>
            `;
            return card;
        }

        function renderApps() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            apps.forEach(app => container.appendChild(createAppCard(app)));
        }

        function shuffleApps() {
            for (let i = apps.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [apps[i], apps[j]] = [apps[j], apps[i]];
            }
            renderApps();
        }

        function downloadFile(filePath) {
            const link = document.createElement('a');
            link.href = filePath;
            link.download = filePath.split('/').pop();
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initial render
        renderApps();

        // Add fade-in animation via Tailwind
        document.querySelectorAll('.animate-fade-in').forEach(el => {
            el.classList.add('opacity-0');
            setTimeout(() => {
                el.classList.remove('opacity-0');
                el.classList.add('opacity-100');
            }, 100);
        });
    </script>
</body>
</html>
