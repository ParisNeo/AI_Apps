<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Rubik's 3D - Pro Solver</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(45deg, #1a001a, #330033, #4d004d);
            color: #00ff00; /* Neon green */
            overflow-y: auto; /* Allow scrolling for more controls */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            min-height: 100vh;
            padding-top: 10px;
            padding-bottom: 20px; /* Space for controls at bottom */
        }

        #gameContainer {
            width: 80vw;
            max-width: 600px;
            height: 55vh; /* Adjusted height */
            max-height: 450px;
            border: 5px solid #ff00ff; 
            box-shadow: 0 0 20px #ff00ff, inset 0 0 15px #ff00ffaa;
            background-color: #0a000a; 
            position: relative;
            margin-bottom:15px;
        }

        #canvas {
            display: block; 
        }
        
        .controls-panel {
            background-color: rgba(20, 0, 20, 0.85);
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #00ffff; 
            box-shadow: 0 0 15px #00ffff;
            margin-top: 10px;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        .controls-panel h2, .controls-panel h3 {
            margin-top: 0;
            color: #ffff00; 
            font-size: 1.2em;
            text-shadow: 0 0 5px #ffff00;
        }
        .controls-panel h3 {
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .button-group {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            background-color: #333;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 8px 12px; /* Slightly smaller */
            margin: 4px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px #00ff0077;
            font-size: 0.75em; /* Smaller font for more buttons */
        }

        button:hover:not(:disabled) {
            background-color: #00ff00;
            color: #111;
            box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        }
        
        button:active:not(:disabled) {
            transform: translateY(2px);
        }
        
        button:disabled {
            background-color: #222;
            color: #555;
            border-color: #444;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.active-mode {
            background-color: #00cc00;
            color: #000;
            border-color: #ffff00;
            box-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
        }
        
        #messageArea {
            margin-top: 10px;
            padding: 8px;
            background-color: rgba(0,0,0,0.6);
            border: 1px dashed #00ffff;
            min-height: 18px;
            font-size: 0.75em;
            color: #00ffff; 
        }

        #learnInstructions {
            font-size: 0.7em;
            color: #ff00ff; 
            width:100%; text-align:center; margin-bottom:5px;
        }

        #timerDisplay {
            font-size: 1em;
            color: #ffff00;
            margin: 5px 0 10px 0;
            text-shadow: 0 0 3px #ffff00;
        }
        
        #highScoresArea {
            margin-top:15px;
            padding: 10px;
            background-color: rgba(0,0,0,0.4);
            border: 1px solid #ff00ff;
            border-radius: 5px;
        }
        #highScoresArea h3 {
            color: #ff00ff;
            font-size: 0.8em;
            margin-bottom: 8px;
        }
        #highScoresList {
            list-style-type: decimal;
            padding-left: 25px;
            font-size: 0.7em;
            color: #00ffaa;
            text-align: left;
        }
        #highScoresList li {
            margin-bottom: 3px;
        }

    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls-panel">
        <h2>Retro Rubik's 3D</h2>
        
        <div class="button-group" id="modeButtons">
            <button id="playModeBtn">Play Mode</button>
            <button id="aiModeBtn">AI Mode</button>
            <button id="learnModeBtn">Learn Mode</button>
        </div>

        <div id="timerDisplay">Time: 0.00s</div>

        <div class="button-group" id="actionButtons">
            <button id="scrambleBtn">Scramble</button>
            <button id="startSolveBtn" style="display:none;">Start Solving!</button>
            <button id="resetBtn">Reset Cube</button>
        </div>
        
        <div id="messageArea">Welcome! Select a mode.</div>

        <div class="button-group" id="moveButtonsContainer" style="display:none;">
            <p id="learnInstructions" style="display:none;">Click to see move animation:</p>
            <button class="moveBtn" data-move="F">F</button> <button class="moveBtn" data-move="F'">F'</button>
            <button class="moveBtn" data-move="B">B</button> <button class="moveBtn" data-move="B'">B'</button>
            <button class="moveBtn" data-move="U">U</button> <button class="moveBtn" data-move="U'">U'</button>
            <button class="moveBtn" data-move="D">D</button> <button class="moveBtn" data-move="D'">D'</button>
            <button class="moveBtn" data-move="R">R</button> <button class="moveBtn" data-move="R'">R'</button>
            <button class="moveBtn" data-move="L">L</button> <button class="moveBtn" data-move="L'">L'</button>
        </div>
        
        <div id="highScoresArea">
            <h3>High Scores (Top 5):</h3>
            <ol id="highScoresList"></ol>
        </div>
    </div>

    <script>
        const CUBE_SIZE = 3; 
        const CUBIE_SIZE = 1;
        const CUBIE_SPACING = 0.05; 
        const EFFECTIVE_CUBIE_SIZE = CUBIE_SIZE + CUBIE_SPACING;

        const COLORS = {
            FRONT:  0xff0000, BACK:   0xffa500, UP:     0xffffff, 
            DOWN:   0xffff00, RIGHT:  0x0000ff, LEFT:   0x00ff00, 
            INTERNAL: 0x333333 
        };

        let scene, camera, renderer, controls;
        let cubies = [];
        let pivot; 
        let isAnimating = false;
        let currentMode = 'play'; 
        let playModeState = 'IDLE'; // IDLE, SCRAMBLED, SOLVING

        const messageArea = document.getElementById('messageArea');
        const moveButtonsContainer = document.getElementById('moveButtonsContainer');
        const learnInstructions = document.getElementById('learnInstructions');
        
        const playModeBtn = document.getElementById('playModeBtn');
        const aiModeBtn = document.getElementById('aiModeBtn');
        const learnModeBtn = document.getElementById('learnModeBtn');
        const modeButtons = [playModeBtn, aiModeBtn, learnModeBtn];

        const scrambleBtn = document.getElementById('scrambleBtn');
        const startSolveBtn = document.getElementById('startSolveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const allMoveButtons = document.querySelectorAll('.moveBtn');

        // Timer variables
        const timerDisplay = document.getElementById('timerDisplay');
        let timerInterval;
        let startTime;
        let elapsedTime = 0;

        // High score variables
        const highScoresList = document.getElementById('highScoresList');
        let highScores = [];
        const MAX_HIGH_SCORES = 5;


        init();
        animate();

        function init() {
            const container = document.getElementById('gameContainer');
            const canvasEl = document.getElementById('canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a000a); 

            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(CUBE_SIZE * EFFECTIVE_CUBIE_SIZE * 1.8, CUBE_SIZE * EFFECTIVE_CUBIE_SIZE * 1.8, CUBE_SIZE * EFFECTIVE_CUBIE_SIZE * 2.5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            
            const ambientLight = new THREE.AmbientLight(0xcccccc, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
            directionalLight.position.set(1, 1.5, 1).normalize();
            scene.add(directionalLight);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;
            controls.screenSpacePanning = false;
            controls.minDistance = CUBE_SIZE * EFFECTIVE_CUBIE_SIZE * 1.5;
            controls.maxDistance = CUBE_SIZE * EFFECTIVE_CUBIE_SIZE * 5;
            controls.target.set(0,0,0); 

            pivot = new THREE.Object3D();
            scene.add(pivot);

            createRubiksCube();
            setupEventListeners();
            loadHighScores();
            displayHighScores();
            updateModeUI(); // Initial UI setup
        }

        function createRubiksCube() {
            cubies.forEach(cubie => scene.remove(cubie));
            cubies = [];
            const geometry = new THREE.BoxGeometry(CUBIE_SIZE, CUBIE_SIZE, CUBIE_SIZE);
            const offset = (CUBE_SIZE - 1) / 2 * EFFECTIVE_CUBIE_SIZE; 

            for (let x = 0; x < CUBE_SIZE; x++) {
                for (let y = 0; y < CUBE_SIZE; y++) {
                    for (let z = 0; z < CUBE_SIZE; z++) {
                        if (CUBE_SIZE > 2 && x > 0 && x < CUBE_SIZE - 1 && y > 0 && y < CUBE_SIZE - 1 && z > 0 && z < CUBE_SIZE - 1) {
                            continue;
                        }
                        const materials = [
                            new THREE.MeshStandardMaterial({ color: (x === CUBE_SIZE - 1) ? COLORS.RIGHT : COLORS.INTERNAL, roughness: 0.3, metalness: 0.1 }),
                            new THREE.MeshStandardMaterial({ color: (x === 0) ? COLORS.LEFT : COLORS.INTERNAL, roughness: 0.3, metalness: 0.1 }),      
                            new THREE.MeshStandardMaterial({ color: (y === CUBE_SIZE - 1) ? COLORS.UP : COLORS.INTERNAL, roughness: 0.3, metalness: 0.1 }),    
                            new THREE.MeshStandardMaterial({ color: (y === 0) ? COLORS.DOWN : COLORS.INTERNAL, roughness: 0.3, metalness: 0.1 }),  
                            new THREE.MeshStandardMaterial({ color: (z === CUBE_SIZE - 1) ? COLORS.FRONT : COLORS.INTERNAL, roughness: 0.3, metalness: 0.1 }), 
                            new THREE.MeshStandardMaterial({ color: (z === 0) ? COLORS.BACK : COLORS.INTERNAL, roughness: 0.3, metalness: 0.1 })   
                        ];
                        
                        const cubie = new THREE.Mesh(geometry, materials);
                        const posX = x * EFFECTIVE_CUBIE_SIZE - offset;
                        const posY = y * EFFECTIVE_CUBIE_SIZE - offset;
                        const posZ = z * EFFECTIVE_CUBIE_SIZE - offset;
                        cubie.position.set(posX, posY, posZ);
                        
                        // Store initial logical position and world position for solve check
                        cubie.userData.initialLogicX = x;
                        cubie.userData.initialLogicY = y;
                        cubie.userData.initialLogicZ = z;
                        cubie.userData.initialWorldPos = new THREE.Vector3(posX, posY, posZ);
                        cubie.userData.initialQuaternion = cubie.quaternion.clone(); // Store initial orientation
                        
                        cubies.push(cubie);
                        scene.add(cubie);
                    }
                }
            }
        }

        function setupEventListeners() {
            window.addEventListener('resize', onWindowResize, false);

            playModeBtn.addEventListener('click', () => setMode('play'));
            aiModeBtn.addEventListener('click', () => setMode('ai'));
            learnModeBtn.addEventListener('click', () => setMode('learn'));

            scrambleBtn.addEventListener('click', scrambleCube);
            startSolveBtn.addEventListener('click', handleStartSolving);
            resetBtn.addEventListener('click', resetCube);

            allMoveButtons.forEach(button => {
                button.addEventListener('click', () => {
                    if (isAnimating || (currentMode === 'play' && playModeState !== 'SOLVING')) return;
                    const move = button.dataset.move;
                    performMove(move, () => {
                        if (currentMode === 'play' && playModeState === 'SOLVING') {
                            checkIfSolved();
                        }
                    });
                    if (currentMode === 'learn') {
                         messageArea.textContent = `Performing move: ${move}`;
                    }
                });
            });
        }
        
        function setMode(mode) {
            currentMode = mode;
            resetCube(); // Reset cube and game state on mode switch
            updateModeUI();
            messageArea.textContent = `Switched to ${mode.charAt(0).toUpperCase() + mode.slice(1)} Mode.`;
            if (mode === 'ai') {
                messageArea.textContent += " AI will make some moves...";
                setTimeout(aiPlay, 1000); 
            }
        }

        function updateModeUI() {
            modeButtons.forEach(btn => btn.classList.remove('active-mode'));
            allMoveButtons.forEach(btn => btn.disabled = true); // Disable all moves by default
            scrambleBtn.disabled = false;
            startSolveBtn.style.display = 'none';
            learnInstructions.style.display = 'none';
            moveButtonsContainer.style.display = 'none';
            controls.enabled = true;


            if (currentMode === 'play') {
                playModeBtn.classList.add('active-mode');
                moveButtonsContainer.style.display = 'flex'; // Use flex for button group
                
                if (playModeState === 'IDLE') {
                    scrambleBtn.disabled = false;
                    startSolveBtn.style.display = 'none';
                    allMoveButtons.forEach(btn => btn.disabled = true);
                } else if (playModeState === 'SCRAMBLED') {
                    scrambleBtn.disabled = true;
                    startSolveBtn.style.display = 'inline-block';
                    startSolveBtn.disabled = false;
                    allMoveButtons.forEach(btn => btn.disabled = true);
                } else if (playModeState === 'SOLVING') {
                    scrambleBtn.disabled = true;
                    startSolveBtn.style.display = 'inline-block'; // Keep it visible but disabled
                    startSolveBtn.disabled = true;
                    allMoveButtons.forEach(btn => btn.disabled = false);
                    modeButtons.forEach(btn => btn.disabled = true); // Disable mode switching while solving
                }

            } else if (currentMode === 'ai') {
                aiModeBtn.classList.add('active-mode');
                // AI mode doesn't use Start Solve or player moves
                scrambleBtn.disabled = false; // AI can scramble too
            } else if (currentMode === 'learn') {
                learnModeBtn.classList.add('active-mode');
                moveButtonsContainer.style.display = 'flex';
                learnInstructions.style.display = 'block';
                allMoveButtons.forEach(btn => btn.disabled = false);
            }
        }

        function onWindowResize() {
            const container = document.getElementById('gameContainer');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        
        function getCubiesInLayer(axis, layerIndex) {
            const layerCubies = [];
            const centerOffset = (CUBE_SIZE - 1) / 2;
            const targetPos = (layerIndex - centerOffset) * EFFECTIVE_CUBIE_SIZE;
            
            cubies.forEach(cubie => {
                let cubiePosOnAxis;
                if (axis === 'x') cubiePosOnAxis = cubie.position.x;
                else if (axis === 'y') cubiePosOnAxis = cubie.position.y;
                else if (axis === 'z') cubiePosOnAxis = cubie.position.z;

                if (Math.abs(cubiePosOnAxis - targetPos) < EFFECTIVE_CUBIE_SIZE / 2) {
                    layerCubies.push(cubie);
                }
            });
            return layerCubies;
        }

        function rotateLayerAroundAxis(axis, layerIndex, angle, onCompleteCallback) {
            if (isAnimating) return;
            isAnimating = true;
            controls.enabled = false; 

            pivot.rotation.set(0, 0, 0); 
            pivot.position.set(0,0,0); 
            
            const layerCubies = getCubiesInLayer(axis, layerIndex);
            
            if (layerCubies.length === 0) {
                isAnimating = false;
                controls.enabled = true;
                if (onCompleteCallback) onCompleteCallback();
                return;
            }

            layerCubies.forEach(cubie => pivot.attach(cubie));
            
            let currentAngle = 0;
            const targetAngle = angle;
            const animationSpeed = 0.12; // Slightly faster

            function animateRotation() {
                let deltaAngle = targetAngle * animationSpeed;
                if (Math.abs(currentAngle + deltaAngle) >= Math.abs(targetAngle)) {
                    deltaAngle = targetAngle - currentAngle; 
                }
                
                if (axis === 'x') pivot.rotation.x += deltaAngle;
                else if (axis === 'y') pivot.rotation.y += deltaAngle;
                else if (axis === 'z') pivot.rotation.z += deltaAngle;
                
                currentAngle += deltaAngle;

                if (Math.abs(currentAngle - targetAngle) < 0.001) { 
                    if (axis === 'x') pivot.rotation.x = targetAngle;
                    else if (axis === 'y') pivot.rotation.y = targetAngle;
                    else if (axis === 'z') pivot.rotation.z = targetAngle;

                    [...layerCubies].forEach(cubie => scene.attach(cubie));
                    
                    cubies.forEach(c => {
                        c.position.x = Math.round(c.position.x / EFFECTIVE_CUBIE_SIZE) * EFFECTIVE_CUBIE_SIZE;
                        c.position.y = Math.round(c.position.y / EFFECTIVE_CUBIE_SIZE) * EFFECTIVE_CUBIE_SIZE;
                        c.position.z = Math.round(c.position.z / EFFECTIVE_CUBIE_SIZE) * EFFECTIVE_CUBIE_SIZE;
                        
                        // Normalize quaternion to avoid drift if needed, though attach should handle it.
                        // c.quaternion.normalize(); 
                    });

                    isAnimating = false;
                    controls.enabled = true; 
                    
                    if (currentMode === 'ai' && aiMoveQueue.length > 0 && !isSolved()) { // AI continues if not solved
                        aiPlayTimeoutId = setTimeout(aiPlay, 150); 
                    }
                    if (onCompleteCallback) onCompleteCallback();

                } else {
                    requestAnimationFrame(animateRotation);
                }
            }
            animateRotation();
        }

        function performMove(moveNotation, onCompleteCallback) {
            if (isAnimating) return;
            const PI_2 = Math.PI / 2;
            let axis, layer, direction;

            switch (moveNotation) {
                case 'F':  axis = 'z'; layer = CUBE_SIZE - 1; direction = -1; break; 
                case 'F\'': axis = 'z'; layer = CUBE_SIZE - 1; direction = 1;  break; 
                case 'B':  axis = 'z'; layer = 0; direction = 1;  break; 
                case 'B\'': axis = 'z'; layer = 0; direction = -1; break;
                case 'U':  axis = 'y'; layer = CUBE_SIZE - 1; direction = -1; break; 
                case 'U\'': axis = 'y'; layer = CUBE_SIZE - 1; direction = 1;  break;
                case 'D':  axis = 'y'; layer = 0; direction = 1;  break; 
                case 'D\'': axis = 'y'; layer = 0; direction = -1; break;
                case 'R':  axis = 'x'; layer = CUBE_SIZE - 1; direction = -1; break; 
                case 'R\'': axis = 'x'; layer = CUBE_SIZE - 1; direction = 1;  break;
                case 'L':  axis = 'x'; layer = 0; direction = 1;  break; 
                case 'L\'': axis = 'x'; layer = 0; direction = -1; break;
                default: console.warn("Unknown move:", moveNotation); if (onCompleteCallback) onCompleteCallback(); return;
            }
            rotateLayerAroundAxis(axis, layer, direction * PI_2, onCompleteCallback);
        }

        function scrambleCube() {
            if (isAnimating) return;
            messageArea.textContent = "Scrambling...";
            playModeState = 'IDLE'; // Ensure clean state before scramble
            resetCubeVisuals(); // Resets visuals but not timer/state for scramble itself
            
            const moves = ['F', 'F\'', 'B', 'B\'', 'U', 'U\'', 'D', 'D\'', 'R', 'R\'', 'L', 'L\''];
            const numScrambleMoves = 20 + Math.floor(Math.random() * 10); 
            let moveCount = 0;
            let lastMove = '';
            let secondLastMove = '';

            function applyRandomMove() {
                if (moveCount >= numScrambleMoves) {
                    isAnimating = false; // Ensure flag is cleared
                     messageArea.textContent = "Cube scrambled! Press 'Start Solving' in Play Mode.";
                     if (currentMode === 'play') {
                        playModeState = 'SCRAMBLED';
                     }
                     updateModeUI();
                    return;
                }
                
                let randomMove;
                // Avoid redundant moves like F F' or F F F (F')
                do {
                    randomMove = moves[Math.floor(Math.random() * moves.length)];
                } while (randomMove === lastMove || (randomMove[0] === lastMove[0] && randomMove[0] === secondLastMove[0]));

                secondLastMove = lastMove;
                lastMove = randomMove;

                performMove(randomMove, () => { // Pass callback to continue scrambling
                    moveCount++;
                    // The setTimeout is now implicitly handled by the animation ending and calling applyRandomMove
                    // if the performMove -> rotateLayerAroundAxis structure calls its onComplete
                    // However, for sequential non-overlapping calls, a slight delay helps.
                    setTimeout(applyRandomMove, 50); // Short delay for visual separation
                });
            }
            isAnimating = true; // Set animating true for the whole scramble sequence
            applyRandomMove();
        }

        function resetCubeVisuals() {
            createRubiksCube(); // Recreates the cube in its solved state
            controls.reset(); 
            camera.position.set(CUBE_SIZE * EFFECTIVE_CUBIE_SIZE * 1.8, CUBE_SIZE * EFFECTIVE_CUBIE_SIZE * 1.8, CUBE_SIZE * EFFECTIVE_CUBIE_SIZE * 2.5);
            camera.lookAt(0,0,0);
            controls.target.set(0,0,0);
        }

        function resetCube() {
            if (isAnimating && playModeState !== 'SOLVING') { // Allow reset if solved and animation is victory
                 return;
            }
            clearTimeout(aiPlayTimeoutId);
            aiMoveQueue = [];
            stopTimer();
            elapsedTime = 0;
            updateTimerDisplay();
            
            resetCubeVisuals();

            playModeState = 'IDLE';
            messageArea.textContent = "Cube reset. Select mode or scramble.";
            modeButtons.forEach(btn => btn.disabled = false); // Re-enable mode buttons
            updateModeUI();
        }

        function handleStartSolving() {
            if (currentMode !== 'play' || playModeState !== 'SCRAMBLED') return;
            playModeState = 'SOLVING';
            messageArea.textContent = "Timer started! Solve the cube!";
            startTimer();
            updateModeUI();
        }

        // --- Timer Functions ---
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            startTime = Date.now() - (elapsedTime * 1000); // Resume from paused time if any
            timerInterval = setInterval(() => {
                elapsedTime = (Date.now() - startTime) / 1000;
                updateTimerDisplay();
            }, 100); // Update display 10 times/sec for smoother ms
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = `Time: ${elapsedTime.toFixed(2)}s`;
        }

        // --- Solve Detection ---
        function isSolved() {
            const epsilon = 0.01; // For float comparisons
            const identityQuaternion = new THREE.Quaternion(); // (0,0,0,1)

            for (const cubie of cubies) {
                // 1. Check if cubie is in its original slot
                const expectedPos = cubie.userData.initialWorldPos;
                if (cubie.position.distanceTo(expectedPos) > epsilon) {
                    // console.log("Cubie wrong position:", cubie.userData, cubie.position, expectedPos);
                    return false;
                }

                // 2. Check if cubie's orientation is its original orientation
                // Comparing quaternions for equality is tricky due to q and -q representing the same rotation.
                // A simple dot product check: q1.dot(q2) should be close to 1 or -1.
                // Or, check if cubie.quaternion is close to its initialQuaternion
                const dotProduct = cubie.quaternion.dot(cubie.userData.initialQuaternion);
                if (Math.abs(Math.abs(dotProduct) - 1.0) > epsilon) {
                    // console.log("Cubie wrong orientation:", cubie.userData, cubie.quaternion, cubie.userData.initialQuaternion, dotProduct);
                    return false; 
                }
            }
            return true;
        }

        function checkIfSolved() {
            if (isSolved()) {
                stopTimer();
                playModeState = 'IDLE'; // Or a 'SOLVED' state then to 'IDLE'
                messageArea.textContent = `CONGRATULATIONS! Solved in ${elapsedTime.toFixed(2)}s!`;
                addHighScore(elapsedTime);
                modeButtons.forEach(btn => btn.disabled = false); // Re-enable mode buttons
                updateModeUI(); // This will disable move buttons, enable scramble
                // Could add a little victory animation/effect here
            }
        }

        // --- High Score Functions ---
        function loadHighScores() {
            const storedScores = localStorage.getItem('retroRubiksHighScores');
            if (storedScores) {
                highScores = JSON.parse(storedScores);
            }
        }

        function saveHighScores() {
            localStorage.setItem('retroRubiksHighScores', JSON.stringify(highScores));
        }

        function addHighScore(time) {
            const score = { time: parseFloat(time.toFixed(2)) }; // No name for simplicity
            highScores.push(score);
            highScores.sort((a, b) => a.time - b.time); // Sort ascending
            highScores = highScores.slice(0, MAX_HIGH_SCORES); // Keep only top N
            saveHighScores();
            displayHighScores();
        }

        function displayHighScores() {
            highScoresList.innerHTML = ''; // Clear previous list
            if (highScores.length === 0) {
                const li = document.createElement('li');
                li.textContent = "No scores yet. Be the first!";
                highScoresList.appendChild(li);
            } else {
                highScores.forEach((score, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${score.time.toFixed(2)}s`;
                    highScoresList.appendChild(li);
                });
            }
        }

        // --- AI Mode ---
        let aiMoveQueue = [];
        let aiPlayTimeoutId;

        function aiPlay() {
            if (currentMode !== 'ai' || isAnimating || isSolved()) {
                if (isSolved() && currentMode === 'ai') messageArea.textContent = "AI solved it conceptually!";
                return;
            }

            if (aiMoveQueue.length === 0) {
                const moves = ['F', 'R', 'U', 'B', 'L', 'D', 'F\'', 'R\'', 'U\'', 'B\'', 'L\'', 'D\''];
                const numAiMoves = 3 + Math.floor(Math.random() * 4); 
                for (let i = 0; i < numAiMoves; i++) {
                    aiMoveQueue.push(moves[Math.floor(Math.random() * moves.length)]);
                }
                if (numAiMoves > 0) messageArea.textContent = "AI is 'playing' with " + numAiMoves + " moves.";
            }

            if (aiMoveQueue.length > 0) {
                const move = aiMoveQueue.shift();
                // messageArea.textContent = `AI performs: ${move}`; // Can be too chatty
                performMove(move, () => {
                    if (currentMode === 'ai' && aiMoveQueue.length === 0 && !isSolved()) {
                         messageArea.textContent = "AI finished its sequence.";
                    }
                    // The animation complete callback in rotateLayerAroundAxis will call aiPlay again if needed
                }); 
            } else if (!isSolved()) { // Only show if not solved by the sequence
                 messageArea.textContent = "AI finished its sequence. Scramble or Reset.";
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

    </script></body>
</html>
