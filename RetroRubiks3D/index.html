<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(45deg, #1a001a, #330033, #4d004d);
            color: #00ff00;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-top: 10px;
            padding-bottom: 20px;
        }

        .view {
            width: 95%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #mainMenuView,
        #creditsView {
            text-align: center;
            padding: 20px;
            background-color: rgba(20, 0, 20, 0.9);
            border: 3px solid #00ffff;
            box-shadow: 0 0 15px #00ffff;
            border-radius: 10px;
            margin-top: 5vh;
        }

        #mainMenuView h1,
        #creditsView h1 {
            color: #ffff00;
            text-shadow: 0 0 8px #ffff00;
            margin-bottom: 20px;
        }

        .menu-button-group button {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 10px auto;
            font-size: 1em;
            padding: 12px 15px;
        }

        #gameContainer {
            width: 80vw;
            max-width: 600px;
            height: 55vh;
            max-height: 450px;
            border: 5px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff, inset 0 0 15px #ff00ffaa;
            background-color: #0a000a;
            position: relative;
            margin-bottom: 15px;
        }

        #canvas {
            display: block;
        }

        .controls-panel {
            background-color: rgba(20, 0, 20, 0.85);
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #00ffff;
            box-shadow: 0 0 15px #00ffff;
            margin-top: 10px;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        .controls-panel h2,
        .controls-panel h3 {
            margin-top: 0;
            color: #ffff00;
            font-size: 1.2em;
            text-shadow: 0 0 5px #ffff00;
        }

        .controls-panel h3 {
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .button-group {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            background-color: #333;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 8px 12px;
            margin: 4px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px #00ff0077;
            font-size: 0.75em;
        }

        button:hover:not(:disabled) {
            background-color: #00ff00;
            color: #111;
            box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        }

        button:active:not(:disabled) {
            transform: translateY(2px);
        }

        button:disabled {
            background-color: #222;
            color: #555;
            border-color: #444;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.back-button {
            background-color: #ff3333;
            border-color: #ffaaaa;
            color: #fff;
        }

        button.back-button:hover:not(:disabled) {
            background-color: #cc0000;
            box-shadow: 0 0 10px #ff0000;
        }

        #messageArea {
            margin-top: 10px;
            padding: 8px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px dashed #00ffff;
            min-height: 36px;
            font-size: 0.75em;
            color: #00ffff;
        }

        #learnModeSpecificControls {
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ff00ff;
            border-radius: 5px;
        }

        #learnModeSpecificControls select,
        #learnModeSpecificControls p {
            font-family: 'Press Start 2P', cursive;
            background-color: #222;
            color: #00ffaa;
            border: 1px solid #00ffaa;
            padding: 5px;
            margin: 5px;
            font-size: 0.7em;
        }

        #algorithmDisplay {
            font-size: 0.8em;
            color: #ffff00;
            margin: 5px 0;
            min-height: 1em;
        }

        #timerDisplay {
            font-size: 1em;
            color: #ffff00;
            margin: 5px 0 10px 0;
            text-shadow: 0 0 3px #ffff00;
        }

        #highScoresArea {
            margin-top: 15px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid #ff00ff;
            border-radius: 5px;
        }

        #highScoresArea h3 {
            color: #ff00ff;
            font-size: 0.8em;
            margin-bottom: 8px;
        }

        #highScoresList {
            list-style-type: decimal;
            padding-left: 25px;
            font-size: 0.7em;
            color: #00ffaa;
            text-align: left;
        }

        #highScoresList li {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div id="mainMenuView" class="view">
        <h1>Retro Rubik's 3D</h1>
        <div class="menu-button-group">

                </div>
            </div>
            <div class="button-group" id="moveButtonsContainer" style="margin-top:10px;">
                <button class="moveBtn" data-move="F">F</button><button class="moveBtn" data-move="F'">F'</button><button class="moveBtn" data-move="F2">F2</button>
                <button class="moveBtn" data-move="B">B</button><button class="moveBtn" data-move="B'">B'</button><button class="moveBtn" data-move="B2">B2</button>
                <button class="moveBtn" data-move="U">U</button><button class="moveBtn" data-move="U'">U'</button><button class="moveBtn" data-move="U2">U2</button>
                <button class="moveBtn" data-move="D">D</button><button class="moveBtn" data-move="D'">D'</button><button class="moveBtn" data-move="D2">D2</button>
                <button class="moveBtn" data-move="R">R</button><button class="moveBtn" data-move="R'">R'</button><button class="moveBtn" data-move="R2">R2</button>
                <button class="moveBtn" data-move="L">L</button><button class="moveBtn" data-move="L'">L'</button><button class="moveBtn" data-move="L2">L2</button>
            </div>
            <div id="highScoresArea">
                <h3>High Scores (Player - Top 5):</h3>

            </div>
        </div>
    </div>

    <div id="creditsView" class="view" style="display:none;">
        <h1>Credits</h1>
        <p>Idea Builder: ParisNeo</p>
        <p>Coder: Gemini (Large Language Model by Google)</p>
        <p>Based on classic Rubik's Cube concepts.</p>
        <button id="creditsBackToMenuBtn" class="back-button">Back to Menu</button>
    </div>

    <script>
        const CUBE_SIZE = 3;
        const CUBIE_SIZE = 1;
        const CUBIE_SPACING = 0.05;
        const EFFECTIVE_CUBIE_SIZE = CUBIE_SIZE + CUBIE_SPACING;
        const VISUAL_COLORS = {
            FRONT: 0xff0000, BACK: 0xffa500, UP: 0xffffff,
            DOWN: 0xffff00, RIGHT: 0x0000ff, LEFT: 0x00ff00,
            INTERNAL: 0x333333
        };

        let scene, camera, renderer, controls, pivot;
        let cubies = [];
        let isAnimating = false;
        let sequenceInProgress = false;
        let activeView = 'menu';
        let currentMode = '';
        let playModeState = 'IDLE';
        let aiModeState = 'IDLE';
        let learnModeState = {
            currentLesson: null,
            algorithmMoves: [],
            currentMoveIndex: 0,
            isLessonSetup: false,
            isWatchingAll: false
        };
        let lastScrambleSequence = [];

        const mainMenuView = document.getElementById('mainMenuView');
        const gameView = document.getElementById('gameView');
        const creditsView = document.getElementById('creditsView');
        const gameModeTitle = document.getElementById('gameModeTitle');
        const messageArea = document.getElementById('messageArea');
        const menuPlayBtn = document.getElementById('menuPlayBtn');
        const menuAiBtn = document.getElementById('menuAiBtn');
        const menuLearnBtn = document.getElementById('menuLearnBtn');
        const menuCreditsBtn = document.getElementById('menuCreditsBtn');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const creditsBackToMenuBtn = document.getElementById('creditsBackToMenuBtn');
        const scrambleBtn = document.getElementById('scrambleBtn');
        const startSolveBtn = document.getElementById('startSolveBtn');
        const startAiDemoBtn = document.getElementById('startAiDemoBtn');
        const resetCubeBtn = document.getElementById('resetCubeBtn');
        const allMoveButtons = document.querySelectorAll('.moveBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        let timerInterval, startTime, elapsedTime = 0;
        const highScoresList = document.getElementById('highScoresList');
        let highScores = [];
        const MAX_HIGH_SCORES = 5;
        const learnModeSpecificControls = document.getElementById('learnModeSpecificControls');
        const lessonSelect = document.getElementById('lessonSelect');
        const lessonDescription = document.getElementById('lessonDescription');
        const algorithmDisplay = document.getElementById('algorithmDisplay');
        const setupLessonBtn = document.getElementById('setupLessonBtn');
        const watchAlgorithmBtn = document.getElementById('watchAlgorithmBtn');
        const nextLessonMoveBtn = document.getElementById('nextLessonMoveBtn');
        const lessons = [
            { name: "Beginner: Sexy Move", description: "R U R' U'", initialScramble: [], algorithm: ["R", "U", "R'", "U'"], id: "sexy_move" },
            { name: "Beginner: Sune", description: "R U R' U R U2 R'", initialScramble: ["F", "U'", "R", "U", "R'", "F'", "L", "U'", "L'", "U'", "L", "U2", "L'"], algorithm: ["R", "U", "R'", "U", "R", "U2", "R'"], id: "sune" },
            { name: "Simple Face Turn (F)", description: "F F'", initialScramble: [], algorithm: ["F", "F'"], id: "face_turn_f" }
        ];
        let currentSequenceQueue = [];
        let onCurrentSequenceCompleteCallback = null;

        // --- LOGICAL CUBE STATE AND SOLVER ---
        const LGC_U = 'W', LGC_L = 'G', LGC_F = 'R', LGC_R = 'B', LGC_B = 'O', LGC_D = 'Y'; // Logical Colors
        const LOGICAL_COLORS_MAP = { U: LGC_U, L: LGC_L, F: LGC_F, R: LGC_R, B: LGC_B, D: LGC_D };
        const FACES_ORDER = ['U', 'R', 'F', 'D', 'L', 'B']; // URFDLB for 54-sticker array
        const FACE_IDX = { U: 0, R: 1, F: 2, D: 3, L: 4, B: 5 }; // Index of face in FACES_ORDER

        const EDGE_STICKERS = {
            UF: [FACE_IDX.U * 9 + 7, FACE_IDX.F * 9 + 1], UR: [FACE_IDX.U * 9 + 5, FACE_IDX.R * 9 + 1], UB: [FACE_IDX.U * 9 + 1, FACE_IDX.B * 9 + 1], UL: [FACE_IDX.U * 9 + 3, FACE_IDX.L * 9 + 1],
            DF: [FACE_IDX.D * 9 + 1, FACE_IDX.F * 9 + 7], DR: [FACE_IDX.D * 9 + 5, FACE_IDX.R * 9 + 7], DB: [FACE_IDX.D * 9 + 7, FACE_IDX.B * 9 + 7], DL: [FACE_IDX.D * 9 + 3, FACE_IDX.L * 9 + 7],
            FR: [FACE_IDX.F * 9 + 5, FACE_IDX.R * 9 + 3], FL: [FACE_IDX.F * 9 + 3, FACE_IDX.L * 9 + 5], BR: [FACE_IDX.B * 9 + 3, FACE_IDX.R * 9 + 5], BL: [FACE_IDX.B * 9 + 5, FACE_IDX.L * 9 + 3]
        };
        const EDGE_KEYS = Object.keys(EDGE_STICKERS);

        function getInitialLogicalState() {
            let state = [];
            FACES_ORDER.forEach(faceChar => {
                for (let i = 0; i < 9; i++) {
                    state.push(LOGICAL_COLORS_MAP[faceChar]);
                }
            });
            return state;
        }

        function getLogicalStateFromScramble(scrambleMoves) {
            let state = getInitialLogicalState();
            if (scrambleMoves && scrambleMoves.length > 0) {
                for (const move of scrambleMoves) {
                    applyMoveToLogicalState(move, state);
                }
            }
            return state;
        }

        function applyMoveToLogicalState(notation, state) {
            const prime = notation.includes("'");
            const double = notation.includes("2");
            const faceChar = notation.charAt(0);
            let numRotations = double ? 2 : (prime ? 3 : 1);
            for (let i = 0; i < numRotations; i++) {
                rotateFaceLogicallyCW(faceChar, state);
            }
        }

        function rotateFaceLogicallyCW(faceChar, state) {
            const fBase = FACE_IDX[faceChar] * 9;
            let onFace = [
                state[fBase + 0], state[fBase + 1], state[fBase + 2],
                state[fBase + 3], state[fBase + 4], state[fBase + 5],
                state[fBase + 6], state[fBase + 7], state[fBase + 8]
            ];
            state[fBase + 0] = onFace[6]; state[fBase + 1] = onFace[3]; state[fBase + 2] = onFace[0];
            state[fBase + 3] = onFace[7]; /* center */ state[fBase + 5] = onFace[1];
            state[fBase + 6] = onFace[8]; state[fBase + 7] = onFace[5]; state[fBase + 8] = onFace[2];

            let t = []; 
            switch (faceChar) {
                case 'U': t=[state[FACE_IDX.B*9+0],state[FACE_IDX.B*9+1],state[FACE_IDX.B*9+2]]; for(let i=0;i<3;i++){state[FACE_IDX.B*9+i]=state[FACE_IDX.L*9+i];state[FACE_IDX.L*9+i]=state[FACE_IDX.F*9+i];state[FACE_IDX.F*9+i]=state[FACE_IDX.R*9+i];state[FACE_IDX.R*9+i]=t[i];} break;
                case 'D': t=[state[FACE_IDX.F*9+6],state[FACE_IDX.F*9+7],state[FACE_IDX.F*9+8]]; for(let i=0;i<3;i++){state[FACE_IDX.F*9+6+i]=state[FACE_IDX.L*9+6+i];state[FACE_IDX.L*9+6+i]=state[FACE_IDX.B*9+6+i];state[FACE_IDX.B*9+6+i]=state[FACE_IDX.R*9+6+i];state[FACE_IDX.R*9+6+i]=t[i];} break;
                case 'F': t=[state[FACE_IDX.U*9+6],state[FACE_IDX.U*9+7],state[FACE_IDX.U*9+8]]; state[FACE_IDX.U*9+6]=state[FACE_IDX.L*9+8];state[FACE_IDX.U*9+7]=state[FACE_IDX.L*9+5];state[FACE_IDX.U*9+8]=state[FACE_IDX.L*9+2]; state[FACE_IDX.L*9+8]=state[FACE_IDX.D*9+2];state[FACE_IDX.L*9+5]=state[FACE_IDX.D*9+1];state[FACE_IDX.L*9+2]=state[FACE_IDX.D*9+0]; state[FACE_IDX.D*9+2]=state[FACE_IDX.R*9+0];state[FACE_IDX.D*9+1]=state[FACE_IDX.R*9+3];state[FACE_IDX.D*9+0]=state[FACE_IDX.R*9+6]; state[FACE_IDX.R*9+0]=t[0];state[FACE_IDX.R*9+3]=t[1];state[FACE_IDX.R*9+6]=t[2]; break;
                case 'B': t=[state[FACE_IDX.U*9+2],state[FACE_IDX.U*9+1],state[FACE_IDX.U*9+0]]; state[FACE_IDX.U*9+2]=state[FACE_IDX.R*9+8];state[FACE_IDX.U*9+1]=state[FACE_IDX.R*9+5];state[FACE_IDX.U*9+0]=state[FACE_IDX.R*9+2]; state[FACE_IDX.R*9+8]=state[FACE_IDX.D*9+6];state[FACE_IDX.R*9+5]=state[FACE_IDX.D*9+7];state[FACE_IDX.R*9+2]=state[FACE_IDX.D*9+8]; state[FACE_IDX.D*9+6]=state[FACE_IDX.L*9+0];state[FACE_IDX.D*9+7]=state[FACE_IDX.L*9+3];state[FACE_IDX.D*9+8]=state[FACE_IDX.L*9+6]; state[FACE_IDX.L*9+0]=t[0];state[FACE_IDX.L*9+3]=t[1];state[FACE_IDX.L*9+6]=t[2]; break;
                case 'R': t=[state[FACE_IDX.U*9+2],state[FACE_IDX.U*9+5],state[FACE_IDX.U*9+8]]; state[FACE_IDX.U*9+2]=state[FACE_IDX.F*9+2];state[FACE_IDX.U*9+5]=state[FACE_IDX.F*9+5];state[FACE_IDX.U*9+8]=state[FACE_IDX.F*9+8]; state[FACE_IDX.F*9+2]=state[FACE_IDX.D*9+2];state[FACE_IDX.F*9+5]=state[FACE_IDX.D*9+5];state[FACE_IDX.F*9+8]=state[FACE_IDX.D*9+8]; state[FACE_IDX.D*9+2]=state[FACE_IDX.B*9+6];state[FACE_IDX.D*9+5]=state[FACE_IDX.B*9+3];state[FACE_IDX.D*9+8]=state[FACE_IDX.B*9+0]; state[FACE_IDX.B*9+6]=t[0];state[FACE_IDX.B*9+3]=t[1];state[FACE_IDX.B*9+0]=t[2]; break;
                case 'L': t=[state[FACE_IDX.U*9+0],state[FACE_IDX.U*9+3],state[FACE_IDX.U*9+6]]; state[FACE_IDX.U*9+0]=state[FACE_IDX.B*9+8];state[FACE_IDX.U*9+3]=state[FACE_IDX.B*9+5];state[FACE_IDX.U*9+6]=state[FACE_IDX.B*9+2]; state[FACE_IDX.B*9+8]=state[FACE_IDX.D*9+6];state[FACE_IDX.B*9+5]=state[FACE_IDX.D*9+3];state[FACE_IDX.B*9+2]=state[FACE_IDX.D*9+0]; state[FACE_IDX.D*9+6]=state[FACE_IDX.F*9+0];state[FACE_IDX.D*9+3]=state[FACE_IDX.F*9+3];state[FACE_IDX.D*9+0]=state[FACE_IDX.F*9+6]; state[FACE_IDX.F*9+0]=t[0];state[FACE_IDX.F*9+3]=t[1];state[FACE_IDX.F*9+6]=t[2]; break;
            }
        }
        
        function findEdge(state, color1, color2) {
            for (const edgeKey of EDGE_KEYS) {
                const s1Idx = EDGE_STICKERS[edgeKey][0];
                const s2Idx = EDGE_STICKERS[edgeKey][1];
                const s1Color = state[s1Idx];
                const s2Color = state[s2Idx];
                if ((s1Color === color1 && s2Color === color2) || (s1Color === color2 && s2Color === color1)) {
                    return { key: edgeKey, color1StickerIdx: (s1Color === color1 ? s1Idx : s2Idx), color2StickerIdx: (s1Color === color2 ? s1Idx : s2Idx) };
                }
            }
            return null;
        }

        function solveCubeAI_WhiteCross(state, solutionMoves) {
            const MAX_TOTAL_MOVES_CROSS = 40; 
            const MAX_MOVES_PER_EDGE_ATTEMPT = 10;  
            let crossPiecesSolvedCount = 0;

            const targetWhiteEdgesData = [ 
                { uSticker: EDGE_STICKERS.UF[0], sideSticker: EDGE_STICKERS.UF[1], uColor: LGC_U, sideColor: LOGICAL_COLORS_MAP.F, sideFace: 'F', key: 'UF'},
                { uSticker: EDGE_STICKERS.UR[0], sideSticker: EDGE_STICKERS.UR[1], uColor: LGC_U, sideColor: LOGICAL_COLORS_MAP.R, sideFace: 'R', key: 'UR'},
                { uSticker: EDGE_STICKERS.UB[0], sideSticker: EDGE_STICKERS.UB[1], uColor: LGC_U, sideColor: LOGICAL_COLORS_MAP.B, sideFace: 'B', key: 'UB'},
                { uSticker: EDGE_STICKERS.UL[0], sideSticker: EDGE_STICKERS.UL[1], uColor: LGC_U, sideColor: LOGICAL_COLORS_MAP.L, sideFace: 'L', key: 'UL'}
            ];
            
            for (let solveAttempts = 0; solveAttempts < MAX_TOTAL_MOVES_CROSS && crossPiecesSolvedCount < 4; solveAttempts++) {
                let progressMadeThisAttempt = false;
                for (const targetEdge of targetWhiteEdgesData) {
                    if (state[targetEdge.uSticker] === targetEdge.uColor && state[targetEdge.sideSticker] === targetEdge.sideColor) {
                        continue; 
                    }

                    let edgeInfo = findEdge(state, targetEdge.uColor, targetEdge.sideColor);
                    if (!edgeInfo) continue; 

                    messageArea.textContent = `AI: Cross - Targeting ${targetEdge.uColor}-${targetEdge.sideColor} (at ${edgeInfo.key})`;
                    let movesForThisSubStep = [];
                    let currentEdgeLocationKey = edgeInfo.key;
                    let whiteStickerIsOnFace1 = state[EDGE_STICKERS[currentEdgeLocationKey][0]] === LGC_U;

                    // Case 1: Edge is in U layer but wrong
                    if (currentEdgeLocationKey.startsWith('U')) {
                        let sideFaceOfCurrentSlot = currentEdgeLocationKey.charAt(1); // e.g., 'F' from "UF"
                        movesForThisSubStep.push(sideFaceOfCurrentSlot + "2"); // Move to D layer
                    }
                    // Case 2: Edge is in E Slice (FR, FL, BR, BL)
                    else if (["FR", "FL", "BR", "BL"].includes(currentEdgeLocationKey)) {
                        let firstFace = currentEdgeLocationKey.charAt(0);
                        let secondFace = currentEdgeLocationKey.charAt(1);
                        // Simplistic: move to D layer using one of its faces
                        // This needs smarter logic to choose which face to turn to preserve U layer cross
                        if (state[EDGE_STICKERS[currentEdgeLocationKey][0]] === LGC_U) { // Color1 is White (e.g., F part of FR)
                            movesForThisSubStep.push(firstFace + "'", "D'", firstFace);
                        } else { // Color2 is White (e.g., R part of FR)
                            movesForThisSubStep.push(secondFace, "D", secondFace + "'");
                        }
                    }
                    // Case 3: Edge is in D layer
                    else if (currentEdgeLocationKey.startsWith('D')) {
                        // Determine alignment needed for D layer piece
                        let targetDFaceSlotSide = targetEdge.sideFace; // 'F', 'R', 'B', or 'L'
                        let currentDFaceSlotSide = currentEdgeLocationKey.charAt(1); // 'F', 'R', 'B', or 'L'
                        
                        let dTurns = 0;
                        const dOrder = ['F', 'R', 'B', 'L']; // Order of side faces for D turns
                        let currentIdx = dOrder.indexOf(currentDFaceSlotSide);
                        let targetIdx = dOrder.indexOf(targetDFaceSlotSide);
                        if (currentIdx !== -1 && targetIdx !== -1) {
                            dTurns = (targetIdx - currentIdx + 4) % 4;
                        }

                        if (dTurns === 1) movesForThisSubStep.push("D");
                        else if (dTurns === 2) movesForThisSubStep.push("D2");
                        else if (dTurns === 3) movesForThisSubStep.push("D'");
                        
                        // After D alignment, the piece is logically under its target sideFace.
                        // Now check orientation and apply algorithm.
                        // Re-find the edge as D turns might have changed its key (e.g. DF -> DR)
                        let tempStateAfterDTurns = JSON.parse(JSON.stringify(state));
                        movesForThisSubStep.forEach(m => applyMoveToLogicalState(m, tempStateAfterDTurns));
                        let alignedEdgeInfo = findEdge(tempStateAfterDTurns, targetEdge.uColor, targetEdge.sideColor);

                        if (alignedEdgeInfo && alignedEdgeInfo.key.startsWith('D')) {
                             // White is on the D-face part of the edge
                            if (tempStateAfterDTurns[EDGE_STICKERS[alignedEdgeInfo.key][0]] === LGC_U) {
                                movesForThisSubStep.push(targetEdge.sideFace + "2");
                            } 
                            // White is on the side-face part of the edge
                            else if (tempStateAfterDTurns[EDGE_STICKERS[alignedEdgeInfo.key][1]] === LGC_U) {
                                movesForThisSubStep.push(targetEdge.sideFace + "'", "U'", targetEdge.sideFace);
                            }
                        } else { // Should be at the D-slot of targetEdge.sideFace, if D-turns were correct
                             movesForThisSubStep.push(targetEdge.sideFace + "2"); // Fallback if orientation check fails
                        }
                    }

                    if (movesForThisSubStep.length > 0 && movesForThisSubStep.length <= MAX_MOVES_PER_EDGE_ATTEMPT) {
                        movesForThisSubStep.forEach(m => {
                            solutionMoves.push(m);
                            applyMoveToLogicalState(m, state); // Apply to master state for next edge
                        });
                        progressMadeThisAttempt = true; 
                        break; // Re-evaluate all edges from the new state
                    }
                } // end for each targetEdge
                
                if (!progressMadeThisAttempt && solveAttempts > 0) { 
                    let tempSolvedCount = 0;
                    targetWhiteEdgesData.forEach(te => {if(state[te.uSticker]===te.uColor && state[te.sideSticker]===te.sideColor)tempSolvedCount++;});
                    if (tempSolvedCount === 4) { crossPiecesSolvedCount = 4; break; }
                    if (solveAttempts > MAX_TOTAL_MOVES_CROSS / 2) { console.warn("AI Cross: Stuck, breaking."); break; }
                }
                crossPiecesSolvedCount = 0;
                targetWhiteEdgesData.forEach(te => {if(state[te.uSticker]===te.uColor && state[te.sideSticker]===te.sideColor)crossPiecesSolvedCount++;});
                if (crossPiecesSolvedCount === 4) break;
            } 

            if (crossPiecesSolvedCount < 4) {
                console.warn(`AI: White cross only partially solved (${crossPiecesSolvedCount}/4). Total moves: ${solutionMoves.length}`);
            }
        }

        function getCubiesInLayer(x,i){const l=[];const o=(CUBE_SIZE-1)/2;const t=(i-o)*EFFECTIVE_CUBIE_SIZE;cubies.forEach(c=>{let p=(x==='x')?c.position.x:(x==='y')?c.position.y:c.position.z;if(Math.abs(p-t)<EFFECTIVE_CUBIE_SIZE/2)l.push(c);});return l;}
        
        function rotateLayerAroundAxis(axis, layerIndex, angle, onCompleteCallback) {
            isAnimating = true;
            controls.enabled = false;
            updateGameUI();
            pivot.rotation.set(0, 0, 0);
            pivot.position.set(0, 0, 0);
            const layerCubies = getCubiesInLayer(axis, layerIndex);

            if (layerCubies.length === 0) {
                isAnimating = false; controls.enabled = true; updateGameUI();
                if (onCompleteCallback) onCompleteCallback(true);
                return;
            }
            layerCubies.forEach(cubie => pivot.attach(cubie));
            
            let currentAngle = 0; // Fixed: was 'cA' previously in compacted code
            const targetAngle = angle;
            const animationSpeed = 0.08;

            function animateRotationStep() {
                let deltaAngle = targetAngle * animationSpeed;
                if (Math.abs(currentAngle + deltaAngle) >= Math.abs(targetAngle)) {
                    deltaAngle = targetAngle - currentAngle;
                }
                if (axis === 'x') pivot.rotation.x += deltaAngle;
                else if (axis === 'y') pivot.rotation.y += deltaAngle;
                else pivot.rotation.z += deltaAngle;
                currentAngle += deltaAngle;

                if (Math.abs(currentAngle - targetAngle) < 0.001) { 
                    if (axis === 'x') pivot.rotation.x = targetAngle;
                    else if (axis === 'y') pivot.rotation.y = targetAngle;
                    else pivot.rotation.z = targetAngle;
                    
                    [...layerCubies].forEach(cubie => scene.attach(cubie)); 
                    
                    cubies.forEach(c => { 
                        c.position.x = Math.round(c.position.x / EFFECTIVE_CUBIE_SIZE) * EFFECTIVE_CUBIE_SIZE;
                        c.position.y = Math.round(c.position.y / EFFECTIVE_CUBIE_SIZE) * EFFECTIVE_CUBIE_SIZE;
                        c.position.z = Math.round(c.position.z / EFFECTIVE_CUBIE_SIZE) * EFFECTIVE_CUBIE_SIZE;
                    });
                    isAnimating = false; controls.enabled = true; updateGameUI();
                    if (onCompleteCallback) onCompleteCallback(true);
                } else {
                    requestAnimationFrame(animateRotationStep);
                }
            }
            animateRotationStep();
        }

        function performMove(moveNotation, onCompleteCallback) {
            if (isAnimating) {
                if (onCompleteCallback) onCompleteCallback(false); // Indicate move was skipped
                return;
            }

            const isDouble = moveNotation.includes("2");
            const baseMove = isDouble ? moveNotation.slice(0, -1) : moveNotation; // e.g., "L" from "L2"

            const PI_2 = Math.PI / 2;
            let axis, layer, direction;

            // Determine axis, layer, direction for the base move (90 degrees)
            switch (baseMove) {
                case 'F':  axis = 'z'; layer = CUBE_SIZE - 1; direction = -1; break;
                case 'F\'': axis = 'z'; layer = CUBE_SIZE - 1; direction = 1;  break;
                case 'B':  axis = 'z'; layer = 0; direction = 1;  break;
                case 'B\'': axis = 'z'; layer = 0; direction = -1; break;
                case 'U':  axis = 'y'; layer = CUBE_SIZE - 1; direction = -1; break;
                case 'U\'': axis = 'y'; layer = CUBE_SIZE - 1; direction = 1;  break;
                case 'D':  axis = 'y'; layer = 0; direction = 1;  break;
                case 'D\'': axis = 'y'; layer = 0; direction = -1; break;
                case 'R':  axis = 'x'; layer = CUBE_SIZE - 1; direction = -1; break;
                case 'R\'': axis = 'x'; layer = CUBE_SIZE - 1; direction = 1;  break;
                case 'L':  axis = 'x'; layer = 0; direction = 1;  break;
                case 'L\'': axis = 'x'; layer = 0; direction = -1; break;
                default:
                    console.warn("Unknown move base:", baseMove, "(from original:", moveNotation, ")");
                    if (onCompleteCallback) onCompleteCallback(false);
                    return;
            }

            if (isDouble) {
                // Perform the 90-degree move twice for a 180-degree "double" move
                rotateLayerAroundAxis(axis, layer, direction * PI_2, (success1) => {
                    if (success1) {
                        // Add a very slight delay before the second part of the double move
                        // This helps visually and prevents potential race conditions if any.
                        setTimeout(() => {
                           rotateLayerAroundAxis(axis, layer, direction * PI_2, onCompleteCallback);
                        }, 10); // Minimal delay
                    } else {
                        if (onCompleteCallback) onCompleteCallback(false); // First part failed
                    }
                });
            } else {
                // Single or prime move, perform one 90-degree rotation
                rotateLayerAroundAxis(axis, layer, direction * PI_2, onCompleteCallback);
            }
        }

        function handleScramble() {
            if (sequenceInProgress || isAnimating) return;
            messageArea.textContent = "Scrambling...";
            resetCubeVisuals(); 
            stopTimer(); elapsedTime = 0; updateTimerDisplay();

            const baseMoves = ['F', 'B', 'U', 'D', 'R', 'L'];
            const modifiers = ['', "'", '2'];
            lastScrambleSequence = []; 
            let previousMoveFace = '';
            let secondPreviousMoveFace = '';
            const numScrambleMoves = 20 + Math.floor(Math.random() * 11); 

            for (let i = 0; i < numScrambleMoves; i++) {
                let randomFace, move;
                do {
                    randomFace = baseMoves[Math.floor(Math.random() * baseMoves.length)];
                } while (randomFace === previousMoveFace || (randomFace === secondPreviousMoveFace && areOppositeFaces(randomFace, previousMoveFace)));
                
                let randomModifier = modifiers[Math.floor(Math.random() * modifiers.length)];
                move = randomFace + randomModifier;
                
                lastScrambleSequence.push(move);
                secondPreviousMoveFace = previousMoveFace;
                previousMoveFace = randomFace;
            }
            
            startFullMoveSequence([...lastScrambleSequence], (success) => {
                if (success) {
                    if (currentMode === 'play') playModeState = 'SCRAMBLED';
                    else if (currentMode === 'ai') aiModeState = 'SCRAMBLED'; 
                    messageArea.textContent = "Cube scrambled!";
                } else {
                    messageArea.textContent = "Scramble interrupted or failed.";
                }
                updateGameUI(); 
            });
        }

        function handleWatchAlgorithm(){if(!learnModeState.isLessonSetup||sequenceInProgress||isAnimating||learnModeState.isWatchingAll||learnModeState.currentMoveIndex>0)return;messageArea.textContent=`AI performing: ${learnModeState.currentLesson.name}`;learnModeState.currentMoveIndex=0;learnModeState.isWatchingAll=true;updateGameUI();playNextLearnAlgorithmMove();}
        function handleNextLessonMove(){if(!learnModeState.isLessonSetup||sequenceInProgress||isAnimating||learnModeState.isWatchingAll||learnModeState.currentMoveIndex>=learnModeState.algorithmMoves.length)return;playNextLearnAlgorithmMove();}
        function playNextLearnAlgorithmMove(){if(!learnModeState.isLessonSetup||learnModeState.currentMoveIndex>=learnModeState.algorithmMoves.length){learnModeState.isWatchingAll=false;if(learnModeState.currentLesson&&learnModeState.currentMoveIndex>=learnModeState.algorithmMoves.length)messageArea.textContent=`Alg for ${learnModeState.currentLesson.name} complete.`;updateGameUI();return;}if(isAnimating){setTimeout(playNextLearnAlgorithmMove,50);return;}const m=learnModeState.algorithmMoves[learnModeState.currentMoveIndex];messageArea.textContent=`Learning ${learnModeState.currentMoveIndex+1}/${learnModeState.algorithmMoves.length}: ${m}`;performMove(m,s=>{if(!s){learnModeState.isWatchingAll=false;updateGameUI();return;}learnModeState.currentMoveIndex++;updateGameUI();if(learnModeState.isWatchingAll&&learnModeState.currentMoveIndex<learnModeState.algorithmMoves.length)setTimeout(playNextLearnAlgorithmMove,300);else if(learnModeState.isWatchingAll&&learnModeState.currentMoveIndex>=learnModeState.algorithmMoves.length){learnModeState.isWatchingAll=false;messageArea.textContent=`Alg for ${learnModeState.currentLesson.name} complete.`;updateGameUI();}});}
        function startTimer(){if(timerInterval)clearInterval(timerInterval);startTime=Date.now()-(elapsedTime*1000);timerInterval=setInterval(()=>{elapsedTime=(Date.now()-startTime)/1000;updateTimerDisplay();},100);}
        function stopTimer(){clearInterval(timerInterval);timerInterval=null;}
        function updateTimerDisplay(){timerDisplay.textContent=`Time: ${elapsedTime.toFixed(2)}s`;}
        function isSolved(){const e=0.01;for(const c of cubies){if(c.position.distanceTo(c.userData.initialWorldPos)>e)return false;if(Math.abs(Math.abs(c.quaternion.dot(c.userData.initialQuaternion))-1.0)>e)return false;}return true;}
        function checkIfSolved(){if(currentMode==='play'&&isSolved()){stopTimer();messageArea.textContent=`CONGRATULATIONS! Solved in ${elapsedTime.toFixed(2)}s!`;addHighScore(elapsedTime);playModeState='IDLE';updateGameUI();}}
        function loadHighScores(){const s=localStorage.getItem('retroRubiksHighScores');if(s)highScores=JSON.parse(s);}
        function saveHighScores(){localStorage.setItem('retroRubiksHighScores',JSON.stringify(highScores));}
        function addHighScore(t){const sc={time:parseFloat(t.toFixed(2))};highScores.push(sc);highScores.sort((a,b)=>a.time-b.time);highScores=highScores.slice(0,MAX_HIGH_SCORES);saveHighScores();displayHighScores();}
        function displayHighScores(){highScoresList.innerHTML='';if(highScores.length===0)highScoresList.innerHTML="<li>No scores yet.</li>";else highScores.forEach(s=>highScoresList.innerHTML+=`<li>${s.time.toFixed(2)}s</li>`);}
        function animate(){requestAnimationFrame(animate);if(controls&&controls.enabled)controls.update();if(renderer&&scene&&camera)renderer.render(scene,camera);}
    </script>
</body>
