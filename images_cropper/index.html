<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cropper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #cropper {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            touch-action: none;
        }
        #crop-box {
            position: absolute;
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            cursor: move;
        }
        .handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #3b82f6;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Ensure handles are above the box */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-4xl">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Image Cropper</h1>
        
        <div class="mb-4">
            <input type="file" id="imageInput" accept="image/*" 
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div id="cropper" class="hidden">
            <img id="image" class="max-w-full h-auto">
            <div id="crop-box">
                <div class="handle" id="top-left" style="top: 0; left: 0;"></div>
                <div class="handle" id="bottom-right" style="bottom: 0; right: 0;"></div>
            </div>
        </div>

        <div id="controls" class="mt-4 hidden">
            <button id="cropButton" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded mr-2">
                Crop & Download
            </button>
            <button id="resetButton" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">
                Reset
            </button>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const image = document.getElementById('image');
        const cropper = document.getElementById('cropper');
        const cropBox = document.getElementById('crop-box');
        const topLeft = document.getElementById('top-left');
        const bottomRight = document.getElementById('bottom-right');
        const cropButton = document.getElementById('cropButton');
        const resetButton = document.getElementById('resetButton');
        const controls = document.getElementById('controls');

        let isDragging = false;
        let isResizing = false;
        let activeHandle = null;
        let startX, startY, initialX, initialY, initialWidth, initialHeight;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    image.src = e.target.result;
                    cropper.classList.remove('hidden');
                    controls.classList.remove('hidden');
                    initCropBox();
                    image.onload = () => updateCropBox();
                };
                reader.readAsDataURL(file);
            }
        });

        function initCropBox() {
            initialX = 50;
            initialY = 50;
            initialWidth = 200;
            initialHeight = 200;
            updateCropBox();
        }

        function updateCropBox() {
            cropBox.style.left = `${initialX}px`;
            cropBox.style.top = `${initialY}px`;
            cropBox.style.width = `${initialWidth}px`;
            cropBox.style.height = `${initialHeight}px`;
        }

        // Event Listeners
        function addEventListeners(element, startFn, moveFn, endFn) {
            element.addEventListener('mousedown', startFn);
            element.addEventListener('touchstart', startFn);
            document.addEventListener('mousemove', moveFn);
            document.addEventListener('touchmove', moveFn, { passive: false });
            document.addEventListener('mouseup', endFn);
            document.addEventListener('touchend', endFn);
        }

        function getEventPosition(e) {
            return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : 
                            { x: e.clientX, y: e.clientY };
        }

        // Dragging
        function startDragging(e) {
            if (e.target === topLeft || e.target === bottomRight) return; // Prevent dragging when clicking handles
            e.preventDefault();
            isDragging = true;
            const pos = getEventPosition(e);
            startX = pos.x - initialX;
            startY = pos.y - initialY;
        }

        // Resizing
        function startResizing(handle) {
            return function(e) {
                e.preventDefault();
                e.stopPropagation(); // Prevent drag from triggering
                isResizing = true;
                activeHandle = handle;
                const pos = getEventPosition(e);
                startX = pos.x;
                startY = pos.y;
            }
        }

        function handleMove(e) {
            if (!isDragging && !isResizing) return;
            e.preventDefault();
            const pos = getEventPosition(e);

            if (isDragging) {
                initialX = Math.max(0, Math.min(pos.x - startX, image.width - initialWidth));
                initialY = Math.max(0, Math.min(pos.y - startY, image.height - initialHeight));
                updateCropBox();
            } else if (isResizing) {
                if (activeHandle === 'top-left') {
                    const newX = Math.min(pos.x, initialX + initialWidth - 50);
                    const newY = Math.min(pos.y, initialY + initialHeight - 50);
                    initialWidth += initialX - newX;
                    initialHeight += initialY - newY;
                    initialX = newX;
                    initialY = newY;
                } else if (activeHandle === 'bottom-right') {
                    initialWidth = Math.max(50, pos.x - initialX);
                    initialHeight = Math.max(50, pos.y - initialY);
                }

                // Constrain within image
                initialX = Math.max(0, initialX);
                initialY = Math.max(0, initialY);
                initialWidth = Math.min(initialWidth, image.width - initialX);
                initialHeight = Math.min(initialHeight, image.height - initialY);
                updateCropBox();
            }
        }

        function stopAction() {
            isDragging = false;
            isResizing = false;
            activeHandle = null;
        }

        // Add event listeners
        addEventListeners(cropBox, startDragging, handleMove, stopAction);
        addEventListeners(topLeft, startResizing('top-left'), handleMove, stopAction);
        addEventListeners(bottomRight, startResizing('bottom-right'), handleMove, stopAction);

        cropButton.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = initialWidth;
            canvas.height = initialHeight;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(
                image,
                initialX, initialY, initialWidth, initialHeight,
                0, 0, initialWidth, initialHeight
            );

            const link = document.createElement('a');
            link.download = 'cropped-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        resetButton.addEventListener('click', initCropBox);
    </script>
</body>
</html>
