<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cropper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #cropper {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            touch-action: none;
        }
        #crop-box {
            position: absolute;
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            cursor: move;
        }
        .handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #3b82f6;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-4xl">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Image Cropper</h1>
        
        <div class="mb-4">
            <input type="file" id="imageInput" accept="image/*" 
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div id="cropper" class="hidden">
            <img id="image" class="max-w-full h-auto">
            <div id="crop-box">
                <div class="handle" id="top-left" style="top: 0; left: 0;"></div>
                <div class="handle" id="bottom-right" style="bottom: 0; right: 0;"></div>
            </div>
        </div>

        <div id="controls" class="mt-4 hidden">
            <button id="cropButton" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded mr-2">
                Crop & Download
            </button>
            <button id="resetButton" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">
                Reset
            </button>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const image = document.getElementById('image');
        const cropper = document.getElementById('cropper');
        const cropBox = document.getElementById('crop-box');
        const topLeft = document.getElementById('top-left');
        const bottomRight = document.getElementById('bottom-right');
        const cropButton = document.getElementById('cropButton');
        const resetButton = document.getElementById('resetButton');
        const controls = document.getElementById('controls');

        let isDragging = false;
        let isResizing = false;
        let activeHandle = null;
        let startX, startY, cropX, cropY, cropWidth, cropHeight;
        let imageRect; // To store image position relative to viewport

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    image.src = e.target.result;
                    cropper.classList.remove('hidden');
                    controls.classList.remove('hidden');
                    image.onload = () => {
                        imageRect = image.getBoundingClientRect();
                        initCropBox();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        function initCropBox() {
            cropX = 50;
            cropY = 50;
            cropWidth = 200;
            cropHeight = 200;
            updateCropBox();
        }

        function updateCropBox() {
            cropBox.style.left = `${cropX}px`;
            cropBox.style.top = `${cropY}px`;
            cropBox.style.width = `${cropWidth}px`;
            cropBox.style.height = `${cropHeight}px`;
        }

        function addEventListeners(element, startFn, moveFn, endFn) {
            element.addEventListener('mousedown', startFn);
            element.addEventListener('touchstart', startFn);
            document.addEventListener('mousemove', moveFn);
            document.addEventListener('touchmove', moveFn, { passive: false });
            document.addEventListener('mouseup', endFn);
            document.addEventListener('touchend', endFn);
        }

        function getEventPosition(e) {
            const pos = e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : 
                                  { x: e.clientX, y: e.clientY };
            // Adjust for image position
            return {
                x: pos.x - imageRect.left,
                y: pos.y - imageRect.top
            };
        }

        function startDragging(e) {
            if (e.target === topLeft || e.target === bottomRight) return;
            e.preventDefault();
            isDragging = true;
            const pos = getEventPosition(e);
            startX = pos.x - cropX;
            startY = pos.y - cropY;
        }

        function startResizing(handle) {
            return function(e) {
                e.preventDefault();
                e.stopPropagation();
                isResizing = true;
                activeHandle = handle;
                const pos = getEventPosition(e);
                startX = pos.x;
                startY = pos.y;
            }
        }

        function handleMove(e) {
            if (!isDragging && !isResizing) return;
            e.preventDefault();
            const pos = getEventPosition(e);

            if (isDragging) {
                cropX = Math.max(0, Math.min(pos.x - startX, image.width - cropWidth));
                cropY = Math.max(0, Math.min(pos.y - startY, image.height - cropHeight));
                updateCropBox();
            } else if (isResizing) {
                if (activeHandle === 'top-left') {
                    const newX = Math.min(pos.x, cropX + cropWidth - 50);
                    const newY = Math.min(pos.y, cropY + cropHeight - 50);
                    cropWidth += cropX - newX;
                    cropHeight += cropY - newY;
                    cropX = newX;
                    cropY = newY;
                } else if (activeHandle === 'bottom-right') {
                    cropWidth = Math.max(50, pos.x - cropX);
                    cropHeight = Math.max(50, pos.y - cropY);
                }

                // Constrain within image
                cropX = Math.max(0, cropX);
                cropY = Math.max(0, cropY);
                cropWidth = Math.min(cropWidth, image.width - cropX);
                cropHeight = Math.min(cropHeight, image.height - cropY);
                updateCropBox();
            }
        }

        function stopAction() {
            isDragging = false;
            isResizing = false;
            activeHandle = null;
        }

        addEventListeners(cropBox, startDragging, handleMove, stopAction);
        addEventListeners(topLeft, startResizing('top-left'), handleMove, stopAction);
        addEventListeners(bottomRight, startResizing('bottom-right'), handleMove, stopAction);

        cropButton.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = cropWidth;
            canvas.height = cropHeight;
            const ctx = canvas.getContext('2d');
            
            // Adjust for natural image size vs displayed size
            const scaleX = image.naturalWidth / image.width;
            const scaleY = image.naturalHeight / image.height;
            
            ctx.drawImage(
                image,
                cropX * scaleX, cropY * scaleY, cropWidth * scaleX, cropHeight * scaleY,
                0, 0, cropWidth, cropHeight
            );

            const link = document.createElement('a');
            link.download = 'cropped-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        resetButton.addEventListener('click', initCropBox);
    </script>
</body>
</html>
