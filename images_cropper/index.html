<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cropper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #cropper {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            touch-action: none;
            user-select: none;
        }
        #crop-box {
            position: absolute;
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            cursor: move;
        }
        .handle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #3b82f6;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            touch-action: manipulation;
        }
        #preview-container {
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-4xl">
        <h1 class="text-3xl font-bold mb-6 text-gray-800 flex items-center">
            <svg class="w-8 h-8 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
            Image Cropper
        </h1>

        <div class="mb-6">
            <input type="file" id="imageInput" accept="image/*" 
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition duration-200">
        </div>

        <div id="cropper" class="hidden">
            <img id="image" class="max-w-full h-auto rounded-lg">
            <div id="crop-box">
                <div class="handle" id="top-left" style="top: 0; left: 0;"></div>
                <div class="handle" id="bottom-right" style="bottom: 0; right: 0;"></div>
            </div>
        </div>

        <div id="preview-container" class="mt-6 hidden">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Preview</h2>
            <img id="preview" class="max-w-full h-auto rounded-lg shadow-md">
        </div>

        <div id="controls" class="mt-6 hidden flex flex-col space-y-4">
            <div class="flex space-x-2">
                <button id="cropButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center transition duration-200">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m2.879 2.879L5 19m7-7l-7-7" />
                    </svg>
                    Crop
                </button>
                <button id="shareButton" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg flex items-center transition duration-200 hidden">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                    </svg>
                    Share
                </button>
                <button id="downloadButton" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg flex items-center transition duration-200 hidden">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download
                </button>
                <button id="resetButton" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg flex items-center transition duration-200">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Reset
                </button>
            </div>
            <div class="flex flex-col space-y-2">
                <label class="font-semibold text-gray-700">Prepare for:</label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <button id="instagramBtn" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg flex items-center justify-center transition duration-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        </svg>
                        Instagram
                    </button>
                    <button id="xBtn" class="bg-blue-400 hover:bg-blue-500 text-white py-2 px-4 rounded-lg flex items-center justify-center transition duration-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                        X
                    </button>
                    <button id="facebookBtn" class="bg-blue-700 hover:bg-blue-800 text-white py-2 px-4 rounded-lg flex items-center justify-center transition duration-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        Facebook
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const image = document.getElementById('image');
        const cropper = document.getElementById('cropper');
        const cropBox = document.getElementById('crop-box');
        const topLeft = document.getElementById('top-left');
        const bottomRight = document.getElementById('bottom-right');
        const cropButton = document.getElementById('cropButton');
        const shareButton = document.getElementById('shareButton');
        const downloadButton = document.getElementById('downloadButton');
        const resetButton = document.getElementById('resetButton');
        const controls = document.getElementById('controls');
        const instagramBtn = document.getElementById('instagramBtn');
        const xBtn = document.getElementById('xBtn');
        const facebookBtn = document.getElementById('facebookBtn');
        const previewContainer = document.getElementById('preview-container');
        const preview = document.getElementById('preview');

        let isDragging = false, isResizing = false, activeHandle = null;
        let startX, startY, cropX, cropY, cropWidth, cropHeight;
        let imageRect, scaleX, scaleY, croppedCanvas, outputCanvas;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    image.src = e.target.result;
                    cropper.classList.remove('hidden');
                    controls.classList.remove('hidden');
                    previewContainer.classList.add('hidden');
                    shareButton.classList.add('hidden');
                    downloadButton.classList.add('hidden');
                    image.onload = () => {
                        imageRect = image.getBoundingClientRect();
                        scaleX = image.naturalWidth / image.width;
                        scaleY = image.naturalHeight / image.height;
                        initCropBox();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        function initCropBox() {
            cropX = 50;
            cropY = 50;
            cropWidth = 200;
            cropHeight = 200;
            updateCropBox();
        }

        function updateCropBox() {
            cropBox.style.left = `${cropX}px`;
            cropBox.style.top = `${cropY}px`;
            cropBox.style.width = `${cropWidth}px`;
            cropBox.style.height = `${cropHeight}px`;
        }

        function addEventListeners(element, startFn) {
            element.addEventListener('mousedown', startFn);
            element.addEventListener('touchstart', startFn);
        }

        function getEventPosition(e) {
            const pos = e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : 
                                  { x: e.clientX, y: e.clientY };
            return { x: pos.x - imageRect.left, y: pos.y - imageRect.top };
        }

        function startDragging(e) {
            if (e.target === topLeft || e.target === bottomRight) return;
            e.preventDefault();
            isDragging = true;
            const pos = getEventPosition(e);
            startX = pos.x - cropX;
            startY = pos.y - cropY;
            handleStart(e);
        }

        function startResizing(handle) {
            return function(e) {
                e.preventDefault();
                e.stopPropagation();
                isResizing = true;
                activeHandle = handle;
                const pos = getEventPosition(e);
                startX = pos.x;
                startY = pos.y;
                handleStart(e);
            }
        }

        function handleStart(e) {
            const moveHandler = (e) => {
                e.preventDefault();
                const pos = getEventPosition(e);
                if (isDragging) {
                    cropX = Math.max(0, Math.min(pos.x - startX, image.width - cropWidth));
                    cropY = Math.max(0, Math.min(pos.y - startY, image.height - cropHeight));
                    updateCropBox();
                } else if (isResizing) {
                    if (activeHandle === 'top-left') {
                        const newX = Math.min(pos.x, cropX + cropWidth - 50);
                        const newY = Math.min(pos.y, cropY + cropHeight - 50);
                        cropWidth += cropX - newX;
                        cropHeight += cropY - newY;
                        cropX = newX;
                        cropY = newY;
                    } else if (activeHandle === 'bottom-right') {
                        cropWidth = Math.max(50, pos.x - cropX);
                        cropHeight = Math.max(50, pos.y - cropY);
                    }
                    cropX = Math.max(0, cropX);
                    cropY = Math.max(0, cropY);
                    cropWidth = Math.min(cropWidth, image.width - cropX);
                    cropHeight = Math.min(cropHeight, image.height - cropY);
                    updateCropBox();
                }
            };

            const endHandler = () => {
                isDragging = false;
                isResizing = false;
                activeHandle = null;
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('touchmove', moveHandler);
                document.removeEventListener('mouseup', endHandler);
                document.removeEventListener('touchend', endHandler);
            };

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('touchmove', moveHandler, { passive: false });
            document.addEventListener('mouseup', endHandler);
            document.addEventListener('touchend', endHandler);
        }

        addEventListeners(cropBox, startDragging);
        addEventListeners(topLeft, startResizing('top-left'));
        addEventListeners(bottomRight, startResizing('bottom-right'));

        function cropImage() {
            croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = Math.round(cropWidth * scaleX);
            croppedCanvas.height = Math.round(cropHeight * scaleY);
            const ctx = croppedCanvas.getContext('2d');
            ctx.drawImage(
                image,
                cropX * scaleX, cropY * scaleY, cropWidth * scaleX, cropHeight * scaleY,
                0, 0, croppedCanvas.width, croppedCanvas.height
            );
            preview.src = croppedCanvas.toDataURL('image/png');
            previewContainer.classList.remove('hidden');
            shareButton.classList.remove('hidden');
            downloadButton.classList.remove('hidden');
        }

        cropButton.addEventListener('click', cropImage);

        function prepareForPlatform(width, height, platform) {
            if (!croppedCanvas) {
                alert('Please crop the image first!');
                return;
            }
            outputCanvas = document.createElement('canvas');
            const aspectRatio = width / height;
            let newWidth, newHeight;

            if (cropWidth / cropHeight > aspectRatio) {
                newWidth = Math.round(cropHeight * scaleY * aspectRatio);
                newHeight = Math.round(cropHeight * scaleY);
            } else {
                newWidth = Math.round(cropWidth * scaleX);
                newHeight = Math.round(cropWidth * scaleX / aspectRatio);
            }

            outputCanvas.width = width;
            outputCanvas.height = height;
            const ctx = outputCanvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            const offsetX = (width - newWidth) / 2;
            const offsetY = (height - newHeight) / 2;
            ctx.drawImage(croppedCanvas, offsetX, offsetY, newWidth, newHeight);

            preview.src = outputCanvas.toDataURL('image/png');
            previewContainer.classList.remove('hidden');
            shareButton.classList.remove('hidden');
            downloadButton.classList.remove('hidden');
        }

        instagramBtn.addEventListener('click', () => prepareForPlatform(1080, 1350, 'instagram'));
        xBtn.addEventListener('click', () => prepareForPlatform(1200, 675, 'x'));
        facebookBtn.addEventListener('click', () => prepareForPlatform(1200, 628, 'facebook'));

        shareButton.addEventListener('click', async () => {
            if (!outputCanvas && !croppedCanvas) {
                alert('Please crop and prepare an image first!');
                return;
            }
            const canvasToShare = outputCanvas || croppedCanvas;
            if (navigator.share && navigator.canShare) {
                try {
                    const blob = await new Promise(resolve => canvasToShare.toBlob(resolve, 'image/png'));
                    const file = new File([blob], 'cropped-image.png', { type: 'image/png' });
                    await navigator.share({
                        files: [file],
                        title: 'Cropped Image',
                        text: 'Check out my cropped image!'
                    });
                } catch (err) {
                    console.error('Share failed:', err);
                    alert('Sharing not supported or failed. Try downloading instead.');
                }
            } else {
                alert('Share feature not supported on this browser. Use the download button.');
            }
        });

        downloadButton.addEventListener('click', () => {
            if (!outputCanvas && !croppedCanvas) {
                alert('Please crop and prepare an image first!');
                return;
            }
            const canvasToDownload = outputCanvas || croppedCanvas;
            const link = document.createElement('a');
            link.download = 'cropped-image.png';
            link.href = canvasToDownload.toDataURL('image/png');
            link.click();
        });

        resetButton.addEventListener('click', () => {
            initCropBox();
            previewContainer.classList.add('hidden');
            shareButton.classList.add('hidden');
            downloadButton.classList.add('hidden');
            croppedCanvas = null;
            outputCanvas = null;
        });
    </script>
</body>
</html>
