<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cropper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #cropper {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            touch-action: none;
            user-select: none;
        }
        #crop-box {
            position: absolute;
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            cursor: move;
        }
        .handle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #3b82f6;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-4xl">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Image Cropper</h1>
        
        <div class="mb-4">
            <input type="file" id="imageInput" accept="image/*" 
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div id="cropper" class="hidden">
            <img id="image" class="max-w-full h-auto">
            <div id="crop-box">
                <div class="handle" id="top-left" style="top: 0; left: 0;"></div>
                <div class="handle" id="bottom-right" style="bottom: 0; right: 0;"></div>
            </div>
        </div>

        <div id="controls" class="mt-4 hidden flex flex-col space-y-4">
            <div class="flex space-x-2">
                <button id="cropButton" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                    Crop
                </button>
                <button id="shareButton" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded hidden">
                    Share
                </button>
                <button id="resetButton" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">
                    Reset
                </button>
            </div>
            <div class="flex flex-col space-y-2">
                <label class="font-semibold">Prepare for:</label>
                <button id="instagramBtn" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded">Instagram (4:5)</button>
                <button id="xBtn" class="bg-blue-400 hover:bg-blue-500 text-white py-2 px-4 rounded">X (16:9)</button>
                <button id="facebookBtn" class="bg-blue-700 hover:bg-blue-800 text-white py-2 px-4 rounded">Facebook (1.91:1)</button>
            </div>
            <div id="instructions" class="text-sm text-gray-600 hidden">
                <p>Download completed! To post:</p>
                <ul class="list-disc pl-5">
                    <li>For Instagram: Open the app, tap +, select the downloaded image, and share.</li>
                    <li>For X: Open the app, tap the compose button, attach the image, and post.</li>
                    <li>For Facebook: Open the app, tap "What's on your mind?", attach the image, and post.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const image = document.getElementById('image');
        const cropper = document.getElementById('cropper');
        const cropBox = document.getElementById('crop-box');
        const topLeft = document.getElementById('top-left');
        const bottomRight = document.getElementById('bottom-right');
        const cropButton = document.getElementById('cropButton');
        const shareButton = document.getElementById('shareButton');
        const resetButton = document.getElementById('resetButton');
        const controls = document.getElementById('controls');
        const instagramBtn = document.getElementById('instagramBtn');
        const xBtn = document.getElementById('xBtn');
        const facebookBtn = document.getElementById('facebookBtn');
        const instructions = document.getElementById('instructions');

        let isDragging = false, isResizing = false, activeHandle = null;
        let startX, startY, cropX, cropY, cropWidth, cropHeight;
        let imageRect, scaleX, scaleY, croppedCanvas;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    image.src = e.target.result;
                    cropper.classList.remove('hidden');
                    controls.classList.remove('hidden');
                    image.onload = () => {
                        imageRect = image.getBoundingClientRect();
                        scaleX = image.naturalWidth / image.width;
                        scaleY = image.naturalHeight / image.height;
                        initCropBox();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        function initCropBox() {
            cropX = 50;
            cropY = 50;
            cropWidth = 200;
            cropHeight = 200;
            updateCropBox();
            shareButton.classList.add('hidden');
        }

        function updateCropBox() {
            cropBox.style.left = `${cropX}px`;
            cropBox.style.top = `${cropY}px`;
            cropBox.style.width = `${cropWidth}px`;
            cropBox.style.height = `${cropHeight}px`;
        }

        function addEventListeners(element, startFn) {
            element.addEventListener('mousedown', startFn);
            element.addEventListener('touchstart', startFn);
        }

        function getEventPosition(e) {
            const pos = e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : 
                                  { x: e.clientX, y: e.clientY };
            return { x: pos.x - imageRect.left, y: pos.y - imageRect.top };
        }

        function startDragging(e) {
            if (e.target === topLeft || e.target === bottomRight) return;
            e.preventDefault();
            isDragging = true;
            const pos = getEventPosition(e);
            startX = pos.x - cropX;
            startY = pos.y - cropY;
            handleStart(e);
        }

        function startResizing(handle) {
            return function(e) {
                e.preventDefault();
                e.stopPropagation();
                isResizing = true;
                activeHandle = handle;
                const pos = getEventPosition(e);
                startX = pos.x;
                startY = pos.y;
                handleStart(e);
            }
        }

        function handleStart(e) {
            const moveHandler = (e) => {
                e.preventDefault();
                const pos = getEventPosition(e);
                if (isDragging) {
                    cropX = Math.max(0, Math.min(pos.x - startX, image.width - cropWidth));
                    cropY = Math.max(0, Math.min(pos.y - startY, image.height - cropHeight));
                    updateCropBox();
                } else if (isResizing) {
                    if (activeHandle === 'top-left') {
                        const newX = Math.min(pos.x, cropX + cropWidth - 50);
                        const newY = Math.min(pos.y, cropY + cropHeight - 50);
                        cropWidth += cropX - newX;
                        cropHeight += cropY - newY;
                        cropX = newX;
                        cropY = newY;
                    } else if (activeHandle === 'bottom-right') {
                        cropWidth = Math.max(50, pos.x - cropX);
                        cropHeight = Math.max(50, pos.y - cropY);
                    }
                    cropX = Math.max(0, cropX);
                    cropY = Math.max(0, cropY);
                    cropWidth = Math.min(cropWidth, image.width - cropX);
                    cropHeight = Math.min(cropHeight, image.height - cropY);
                    updateCropBox();
                }
            };

            const endHandler = () => {
                isDragging = false;
                isResizing = false;
                activeHandle = null;
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('touchmove', moveHandler);
                document.removeEventListener('mouseup', endHandler);
                document.removeEventListener('touchend', endHandler);
            };

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('touchmove', moveHandler, { passive: false });
            document.addEventListener('mouseup', endHandler);
            document.addEventListener('touchend', endHandler);
        }

        addEventListeners(cropBox, startDragging);
        addEventListeners(topLeft, startResizing('top-left'));
        addEventListeners(bottomRight, startResizing('bottom-right'));

        function cropImage() {
            croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = Math.round(cropWidth * scaleX);
            croppedCanvas.height = Math.round(cropHeight * scaleY);
            const ctx = croppedCanvas.getContext('2d');
            ctx.drawImage(
                image,
                cropX * scaleX, cropY * scaleY, cropWidth * scaleX, cropHeight * scaleY,
                0, 0, croppedCanvas.width, croppedCanvas.height
            );
            shareButton.classList.remove('hidden');
        }

        cropButton.addEventListener('click', cropImage);

        shareButton.addEventListener('click', async () => {
            if (!croppedCanvas) return;
            if (navigator.share && navigator.canShare) {
                try {
                    const blob = await new Promise(resolve => croppedCanvas.toBlob(resolve, 'image/png'));
                    const file = new File([blob], 'cropped-image.png', { type: 'image/png' });
                    await navigator.share({
                        files: [file],
                        title: 'Cropped Image',
                        text: 'Check out my cropped image!'
                    });
                } catch (err) {
                    console.error('Share failed:', err);
                    alert('Sharing not supported or failed. Try downloading instead.');
                }
            } else {
                alert('Share feature not supported on this browser. Use the platform buttons to download.');
            }
        });

        function prepareForPlatform(width, height, platform) {
            if (!croppedCanvas) {
                alert('Please crop the image first!');
                return;
            }
            const canvas = document.createElement('canvas');
            const aspectRatio = width / height;
            let newWidth, newHeight;

            if (cropWidth / cropHeight > aspectRatio) {
                newWidth = Math.round(cropHeight * scaleY * aspectRatio);
                newHeight = Math.round(cropHeight * scaleY);
            } else {
                newWidth = Math.round(cropWidth * scaleX);
                newHeight = Math.round(cropWidth * scaleX / aspectRatio);
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            const offsetX = (width - newWidth) / 2;
            const offsetY = (height - newHeight) / 2;
            ctx.drawImage(croppedCanvas, offsetX, offsetY, newWidth, newHeight);

            const link = document.createElement('a');
            link.download = `cropped-${platform}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            instructions.classList.remove('hidden');
        }

        instagramBtn.addEventListener('click', () => prepareForPlatform(1080, 1350, 'instagram'));
        xBtn.addEventListener('click', () => prepareForPlatform(1200, 675, 'x'));
        facebookBtn.addEventListener('click', () => prepareForPlatform(1200, 628, 'facebook'));

        resetButton.addEventListener('click', initCropBox);
    </script>
</body>
</html>
